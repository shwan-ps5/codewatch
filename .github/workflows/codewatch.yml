# codewatch checks itself: lint, the full test suite (in four parallel shards), and every analyzer over the whole
# repository with every open issue failing the run (codewatch check --all --strict). Findings reviewed as safe or
# false positives are listed with their reasons in codewatch-reviews.json, and the run's summary page shows them all.
name: codewatch checks itself

on:
  push:
    branches: [main, detection-gaps]
  pull_request:

permissions:
  contents: read

concurrency:
  group: codewatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Tests
        env:
          CODEWATCH_TEST_SHARD: ${{ matrix.shard }}/4
        run: venv/bin/pytest -q -n auto

  self-check:
    name: codewatch on its own code
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Lint
        run: venv/bin/ruff check .
      - name: codewatch check --all --strict
        run: venv/bin/codewatch check --all --strict

  # A few dozen real CVE fix pairs (benchmarks/smoke.json), re-scored on every push and pull request: a change that
  # loses one of these detections, or flags its fixed code, fails here instead of in the nightly run. The full
  # benchmark (every suite, about 50 apps) still runs nightly on the maintainer's machine.
  smoke:
    name: CVE pairs smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Re-score the smoke CVE pairs
        run: venv/bin/python benchmarks/smoke.py --workers 3
