# codewatch built-in taint rules for PHP web apps: request data (superglobals and the common frameworks' request
# objects) reaching a dangerous call in the same function. PHP has no summary passes yet, so each rule sets
# `interprocedural: false`, which keeps it out of summaries.py (whose patterns are Python and JavaScript).
rules:
  - id: codewatch.php.web.xss
    mode: taint
    languages: [php]
    severity: ERROR
    message: >-
      Data from the HTTP request is written into the page without escaping. Escape it for where it goes:
      htmlspecialchars($value, ENT_QUOTES) in HTML, esc_html()/esc_attr() in WordPress, e() or {{ }} in Laravel.
    metadata: &xss-meta
      category: security
      subcategory: [vuln]
      type: vulnerability
      interprocedural: false
      title: Request data in an HTML response without escaping
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
        - https://www.php.net/manual/en/function.htmlspecialchars.php
    pattern-sources: &php-sources
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_FILES[...]['name']
          - patterns:
              - pattern: $_SERVER[$KEY]
              - metavariable-regex:
                  metavariable: $KEY
                  regex: ^['"](REQUEST_URI|PHP_SELF|PATH_INFO|QUERY_STRING|HTTP_[A-Z_]+)['"]$
          - pattern: filter_input($TYPE, ...)
          - pattern: filter_input_array(...)
          - pattern: getallheaders()
          - pattern: file_get_contents('php://input')
          # Laravel, Symfony, CakePHP, CodeIgniter, Yii, Craft, Slim, Laminas, Joomla and Magento request objects.
          - patterns:
              - pattern-either:
                  - pattern: $REQ->$GET(...)
                  - pattern: $REQ->$BAG->$GET(...)
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^\$(request|req|httpRequest|serverRequest)$
              - metavariable-regex:
                  metavariable: $GET
                  regex: ^(input|get|query|post|all|only|except|cookie|header|getParam|getParams|getQuery|getQueryParam|getQueryParams|getBodyParam|getBodyParams|getParsedBody|getQueryString|getRequestUri|getPathInfo|getData|getPost|getCookie|getHeader|getContent|getUri|getValue|param|params|data|segment|get_post|post_get|getVar|getString|getRaw|getHtml|getUserParam)$
          - patterns:
              - pattern-either:
                  - pattern: request()->$GET(...)
                  - pattern: request($KEY)
                  - pattern: Request::$GET(...)
                  - pattern: Input::$GET(...)
                  - pattern: Yii::$app->request->$GET(...)
                  - pattern: Craft::$app->getRequest()->$GET(...)
                  - pattern: Craft::$app->request->$GET(...)
                  - pattern: $THIS->getRequest()->$GET(...)
                  - pattern: $THIS->request->$GET(...)
                  - pattern: $THIS->input->$GET(...)
                  - pattern: $APP->input->$GET(...)
              - metavariable-regex:
                  metavariable: $GET
                  regex: ^(input|get|query|post|all|only|except|cookie|header|getParam|getParams|getQuery|getQueryParam|getQueryParams|getBodyParam|getBodyParams|getParsedBody|getQueryString|getRequestUri|getPathInfo|getData|getPost|getCookie|getHeader|getContent|getUri|getValue|param|params|data|segment|get_post|post_get|getVar|getString|getRaw|getHtml|getUserParam)$
          - pattern: Tools::getValue(...)
    pattern-sanitizers: &escaped
      - patterns:
          - pattern-either:
              - pattern: htmlspecialchars(...)
              - pattern: htmlentities(...)
              - pattern: strip_tags(...)
              - pattern: e(...)
              - pattern: h(...)
              - pattern: esc_html(...)
              - pattern: esc_attr(...)
              - pattern: esc_url(...)
              - pattern: esc_js(...)
              - pattern: esc_textarea(...)
              - pattern: esc_html__(...)
              - pattern: esc_attr__(...)
              - pattern: wp_kses(...)
              - pattern: wp_kses_post(...)
              - pattern: sanitize_text_field(...)
              - pattern: sanitize_key(...)
              - pattern: sanitize_title(...)
              - pattern: sanitize_email(...)
              - pattern: Html::encode(...)
              - pattern: Html::escape(...)
              - pattern: CHtml::encode(...)
              - pattern: Xss::filter(...)
              - pattern: Purifier::clean(...)
              - pattern: $PURIFIER->purify(...)
              - pattern: json_encode(...)
              - pattern: urlencode(...)
              - pattern: rawurlencode(...)
              - pattern: http_build_query(...)
              - pattern: filter_var($X, FILTER_SANITIZE_FULL_SPECIAL_CHARS, ...)
              - pattern: filter_var($X, FILTER_SANITIZE_SPECIAL_CHARS, ...)
              - pattern: filter_input($T, $N, FILTER_SANITIZE_FULL_SPECIAL_CHARS, ...)
              - pattern: filter_input($T, $N, FILTER_SANITIZE_SPECIAL_CHARS, ...)
              # CakePHP's view helpers ($this->Html->link(), $this->Form->create()) escape what they are given.
              - patterns:
                  - pattern: $THIS->$HELPER->$METHOD(...)
                  - metavariable-regex: {metavariable: $HELPER, regex: '^[A-Z][A-Za-z]*$'}
      # An escaper called as a function or a method, named for what it does: Strings::htmlentities() (phpMyFAQ),
      # escape_input() (phpIPAM), $escaper->escapeHtml() (Laminas, Magento).
      - patterns:
          - pattern-either:
              - pattern: $F(...)
              - pattern: $OBJ->$F(...)
              - pattern: $CLS::$F(...)
          - metavariable-regex:
              metavariable: $F
              regex: '(?i)^(html_?(entities|special_?chars|escape|encode|safe)|escape_?(html\w*|attr\w*|input|output|js|url)|esc_?(html|attr|url|js)\w*|encode_?html|sanitize_?(html|text|string|input|output)\w*|purify|xss_?clean|clean_?xss|remove_?xss)$'
      # A named check that the value passed: `if ($this->isLocalUrl($request, $target)) { return
      # $this->redirect($target); }` (GHSA-62f9), or one that said no and ended the request before the use.
      - &php-checked
        patterns:
          - pattern-either:
              - pattern-inside: if (<... $CHECK(..., $X, ...) ...>) { ... }
              - pattern-inside: if (<... $OBJ->$CHECK(..., $X, ...) ...>) { ... }
              - pattern-inside: if (<... $CLS::$CHECK(..., $X, ...) ...>) { ... }
          - pattern-not-inside: if (<... !$CHECK(..., $X, ...) ...>) { ... }
          - pattern-not-inside: if (<... !$OBJ->$CHECK(..., $X, ...) ...>) { ... }
          - pattern-not-inside: if (<... !$CLS::$CHECK(..., $X, ...) ...>) { ... }
          - metavariable-regex:
              metavariable: $CHECK
              regex: '(?i)^(is_?|check_?)?(safe|valid|allowed|permitted|trusted|whitelisted|allowlisted|local)\w{0,40}$'
          - pattern: $X
      - &php-guarded
        patterns:
          - pattern-either:
              - pattern-inside: |
                  if (!$CHECK(..., $X, ...)) {
                    ...
                    return ...;
                  }
                  ...
              - pattern-inside: |
                  if (!$CHECK(..., $X, ...)) {
                    ...
                    return;
                  }
                  ...
              - pattern-inside: |
                  if (!$CHECK(..., $X, ...)) {
                    ...
                    exit;
                  }
                  ...
              - pattern-inside: |
                  if (!$CHECK(..., $X, ...)) {
                    ...
                    exit(...);
                  }
                  ...
              - pattern-inside: |
                  if (!$CHECK(..., $X, ...)) {
                    ...
                    die(...);
                  }
                  ...
              - pattern-inside: |
                  if (!$CHECK(..., $X, ...)) {
                    ...
                    die;
                  }
                  ...
              - pattern-inside: |
                  if (!$CHECK(..., $X, ...)) {
                    ...
                    throw $E;
                  }
                  ...
              - pattern-inside: |
                  if (!$CHECK(..., $X, ...)) {
                    ...
                    wp_die(...);
                  }
                  ...
              - pattern-inside: |
                  if (!$OBJ->$CHECK(..., $X, ...)) {
                    ...
                    return ...;
                  }
                  ...
              - pattern-inside: |
                  if (!$OBJ->$CHECK(..., $X, ...)) {
                    ...
                    return;
                  }
                  ...
              - pattern-inside: |
                  if (!$OBJ->$CHECK(..., $X, ...)) {
                    ...
                    exit;
                  }
                  ...
              - pattern-inside: |
                  if (!$OBJ->$CHECK(..., $X, ...)) {
                    ...
                    exit(...);
                  }
                  ...
              - pattern-inside: |
                  if (!$OBJ->$CHECK(..., $X, ...)) {
                    ...
                    die(...);
                  }
                  ...
              - pattern-inside: |
                  if (!$OBJ->$CHECK(..., $X, ...)) {
                    ...
                    die;
                  }
                  ...
              - pattern-inside: |
                  if (!$OBJ->$CHECK(..., $X, ...)) {
                    ...
                    throw $E;
                  }
                  ...
              - pattern-inside: |
                  if (!$OBJ->$CHECK(..., $X, ...)) {
                    ...
                    wp_die(...);
                  }
                  ...
              - pattern-inside: |
                  if (!$CLS::$CHECK(..., $X, ...)) {
                    ...
                    return ...;
                  }
                  ...
              - pattern-inside: |
                  if (!$CLS::$CHECK(..., $X, ...)) {
                    ...
                    return;
                  }
                  ...
              - pattern-inside: |
                  if (!$CLS::$CHECK(..., $X, ...)) {
                    ...
                    exit;
                  }
                  ...
              - pattern-inside: |
                  if (!$CLS::$CHECK(..., $X, ...)) {
                    ...
                    exit(...);
                  }
                  ...
              - pattern-inside: |
                  if (!$CLS::$CHECK(..., $X, ...)) {
                    ...
                    die(...);
                  }
                  ...
              - pattern-inside: |
                  if (!$CLS::$CHECK(..., $X, ...)) {
                    ...
                    die;
                  }
                  ...
              - pattern-inside: |
                  if (!$CLS::$CHECK(..., $X, ...)) {
                    ...
                    throw $E;
                  }
                  ...
              - pattern-inside: |
                  if (!$CLS::$CHECK(..., $X, ...)) {
                    ...
                    wp_die(...);
                  }
                  ...
          - metavariable-regex:
              metavariable: $CHECK
              regex: '(?i)^(is_?|check_?|validate_?)?(safe|valid|allowed|permitted|trusted|whitelisted|allowlisted|local)\w{0,40}$'
          - pattern: $X
      - &numeric
        pattern-either:
          - pattern: intval(...)
          - pattern: floatval(...)
          - pattern: absint(...)
          - pattern: (int) $X
          - pattern: (integer) $X
          - pattern: (float) $X
          - pattern: (bool) $X
          - pattern: (boolean) $X
          - pattern: count(...)
          - pattern: strlen(...)
          - pattern: isset(...)
          - pattern: empty(...)
          - pattern: is_numeric(...)
          - pattern: ctype_digit(...)
          - pattern: ctype_alnum(...)
          - pattern: in_array(...)
          - pattern: array_key_exists(...)
          - pattern: md5(...)
          - pattern: sha1(...)
          - pattern: hash(...)
          - pattern: password_hash(...)
          - pattern: filter_var($X, FILTER_VALIDATE_INT, ...)
          - pattern: filter_var($X, FILTER_VALIDATE_FLOAT, ...)
          - pattern: filter_var($X, FILTER_VALIDATE_BOOLEAN, ...)
          - pattern: filter_input($T, $N, FILTER_VALIDATE_INT, ...)
          - pattern: filter_input($T, $N, FILTER_SANITIZE_NUMBER_INT, ...)
          - pattern: sprintf("%d", ...)
          - pattern: number_format(...)
          # Arithmetic gives a number (users.php?offset=<?= $_GET['offset'] + 6 ?>, GHSA-m473), and so do dates.
          - pattern: $A + $B
          - pattern: $A - $B
          - pattern: $A * $B
          - pattern: $A / $B
          - pattern: $A % $B
          - pattern: date(...)
          - pattern: gmdate(...)
          - pattern: mktime(...)
          - pattern: strtotime(...)
          - pattern: round(...)
          - pattern: abs(...)
          - pattern: min(...)
          - pattern: max(...)
          - pattern: $A == $B
          - pattern: $A === $B
          - pattern: $A != $B
          - pattern: $A !== $B
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: echo $X;
              - pattern: print $X;
              - pattern: print($X);
              - pattern: exit($X);
              - pattern: die($X);
          - focus-metavariable: $X
      - pattern: printf(...)
      - pattern: vprintf(...)

  - id: codewatch.php.web.sql-injection
    mode: taint
    languages: [php]
    severity: ERROR
    message: >-
      Data from the HTTP request is built into an SQL statement. Use a prepared statement with placeholders
      (PDO::prepare, mysqli bind_param, $wpdb->prepare, the query builder's bindings) instead of concatenation.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      interprocedural: false
      title: Request data built into an SQL statement
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Query_Parameterization_Cheat_Sheet.html
        - https://www.php.net/manual/en/pdo.prepared-statements.php
    pattern-sources: *php-sources
    pattern-sanitizers:
      - *php-checked
      - *php-guarded
      - *numeric
      # Escaping keeps a value inside its quotes; an unquoted escaped value is still injectable, but flagging every
      # escaped value would bury the rest.
      - pattern-either:
          - pattern: mysqli_real_escape_string(...)
          - pattern: mysql_real_escape_string(...)
          - pattern: mysql_escape_string(...)
          - pattern: pg_escape_string(...)
          - pattern: pg_escape_literal(...)
          - pattern: sqlite_escape_string(...)
          - pattern: addslashes(...)
          - pattern: esc_sql(...)
          - pattern: $DB->real_escape_string(...)
          - pattern: $DB->escape(...)
          - pattern: $DB->escapeString(...)
          - pattern: $DB->escape_string(...)
          - pattern: $DB->quote(...)
          - pattern: $DB->quoteValue(...)
          - pattern: $DB->qstr(...)
          - pattern: $wpdb->prepare(...)
          - pattern: $DB->quoteName(...)
          - pattern: $DB->quoteIdentifier(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: mysql_query($SQL, ...)
              - pattern: mysql_db_query($D, $SQL, ...)
              - pattern: mysqli_query($C, $SQL, ...)
              - pattern: mysqli_multi_query($C, $SQL, ...)
              - pattern: mysqli_real_query($C, $SQL, ...)
              - pattern: mysqli_prepare($C, $SQL)
              - pattern: $DB->prepare($SQL)
              - pattern: pg_query($C, $SQL)
              - pattern: pg_query($SQL)
              - pattern: pg_send_query($C, $SQL)
              - pattern: sqlsrv_query($C, $SQL, ...)
              - pattern: odbc_exec($C, $SQL, ...)
              - patterns:
                  - pattern: $DB->$QUERY($SQL, ...)
                  - metavariable-regex:
                      metavariable: $QUERY
                      regex: ^(query|exec|multi_query|real_query|unbuffered_query|get_results|get_row|get_var|get_col|executeQuery|executeStatement|executeUpdate|fetchAll|fetchAssoc|fetchOne|fetchColumn|fetchAllAssociative|fetchAssociative|createQuery|createNativeQuery|whereRaw|orWhereRaw|havingRaw|orderByRaw|selectRaw|groupByRaw|raw|unprepared|setQuery|Execute|GetAll|GetRow|GetOne|GetCol|SelectLimit|sql_query|createCommand|findBySql)$
          - focus-metavariable: $SQL
      - patterns:
          - pattern: DB::$RAW($SQL, ...)
          - metavariable-regex:
              metavariable: $RAW
              regex: ^(raw|select|statement|unprepared|insert|update|delete|selectOne)$
          - focus-metavariable: $SQL

  - id: codewatch.php.web.path-traversal
    mode: taint
    languages: [php]
    severity: ERROR
    message: >-
      Data from the HTTP request is used in a file path or include, so "../" (or an absolute path) can reach
      files outside the intended folder. Take only the file name (basename()) or check the resolved path
      (realpath()) stays inside the folder.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      interprocedural: false
      title: Request data in a file path
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"]
      owasp: ["A01:2025 - Broken Access Control"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html
        - https://owasp.org/www-community/attacks/Path_Traversal
    pattern-sources: *php-sources
    pattern-sanitizers:
      - *php-checked
      - *php-guarded
      - *numeric
      - pattern-either:
          - pattern: basename(...)
          - pattern: sanitize_file_name(...)
          - pattern: realpath(...)
          - pattern: md5(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: include $X;
              - pattern: include_once $X;
              - pattern: require $X;
              - pattern: require_once $X;
              - pattern: file_get_contents($X, ...)
              - pattern: file_put_contents($X, ...)
              - pattern: fopen($X, ...)
              - pattern: file($X, ...)
              - pattern: readfile($X, ...)
              - pattern: unlink($X, ...)
              - pattern: rmdir($X, ...)
              - pattern: mkdir($X, ...)
              - pattern: copy($X, ...)
              - pattern: copy($S, $X, ...)
              - pattern: rename($X, ...)
              - pattern: rename($S, $X, ...)
              - pattern: move_uploaded_file($S, $X)
              - pattern: opendir($X, ...)
              - pattern: scandir($X, ...)
              - pattern: glob($X, ...)
              - pattern: parse_ini_file($X, ...)
              - pattern: highlight_file($X, ...)
              - pattern: show_source($X, ...)
              - pattern: fpassthru($X)
              - pattern: touch($X, ...)
              - pattern: symlink($S, $X)
              - pattern: chmod($X, ...)
              - pattern: tempnam($X, ...)
              - pattern: simplexml_load_file($X, ...)
              - pattern: new SplFileObject($X, ...)
              - pattern: new SplFileInfo($X, ...)
              - pattern: $ZIP->extractTo($X, ...)
          - focus-metavariable: $X

  - id: codewatch.php.web.command-injection
    mode: taint
    languages: [php]
    severity: ERROR
    message: >-
      Data from the HTTP request reaches a shell command, so a user can run their own commands. Quote each
      argument with escapeshellarg(), or pass an argument array to proc_open() or Symfony Process.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      interprocedural: false
      title: Request data in a shell command
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
        - https://www.php.net/manual/en/function.escapeshellarg.php
    pattern-sources: *php-sources
    pattern-sanitizers:
      - *php-checked
      - *php-guarded
      - *numeric
      - pattern-either:
          - pattern: escapeshellarg(...)
          - pattern: escapeshellcmd(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: exec($X, ...)
              - pattern: system($X, ...)
              - pattern: shell_exec($X)
              - pattern: passthru($X, ...)
              - pattern: popen($X, ...)
              - pattern: proc_open($X, ...)
              - pattern: pcntl_exec($X, ...)
              - pattern: Process::fromShellCommandline($X, ...)
          - pattern-not: proc_open([...], ...)
          - focus-metavariable: $X
      - pattern: "`...`"

  - id: codewatch.php.web.code-injection
    mode: taint
    languages: [php]
    severity: ERROR
    message: >-
      Data from the HTTP request is run as PHP code. Never evaluate request data; map it to one of a fixed set of
      functions or values instead.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      interprocedural: false
      title: Request data run as code
      cwe: ["CWE-94: Improper Control of Generation of Code ('Code Injection')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://owasp.org/www-community/attacks/Code_Injection
    pattern-sources: *php-sources
    pattern-sanitizers:
      - *php-checked
      - *php-guarded
      - *numeric
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($X);
              - pattern: assert($X, ...)
              - pattern: create_function($A, $X)
              - pattern: create_function($X, ...)
              - pattern: call_user_func($X, ...)
              - pattern: call_user_func_array($X, ...)
              - pattern: preg_replace("=~/e[a-z]*$/", $X, ...)
          - focus-metavariable: $X
      # A variable used as the function or class name: $_GET['f']() or new $class().
      - patterns:
          - pattern-either:
              - pattern: $X(...)
              - pattern: new $X(...)
          - metavariable-regex:
              metavariable: $X
              regex: ^\$\w+$
          - focus-metavariable: $X

  - id: codewatch.php.web.ssrf
    mode: taint
    languages: [php]
    severity: ERROR
    message: >-
      Data from the HTTP request chooses the URL the server fetches, so a user can make it call internal
      services. Check the host against a list of allowed hosts before the request.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      interprocedural: false
      title: Request data chooses the server's outbound URL
      cwe: ["CWE-918: Server-Side Request Forgery (SSRF)"]
      owasp: ["A01:2025 - Broken Access Control"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
    pattern-sources: *php-sources
    pattern-sanitizers:
      - *php-checked
      - *php-guarded
      - *numeric
      - pattern-either:
          - pattern: urlencode(...)
          - pattern: rawurlencode(...)
          - pattern: http_build_query(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CLIENT->request($M, $X, ...)
              - pattern: $CLIENT->$VERB($X, ...)
          - metavariable-regex:
              metavariable: $CLIENT
              regex: ^\$(client|http|httpClient|guzzle|this->client|this->httpClient)$
          - metavariable-regex:
              metavariable: $VERB
              regex: ^(get|post|put|patch|delete|head|request|send|sendRequest|getAsync|postAsync)$
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: curl_init($X)
              - pattern: curl_setopt($C, CURLOPT_URL, $X)
              - pattern: fsockopen($X, ...)
              - pattern: get_headers($X, ...)
              - pattern: wp_remote_get($X, ...)
              - pattern: wp_remote_post($X, ...)
              - pattern: wp_remote_request($X, ...)
              - pattern: wp_remote_head($X, ...)
              - pattern: wp_safe_remote_get($X, ...)
              - pattern: Http::get($X, ...)
              - pattern: Http::post($X, ...)
          - focus-metavariable: $X

  - id: codewatch.php.web.open-redirect
    mode: taint
    languages: [php]
    severity: WARNING
    message: >-
      Data from the HTTP request chooses where the user is redirected, so a link to this site can send them to
      any other. Redirect only to a path on this site, or check the URL against a list of allowed hosts
      (wp_safe_redirect() in WordPress).
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      interprocedural: false
      title: Request data chooses the redirect target
      cwe: ["CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"]
      owasp: ["A01:2025 - Broken Access Control"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
    pattern-sources: *php-sources
    pattern-sanitizers:
      - *php-checked
      - *php-guarded
      - *numeric
      - pattern-either:
          - pattern: urlencode(...)
          - pattern: rawurlencode(...)
          - pattern: wp_validate_redirect(...)
          - pattern: wp_sanitize_redirect(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: header($X, ...)
                  - metavariable-regex:
                      metavariable: $X
                      regex: '(?i)^["'']\s*location\s*:'
              - pattern: wp_redirect($X, ...)
              - pattern: redirect($X, ...)
              - pattern: redirect()->to($X, ...)
              - pattern: redirect()->away($X, ...)
              - pattern: Redirect::to($X, ...)
              - pattern: Redirect::away($X, ...)
              - pattern: new RedirectResponse($X, ...)
              - pattern: $THIS->redirect($X, ...)
          - focus-metavariable: $X

  - id: codewatch.php.web.unsafe-deserialization
    mode: taint
    languages: [php]
    severity: ERROR
    message: >-
      Data from the HTTP request is passed to unserialize(), which can build objects whose magic methods run
      code. Use json_decode(), or unserialize($data, ['allowed_classes' => false]).
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      interprocedural: false
      title: Request data unserialized
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      owasp: ["A08:2025 - Software or Data Integrity Failures"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
    pattern-sources: *php-sources
    pattern-sanitizers:
      - *php-checked
      - *php-guarded
      - *numeric
    pattern-sinks:
      - patterns:
          - pattern: unserialize($X, ...)
          - pattern-not: "unserialize($Y, ['allowed_classes' => false])"
          - pattern-not: "unserialize($Y, array('allowed_classes' => false))"
          - focus-metavariable: $X
