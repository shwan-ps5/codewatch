# codewatch built-in rules for Django views and Django/Jinja templates.
rules:
  - id: codewatch.django.view-without-method-restriction
    languages: [python]
    severity: INFO
    message: >-
      This view changes state (saves, deletes or reads POST data) but accepts every HTTP method, so a plain
      GET link can trigger it without Django's CSRF check. Add @require_POST (or @require_http_methods), or
      branch on request.method. Read-only views are not flagged.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: State-changing Django view without an HTTP method restriction
      cwe: ["CWE-650: Trusting HTTP Permission Methods on the Server Side"]
      owasp: ["A01:2025 - Broken Access Control"]
      references:
        - https://docs.djangoproject.com/en/stable/topics/http/decorators/#allowed-http-methods
        - https://docs.djangoproject.com/en/stable/ref/csrf/
    paths:
      include: ["**/*views.py", "**/views/*.py"]
    patterns:
      - pattern: |
          def $VIEW(request, ...):
            ...
            return <... $RESPONDER(...) ...>
      - metavariable-regex:
          metavariable: $RESPONDER
          regex: '(.*\.)?(render|redirect|HttpResponse\w{0,20}|JsonResponse|TemplateResponse|FileResponse|StreamingHttpResponse)$'
      # Only views that change something: a read-only page that also answers POST does no harm.
      - pattern-either:
          - patterns:
              - pattern: |
                  def $VIEW(request, ...):
                    ...
                    <... $OBJ.$MUTATE(...) ...>
                    ...
              - metavariable-regex:
                  metavariable: $MUTATE
                  regex: '^(save|delete|create|update|bulk_create|bulk_update|get_or_create|update_or_create|send_mail|set_password)$'
          - patterns:
              - pattern: |
                  def $VIEW(request, ...):
                    ...
                    <... $AUTH(request, ...) ...>
                    ...
              - metavariable-regex:
                  metavariable: $AUTH
                  regex: '^(login|logout)$'
          - pattern: |
              def $VIEW(request, ...):
                ...
                <... request.POST ...>
                ...
          - pattern: |
              def $VIEW(request, ...):
                ...
                <... request.FILES ...>
                ...
      - pattern-not-inside: |
          class $CLASS(...):
            ...
      - pattern-not: |
          @require_http_methods(...)
          def $VIEW(request, ...):
            ...
      - pattern-not: |
          @require_POST
          def $VIEW(request, ...):
            ...
      - pattern-not: |
          @require_GET
          def $VIEW(request, ...):
            ...
      - pattern-not: |
          @require_safe
          def $VIEW(request, ...):
            ...
      - pattern-not: |
          def $VIEW(request, ...):
            ...
            if <... request.method ...>:
              ...
            ...

  - id: codewatch.templates.unescaped-output
    languages: [generic]
    severity: WARNING
    message: >-
      Template auto-escaping is switched off here (|safe or {% autoescape off %}), so any HTML in the value is
      rendered as-is. Make sure the value can't contain user input, or escape it before marking it safe.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: Auto-escaping turned off in a template
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://docs.djangoproject.com/en/stable/ref/templates/builtins/#safe
        - https://docs.djangoproject.com/en/stable/ref/templates/builtins/#autoescape
        - https://jinja.palletsprojects.com/en/stable/templates/#html-escaping
        - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
    paths:
      include: ["*.html", "*.htm", "*.jinja", "*.jinja2", "*.j2", "*.djhtml"]
    pattern-either:
      - pattern-regex: '\{\{[^{}\n]{0,200}\|\s{0,5}safe\b'
      - pattern-regex: '\{%-?\s{0,5}autoescape\s{1,5}(off|false)\b'

  - id: codewatch.templates.request-in-url-attribute
    languages: [generic]
    severity: ERROR
    message: >-
      A value from the request's query or form is printed at the start of a link (href, src, action) or inside an
      event handler. Autoescaping keeps it inside the attribute, but a "javascript:" URL still runs, and in an
      onclick the escaped quotes are decoded before the script runs. Build the link on the server and check it
      (url_for, or an allowlist of hosts and schemes), and pass handler values through data attributes.
    # Formspree GHSA-2wvm-9j4x-757c: <a href="{{ request.args.get('next') }}">. A link with a fixed start
    # (href="/search?q={{ ... }}") can't change scheme, so only the start of the value counts.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data as a template's link or event handler
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
        - https://jinja.palletsprojects.com/en/stable/templates/#html-escaping
    paths:
      include: ["*.html", "*.htm", "*.jinja", "*.jinja2", "*.j2", "*.djhtml"]
    pattern-either:
      - pattern-regex: '(?i)\b(href|src|action|formaction|xlink:href)\s{0,5}=\s{0,5}["'']?\s{0,5}\{\{-?\s{0,5}request\.(args|GET|values|query_params|form|POST)\b'
      - pattern-regex: '(?i)\bon[a-z]{3,20}\s{0,5}=\s{0,5}"[^"<>]{0,200}\{\{-?\s{0,5}request\.(args|GET|values|query_params|form|POST)\b'
      - pattern-regex: '(?i)\bon[a-z]{3,20}\s{0,5}=\s{0,5}''[^''<>]{0,200}\{\{-?\s{0,5}request\.(args|GET|values|query_params|form|POST)\b'

  - id: codewatch.templates.not-autoescaped
    languages: [generic]
    severity: WARNING
    message: >-
      Flask chooses autoescaping by extension: only .html, .htm, .xml, .xhtml and .svg templates are escaped, so a
      .jinja, .jinja2 or .j2 template prints every value raw. If this app is Flask, HTML in a value here is rendered
      as markup. Rename it to .html, or escape each value (|e) or sanitize it. Django's Jinja backend does
      autoescape these extensions, so this is a hotspot for review rather than a definite flaw.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: Template extension Flask does not autoescape
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://flask.palletsprojects.com/en/stable/config/#TEMPLATES_AUTO_RELOAD
        - https://flask.palletsprojects.com/en/stable/api/#flask.Flask.select_jinja_autoescape
        - https://jinja.palletsprojects.com/en/stable/templates/#html-escaping
        - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
    paths:
      include: ["*.jinja", "*.jinja2", "*.j2"]
    # {{ name }}, but not a literal, a form field or a server value, and not an expression a filter escapes (|e,
    # |escape, |tojson, |sanitize...); |safe is reported by codewatch.templates.unescaped-output.
    pattern-regex: >-
      \{\{-?\s{0,5}(?!(form|url_for|get_flashed_messages|config|loop|super|self|caller|csrf_token)\b)[A-Za-z_][\w.]*(?![^{}\n]{0,200}\|\s{0,5}(e|escape|safe|tojson|sanitize\w*|clean\w*|bleach\w*|striptags|int|float|length|count|urlencode|filesizeformat)\b)

  - id: codewatch.django.allauth-microsoft-any-tenant
    languages: [python]
    severity: WARNING
    message: >-
      django-allauth's Microsoft provider signs in accounts from any Entra tenant here ("common", "organizations"
      or "consumers"; "common" is also what it uses when no tenant is set). Anyone with a Microsoft account in
      another organisation can sign in, and with SOCIALACCOUNT_AUTO_SIGNUP gets an account. Set the tenant to
      your directory's ID, or reject other tenants (the token's tid claim) in your social account adapter.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: Microsoft sign-in open to any Entra tenant
      cwe: ["CWE-284: Improper Access Control"]
      owasp: ["A01:2025 - Broken Access Control"]
      references:
        - https://docs.allauth.org/en/latest/socialaccount/providers/microsoft.html
        - https://learn.microsoft.com/en-us/entra/identity-platform/howto-convert-app-to-be-multi-tenant
    pattern-either:
      - patterns:
          - pattern-inside: SOCIALACCOUNT_PROVIDERS = {...}
          - pattern: '{..., $KEY: $VALUE, ...}'
          - metavariable-regex: {metavariable: $KEY, regex: '^[rbu]*["''](tenant|TENANT)["'']$'}
          - metavariable-regex: {metavariable: $VALUE, regex: '^[rbu]*["''](common|organizations|consumers)["'']$'}
          - focus-metavariable: $VALUE
      - patterns:
          - pattern-inside: SOCIALACCOUNT_PROVIDERS = {...}
          - pattern: '{..., $PROVIDER: $CONFIG, ...}'
          - metavariable-regex: {metavariable: $PROVIDER, regex: '^[rbu]*["'']microsoft["'']$'}
          - metavariable-regex: {metavariable: $CONFIG, regex: '^(?![\s\S]*["''](tenant|TENANT)["''])\{'}
          - focus-metavariable: $PROVIDER

  - id: codewatch.django.allauth-trusts-provider-email
    languages: [python]
    severity: WARNING
    message: >-
      django-allauth is told to trust email addresses from a social login: VERIFIED_EMAIL treats every address a
      provider sends as verified, and SOCIALACCOUNT_EMAIL_AUTHENTICATION signs a social login into the local
      account with the same address. Together, anyone who can make a provider send someone else's address signs in
      as them (Microsoft Entra's email claim can be set by the admin of any tenant: "nOAuth"). Leave both off, or
      match accounts on the provider's immutable ID (Entra's oid/sub) instead.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: Social sign-in trusts the provider's email address
      cwe: ["CWE-287: Improper Authentication"]
      owasp: ["A07:2025 - Authentication Failures"]
      references:
        - https://docs.allauth.org/en/latest/socialaccount/configuration.html
        - https://www.descope.com/blog/post/noauth
    pattern-either:
      - patterns:
          - pattern-inside: SOCIALACCOUNT_PROVIDERS = {...}
          - pattern: '{..., $KEY: True, ...}'
          - metavariable-regex: {metavariable: $KEY, regex: '^[rbu]*["'']VERIFIED_EMAIL["'']$'}
          - focus-metavariable: $KEY
      - pattern: SOCIALACCOUNT_EMAIL_AUTHENTICATION = True

  - id: codewatch.python.csp-allows-inline-script
    languages: [python]
    severity: WARNING
    message: >-
      This Content-Security-Policy lets scripts run inline ('unsafe-inline') or from strings ('unsafe-eval'), so
      it no longer stops injected script: the policy's main protection against XSS is off. Use nonces or hashes
      for inline scripts ('unsafe-inline' is ignored next to a nonce or hash, so keeping it there as a fallback
      for old browsers is fine) and remove eval-style code.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: Content-Security-Policy allows inline or eval'd script
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A02:2025 - Security Misconfiguration"]
      references:
        - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Content-Security-Policy/script-src
        - https://cheatsheetseries.owasp.org/cheatsheets/Content_Security_Policy_Cheat_Sheet.html
    pattern-either:
      # A policy written out as a header value.
      - patterns:
          - pattern: '"$POLICY"'
          - metavariable-regex:
              metavariable: $POLICY
              regex: '(?i)(.*;)?\s*(script-src|script-src-elem|default-src)\s[^;]*''unsafe-(inline|eval)'''
          # 'unsafe-inline' next to a nonce or hash is ignored by browsers that know them (a fallback).
          - metavariable-regex:
              metavariable: $POLICY
              regex: '(?is)^(?!.*(script-src|default-src)\s[^;]*''(nonce-|sha(256|384|512)-|strict-dynamic))|.*''unsafe-eval'''
      # Directives kept as lists (django-csp's CSP_SCRIPT_SRC and CONTENT_SECURITY_POLICY, Django 6's SECURE_CSP,
      # a project's own dict) with an unsafe source among them.
      - patterns:
          - pattern-either:
              - pattern: '$SETTING = [..., "$SOURCE", ...]'
              - pattern: '$SETTING = (..., "$SOURCE", ...)'
              - pattern: '{..., $SETTING: [..., "$SOURCE", ...], ...}'
              - pattern: '{..., $SETTING: (..., "$SOURCE", ...), ...}'
              - pattern: '$D[$SETTING].append("$SOURCE")'
              # The scanned copy writes a constant key as an attribute: d["script-src"] -> d.k_script_src.
              - pattern: '$D.$SETTING.append("$SOURCE")'
              - pattern: '$D[$SETTING] += [..., "$SOURCE", ...]'
          - metavariable-regex: {metavariable: $SETTING, regex: '(?i)^[rbu]*["'']?(CSP_|k_)?(script[-_]src(_elem|[-_]elem)?|default[-_]src)["'']?$'}
          - metavariable-regex: {metavariable: $SOURCE, regex: '^''unsafe-(inline|eval)''$'}
          - pattern-not: '$SETTING = [..., "=~/^.(nonce-|sha(256|384|512)-|strict-dynamic)/", ...]'
          - pattern-not: '{..., $SETTING: [..., "=~/^.(nonce-|sha(256|384|512)-|strict-dynamic)/", ...], ...}'
