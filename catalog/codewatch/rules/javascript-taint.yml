# codewatch built-in taint rules for JavaScript/TypeScript: data from the HTTP request (Express, Koa, Next.js
# route handlers) or, in the browser, from the URL and messages, reaching an injection sink unchecked.
rules:
  - id: codewatch.js.sql-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Data from the request is built into a SQL query. Pass it as a bound parameter instead
      (sequelize.query(sql, { replacements }), pool.query(sql, [value]), knex.raw(sql, [value])).
    metadata: &js-meta-sql
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data built into a SQL query
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
        - https://sequelize.org/docs/v6/core-concepts/raw-queries/#replacements
    pattern-sources: &js-sources
      - &src-request-field
        patterns:
          - pattern-either:
              - pattern: $REQ.$FIELD
              - pattern: $REQ.$FIELD.$ANY
          - metavariable-regex: {metavariable: $REQ, regex: '^(req|request|ctx|ctx\.request|context\.req)$'}
          - metavariable-regex:
              metavariable: $FIELD
              regex: '^(body|query|params|cookies|headers|path|url|originalUrl|baseUrl|hostname|files|file)$'
          # Where multer (default storage) put the upload is the server's choice, not the client's: req.file.path,
          # req.file.filename, req.files[i].path. originalname is the client's and stays request data.
          - pattern-not-inside: $REQ.file.path
          - pattern-not-inside: $REQ.file.filename
          - pattern-not-inside: $REQ.files[$I].path
          - pattern-not-inside: $REQ.files[$I].filename
          - pattern-not-inside: $REQ.files.$NAME[$I].path
          - pattern-not-inside: $REQ.files.$NAME[$I].filename
      # NocoBase resource actions (Koa): ctx.action.params holds the request's filter, values and query.
      # Added for GHSA-p849-8hwh-84j9 (cve-pairs-javascript).
      - &src-resource-action-params
        pattern-either:
          - pattern: ctx.action.params
          - pattern: ctx.action?.params
          - pattern: ctx.action.params.$ANY
          - pattern: ctx.action?.params.$ANY
      # A name destructured with a default, `const { filter = {} } = req.body`: Semgrep's taint loses it there.
      # Added for GHSA-p849-8hwh-84j9 (cve-pairs-javascript).
      - &src-destructured-default
        patterns:
          - pattern-either:
              - pattern-inside: |
                  const {..., $X = $D, ...} = $RHS;
                  ...
              - pattern-inside: |
                  let {..., $X = $D, ...} = $RHS;
                  ...
          - pattern: $X
          - metavariable-pattern:
              metavariable: $RHS
              pattern-either:
                - pattern-either:
                    - pattern: ctx.action.params
                    - pattern: ctx.action?.params
                    - pattern: ctx.action.params ?? $E
                    - pattern: ctx.action?.params ?? $E
                    - pattern: ctx.action.params || $E
                    - pattern: ctx.action?.params || $E
                - patterns:
                    - pattern-either:
                        - pattern: $REQ.$FIELD
                        - pattern: $REQ.$FIELD ?? $E
                        - pattern: $REQ.$FIELD || $E
                    - metavariable-regex: {metavariable: $REQ, regex: '^(req|request|ctx|ctx\.request|context\.req)$'}
                    - metavariable-regex: {metavariable: $FIELD, regex: '^(body|query|params|cookies|headers|files|file)$'}
      # Exact: the call's value, not its argument. Otherwise `request.header('accept')` with `request` the incoming
      # request also matched the request library's request.$METHOD(url) sink around its own argument (immich).
      - &src-request-getter
        patterns:
          - pattern: $REQ.$GETTER(...)
          - metavariable-regex: {metavariable: $REQ, regex: '^(req|request|ctx|ctx\.request)$'}
          - metavariable-regex: {metavariable: $GETTER, regex: '^(get|header|param|cookies|json|text|formData)$'}
        exact: true
      - &src-search-params
        pattern: new URLSearchParams(...).get(...)
      - &src-url-search-params
        pattern: $URL.searchParams.get(...)
      # Handlers that destructure the request: ({ params, body }: Request, res) => ...
      - &src-destructured-request
        patterns:
          - pattern-either:
              - pattern-inside: '({..., $FIELD, ...}: Request, ...) => { ... }'
              - pattern-inside: 'function $F({..., $FIELD, ...}: Request, ...) { ... }'
              - pattern-inside: '$APP.$METHOD($PATH, ..., ({..., $FIELD, ...}, $RES, ...) => { ... })'
          - pattern: $FIELD
          - metavariable-regex: {metavariable: $FIELD, regex: '^(body|query|params|cookies|headers|files|file)$'}
      # NestJS controller parameters: @Body() dto, @Query('q') q, @Param('id') id, @Headers() headers. Not those a
      # pipe or a number/boolean/Date type converts (ParseIntPipe, `id: number` under ValidationPipe's transform).
      - &src-nest-param
        patterns:
          - pattern-inside: |
              $M(..., @$DEC(...) $PARAM, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(..., ParseIntPipe, ...) $PARAM, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(..., new ParseIntPipe(...), ...) $PARAM, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(..., ParseFloatPipe, ...) $PARAM, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(..., new ParseFloatPipe(...), ...) $PARAM, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(..., ParseBoolPipe, ...) $PARAM, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(..., new ParseBoolPipe(...), ...) $PARAM, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(..., ParseUUIDPipe, ...) $PARAM, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(..., new ParseUUIDPipe(...), ...) $PARAM, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(..., ParseEnumPipe, ...) $PARAM, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(..., new ParseEnumPipe(...), ...) $PARAM, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(...) $PARAM: number, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(...) $PARAM: boolean, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(...) $PARAM: Date, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(...) $PARAM: bigint, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(...) $PARAM: number[], ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(...) $PARAM: boolean[], ...) { ... }
          - pattern: $PARAM
          - metavariable-regex: {metavariable: $DEC, regex: '^(Body|Query|Param|Headers)$'}
    pattern-sanitizers: &js-sanitizers
      - &san-numeric
        pattern-either:
          - pattern: parseInt(...)
          - pattern: parseFloat(...)
          - pattern: Number(...)
          - pattern: Number.parseInt(...)
          - pattern: Number.parseFloat(...)
          - pattern: Boolean(...)
          - pattern: Math.$F(...)
          - pattern: $X.length
          - pattern: typeof $X
      # Functions named as validators (isValid, validateId, sanitizeName, escapeHtml, outline's getValidatedHost)
      # return checked data.
      - &san-named
        patterns:
          - pattern: $CHECK(...)
          - metavariable-regex: {metavariable: $CHECK, regex: '(?i)(.*\.)?(get_?)?(is_?valid|validat|sanitiz|escape|clean|safe|whitelist|allowlist)\w{0,40}$'}
      # [allowed].includes(x) ? x : fallback only ever yields an allowed value.
      - &san-allowlist-ternary
        pattern: '$ALLOWED.includes($X) ? $X : $FALLBACK'
      # A cookie the server signed holds what the server stored there, like a session (wiki.js reads its login
      # flow back with Fastify's req.unsignCookie(raw)); req.signedCookies (Express) isn't a source for the same reason.
      - &san-signed
        pattern: $REQ.unsignCookie(...)
      # A check on the value that bails out: if (!next.startsWith("/") || next.startsWith("//")) return ...
      - &san-guard
        pattern-either:
          # A named check that said no ends the request: `if (!isValidRedirectUrl(url)) { ...; return; }` (actual).
          # Not in that branch itself, and only a check named for it (`if (!url) return` says nothing).
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      if (!$CHECK(..., $X, ...)) { ... return ...; }
                      ...
                  - pattern-inside: |
                      if (!$CHECK(..., $X, ...)) { ... return; }
                      ...
                  - pattern-inside: |
                      if (!$CHECK(..., $X, ...)) return ...;
                      ...
                  - pattern-inside: |
                      if (!$CHECK(..., $X, ...)) { ... throw $E; }
                      ...
                  - pattern-inside: |
                      if (!$CHECK(..., $X, ...)) throw $E;
                      ...
              - pattern-not-inside: |
                  if (!$CHECK(..., $X, ...)) { ... }
              - pattern-not-inside: |
                  if (!$CHECK(..., $X, ...)) $STMT;
              - metavariable-regex:
                  metavariable: $CHECK
                  regex: '(?i)^(.*\.)?(is|check|can)\w{0,30}(safe|valid|allowed|permitted|trusted|whitelist|allowlist)\w{0,30}$'
              - pattern: $X
          - patterns:
            - pattern-either:
                - pattern-inside: |
                    if (<... $X.startsWith(...) ...>) { ... return ...; }
                    ...
                - pattern-inside: |
                    if (<... $X.startsWith(...) ...>) return ...;
                    ...
                - pattern-inside: |
                    if (<... $X.startsWith(...) ...>) { ... throw $E; }
                    ...
                - pattern-inside: |
                    if (<... $X.startsWith(...) ...>) throw $E;
                    ...
                - pattern-inside: |
                    if (<... $X.endsWith(...) ...>) { ... return ...; }
                    ...
                - pattern-inside: |
                    if (<... $X.endsWith(...) ...>) return ...;
                    ...
                - pattern-inside: |
                    if (<... $X.endsWith(...) ...>) { ... throw $E; }
                    ...
                - pattern-inside: |
                    if (<... $X.endsWith(...) ...>) throw $E;
                    ...
                - pattern-inside: |
                    if (<... $X.includes(...) ...>) { ... return ...; }
                    ...
                - pattern-inside: |
                    if (<... $X.includes(...) ...>) return ...;
                    ...
                - pattern-inside: |
                    if (<... $X.includes(...) ...>) { ... throw $E; }
                    ...
                - pattern-inside: |
                    if (<... $X.includes(...) ...>) throw $E;
                    ...
                - pattern-inside: |
                    if (<... $ALLOWED.includes($X) ...>) { ... return ...; }
                    ...
                - pattern-inside: |
                    if (<... $ALLOWED.includes($X) ...>) return ...;
                    ...
                - pattern-inside: |
                    if (<... $ALLOWED.includes($X) ...>) { ... throw $E; }
                    ...
                - pattern-inside: |
                    if (<... $ALLOWED.includes($X) ...>) throw $E;
                    ...
                - pattern-inside: |
                    if (<... $ALLOWED.has($X) ...>) { ... return ...; }
                    ...
                - pattern-inside: |
                    if (<... $ALLOWED.has($X) ...>) return ...;
                    ...
                - pattern-inside: |
                    if (<... $ALLOWED.has($X) ...>) { ... throw $E; }
                    ...
                - pattern-inside: |
                    if (<... $ALLOWED.has($X) ...>) throw $E;
                    ...
                - pattern-inside: |
                    if (<... $RE.test($X) ...>) { ... return ...; }
                    ...
                - pattern-inside: |
                    if (<... $RE.test($X) ...>) return ...;
                    ...
                - pattern-inside: |
                    if (<... $RE.test($X) ...>) { ... throw $E; }
                    ...
                - pattern-inside: |
                    if (<... $RE.test($X) ...>) throw $E;
                    ...
                - pattern-inside: |
                    if (<... $X.match(...) ...>) { ... return ...; }
                    ...
                - pattern-inside: |
                    if (<... $X.match(...) ...>) return ...;
                    ...
                - pattern-inside: |
                    if (<... $X.match(...) ...>) { ... throw $E; }
                    ...
                - pattern-inside: |
                    if (<... $X.match(...) ...>) throw $E;
                    ...
            - pattern: $X
      # What a file contains is the server's data, whatever path was used to read it (path-traversal checks the path).
      - &san-file-content
        pattern-either:
          - pattern: fs.readFile(...)
          - pattern: fs.readFileSync(...)
          - pattern: fs.promises.readFile(...)
          - pattern: readFile(...)
          - pattern: readFileSync(...)
      # What a helper looks up with the request value (outline's loadPublicShare by share id) is stored data: the
      # variable assigned from a getX/fetchX/loadX/findX/lookupX call, not the call, so a sink among its arguments
      # still counts. Request-shaped names (getQuery, getRedirectUrl) aren't lookups; a project helper the
      # returner pass finds returning request data still counts (summaries.without_lookup_result).
      - &san-lookup-result
        patterns:
          - pattern-either:
              - pattern-inside: |
                  $RESULT = $LOOKUP(...);
                  ...
              - pattern-inside: |
                  $RESULT = await $LOOKUP(...);
                  ...
          - pattern: $RESULT
          - metavariable-regex:
              metavariable: $LOOKUP
              regex: '^_?(get|fetch|load|find|lookup)(?!(Json|Data|Params?|Args?|Query|Queries|Headers?|Cookies?|Body|Form|Fields?|Values?|Inputs?|Text|Str|String|Url|Uri|Path|File|Filename|Name|Key|Id|Var|Env|Config|Setting|Content|Request|Req|Payload|Redirect|Next|Return|Target|Dest|Destination|Location|Callback|Referr?er|Host|Origin)([A-Z]|$))[A-Z]\w*$'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($SQL, ...)
              - pattern: $DB.raw($SQL, ...)
              - pattern: $DB.$queryRawUnsafe($SQL, ...)
              - pattern: $DB.$executeRawUnsafe($SQL, ...)
              - pattern: $DB.execute($SQL, ...)
          - metavariable-regex:
              metavariable: $DB
              regex: '(?i)^(.*\.)?(sequelize|db|database|conn|connection|pool|client|knex|pg|mysql|sql|sqlite|prisma|tx|trx|transaction|datasource|queryrunner|manager|entitymanager|\w*repository|\w*repo)$'
          - focus-metavariable: $SQL
      # Raw SQL fragment inside a Sequelize query (GHSA-p849-8hwh-84j9).
      - patterns:
          - pattern-either:
              - pattern: Sequelize.literal($SQL)
              - pattern: sequelize.literal($SQL)
          - focus-metavariable: $SQL

  - id: codewatch.js.command-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Data from the request reaches a shell command. Call execFile()/spawn() with an argument array and no
      shell, so the value can't add commands.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data in a shell command
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://nodejs.org/api/child_process.html#child_processexecfilefile-args-options-callback
    pattern-sources: *js-sources
    pattern-sanitizers: *js-sanitizers
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: child_process.exec($CMD, ...)
              - pattern: child_process.execSync($CMD, ...)
              - pattern: require('child_process').exec($CMD, ...)
              - pattern: require('child_process').execSync($CMD, ...)
              - pattern: 'child_process.spawn($CMD, ..., {..., shell: true, ...})'
              - pattern: 'child_process.spawnSync($CMD, ..., {..., shell: true, ...})'
              # With shell: true the argument array is joined into the shell command too (GHSA-79wm-x847-7cvg).
              - pattern: 'child_process.spawn($PROG, [..., $CMD, ...], {..., shell: true, ...})'
              - pattern: 'child_process.spawnSync($PROG, [..., $CMD, ...], {..., shell: true, ...})'
              - pattern: execa.command($CMD, ...)
              - pattern: shelljs.exec($CMD, ...)
              # A shell started by hand: spawn("sh", ["-c", cmd])
              - pattern: 'child_process.$SPAWN("=~/^(\/bin\/|\/usr\/bin\/)?(sh|bash|zsh|dash|cmd|cmd\.exe|powershell)$/", [..., $CMD, ...], ...)'
              # const exec = require('child_process').exec
              - patterns:
                  - pattern: $EXEC($CMD, ...)
                  - pattern-inside: |
                      $EXEC = require('child_process').$METHOD
                      ...
                  - metavariable-regex: {metavariable: $METHOD, regex: ^(exec|execSync)$}
          - focus-metavariable: $CMD
      # node:child_process, however it's bound. Semgrep resolves require('child_process') and its imports to
      # child_process.exec, which javascript-taint.yml covers, but not the `node:` specifier.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $CP = require("node:child_process");
                  ...
              - pattern-inside: |
                  import * as $CP from "node:child_process";
                  ...
              - pattern-inside: |
                  import $CP from "node:child_process";
                  ...
          - pattern: $CP.$EXEC($CMD, ...)
          - metavariable-regex: {metavariable: $EXEC, regex: '^(exec|execSync)$'}
          - focus-metavariable: $CMD
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $CP = require("node:child_process");
                  ...
              - pattern-inside: |
                  import * as $CP from "node:child_process";
                  ...
              - pattern-inside: |
                  import $CP from "node:child_process";
                  ...
          - pattern-either:
              - pattern: '$CP.$SPAWN($CMD, ..., {..., shell: true, ...})'
              - pattern: '$CP.$SPAWN($PROG, [..., $CMD, ...], {..., shell: true, ...})'
              - pattern: '$CP.$SPAWN("=~/^(\/bin\/|\/usr\/bin\/)?(sh|bash|zsh|dash|cmd|cmd\.exe|powershell)$/", [..., $CMD, ...], ...)'
          - metavariable-regex: {metavariable: $SPAWN, regex: '^(spawn|spawnSync|execFile|execFileSync)$'}
          - focus-metavariable: $CMD
      - patterns:
          - pattern: require("node:child_process").$EXEC($CMD, ...)
          - metavariable-regex: {metavariable: $EXEC, regex: '^(exec|execSync)$'}
          - focus-metavariable: $CMD
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import { $EXEC } from "node:child_process";
                  ...
              - pattern-inside: |
                  const { $EXEC } = require("node:child_process");
                  ...
          - pattern: $EXEC($CMD, ...)
          - metavariable-regex: {metavariable: $EXEC, regex: '^(exec|execSync)$'}
          - focus-metavariable: $CMD
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import { $SPAWN } from "node:child_process";
                  ...
              - pattern-inside: |
                  const { $SPAWN } = require("node:child_process");
                  ...
          - pattern-either:
              - pattern: '$SPAWN($CMD, ..., {..., shell: true, ...})'
              - pattern: '$SPAWN($PROG, [..., $CMD, ...], {..., shell: true, ...})'
              - pattern: '$SPAWN("=~/^(\/bin\/|\/usr\/bin\/)?(sh|bash|zsh|dash|cmd|cmd\.exe|powershell)$/", [..., $CMD, ...], ...)'
          - metavariable-regex: {metavariable: $SPAWN, regex: '^(spawn|spawnSync|execFile|execFileSync)$'}
          - focus-metavariable: $CMD
      # const run = util.promisify(exec); await run(cmd)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $RUN = util.promisify($EXEC);
                  ...
              - pattern-inside: |
                  $RUN = promisify($EXEC);
                  ...
          - pattern: $RUN($CMD, ...)
          - metavariable-pattern:
              metavariable: $EXEC
              pattern-either:
                - pattern: exec
                - pattern: $CP.exec
                - pattern: require("$M").exec
          - focus-metavariable: $CMD
      # execa runs the program directly unless told to use a shell; execaCommand splits a whole command line.
      - patterns:
          - pattern-either:
              - pattern: '$EXECA($CMD, ..., {..., shell: true, ...})'
              - pattern: '$EXECA($PROG, [..., $CMD, ...], {..., shell: true, ...})'
              - pattern: '$EXECA("=~/^(\/bin\/|\/usr\/bin\/)?(sh|bash|zsh|dash|cmd|cmd\.exe|powershell)$/", [..., $CMD, ...], ...)'
          - metavariable-regex: {metavariable: $EXECA, regex: '^(execa|execaSync)$'}
          - focus-metavariable: $CMD
      - patterns:
          - pattern-either:
              - pattern: execaCommand($CMD, ...)
              - pattern: execaCommandSync($CMD, ...)
              - pattern: execa.commandSync($CMD, ...)
          - focus-metavariable: $CMD

  - id: codewatch.js.path-traversal
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Data from the request is used as a file path, so "../" can reach files outside the intended folder. Take
      path.basename() of it, or resolve it and check the result still starts with the base folder.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data used as a file path
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"]
      owasp: ["A01:2025 - Broken Access Control"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Nodejs_Security_Cheat_Sheet.html
        - https://expressjs.com/en/api.html#res.sendFile
    pattern-sources: *js-sources
    pattern-sanitizers:
      - *san-numeric
      - *san-named
      - *san-allowlist-ternary
      - *san-guard
      - *san-signed
      - *san-lookup-result
      - pattern: path.basename(...)
      # multer and express-fileupload take the file name through busboy, which drops any directory part.
      - pattern-either:
          - pattern: $REQ.file.originalname
          - pattern: $REQ.files.$FIELD.name
          - pattern: $REQ.files[$FIELD].originalname
          - pattern: $REQ.files[$FIELD].name
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      const $F = $REQ.files.$FIELD;
                      ...
                  - pattern-inside: |
                      let $F = $REQ.files.$FIELD;
                      ...
                  - pattern-inside: |
                      const $F = $REQ.files[$FIELD];
                      ...
              - pattern-either:
                  - pattern: $F.name
                  - pattern: $F.originalname
      # if (!resolved.startsWith(base)) return/throw ...
      - patterns:
          - pattern-inside: |
              if (<... !$X.startsWith(...) ...>) { ... }
              ...
          - pattern: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: fs.$FN($PATH, ...)
                      - pattern: fs.promises.$FN($PATH, ...)
                      - pattern: fsPromises.$FN($PATH, ...)
                  - metavariable-regex: &js-file-functions
                      metavariable: $FN
                      regex: '^(readFile|readFileSync|createReadStream|writeFile|writeFileSync|createWriteStream|appendFile|appendFileSync|unlink|unlinkSync|rm|rmSync|readdir|readdirSync|open|openSync|copyFile|copyFileSync|rename|renameSync|rmdir|rmdirSync|cp|cpSync|opendir|opendirSync|truncate|truncateSync|symlink|symlinkSync|remove|removeSync|outputFile|outputFileSync|outputJson|outputJsonSync|outputJSON|readJson|readJsonSync|readJSON|writeJson|writeJsonSync|writeJSON|copy|copySync|move|moveSync)$'
              - patterns:
                  - pattern: $RES.sendFile($PATH)
                  - metavariable-regex: {metavariable: $RES, regex: '^(res|response|reply)$'}
              - patterns:
                  - pattern: $RES.download($PATH, ...)
                  - metavariable-regex: {metavariable: $RES, regex: '^(res|response|reply)$'}
              # express-fileupload: req.files.upload.mv(path)
              - pattern: $FILE.mv($PATH, ...)
          - focus-metavariable: $PATH
      # A file module under any name, or one Semgrep doesn't resolve to fs: const fsp = require('fs/promises'),
      # import fse from 'fs-extra', node:fs, node:fs/promises.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $FS = require("$MOD");
                  ...
              - pattern-inside: |
                  import * as $FS from "$MOD";
                  ...
              - pattern-inside: |
                  import $FS from "$MOD";
                  ...
          - pattern: $FS.$FN($PATH, ...)
          - metavariable-regex: &js-file-modules {metavariable: $MOD, regex: '^(node:)?fs(/promises)?$|^(fs-extra|graceful-fs)$'}
          - metavariable-regex: {metavariable: $FS, regex: '^[A-Za-z_$][\w$]*$'}
          # Semgrep also binds a destructured name to itself (const { readFile } = require('fs') as readFile.readFile).
          - metavariable-comparison: {comparison: str($FS) != str($FN)}
          - metavariable-regex: *js-file-functions
          - focus-metavariable: $PATH
      # require('fs').createReadStream(p), inline.
      - patterns:
          - pattern: require("$MOD").$FN($PATH, ...)
          - metavariable-regex: *js-file-modules
          - metavariable-regex: *js-file-functions
          - focus-metavariable: $PATH
      # import { readFile } from 'fs/promises'
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import { $FN } from "$MOD";
                  ...
              - pattern-inside: |
                  const { $FN } = require("$MOD");
                  ...
          - pattern: $FN($PATH, ...)
          - metavariable-regex: *js-file-modules
          - metavariable-regex: *js-file-functions
          - focus-metavariable: $PATH
      # The destination of a move or copy: fs.rename(upload.path, path.join(dir, req.body.name)).
      - patterns:
          - pattern-either:
              - pattern: $FS.$FN($SRC, $PATH, ...)
              - pattern: $FN($SRC, $PATH, ...)
          - metavariable-regex: {metavariable: $FN, regex: '^(rename|renameSync|copyFile|copyFileSync|cp|cpSync|copy|copySync|move|moveSync|symlink|symlinkSync)$'}
          - metavariable-regex: {metavariable: $FS, regex: '^(fs|fsPromises|fsp|fse|fsExtra|fs\.promises)$'}
          - focus-metavariable: $PATH
      # res.sendFile(p, options) without a root, or with a callback. With root, send rejects "..".
      - patterns:
          - pattern-either:
              - pattern: '$RES.sendFile($PATH, {...}, ...)'
              - pattern: '$RES.sendFile($PATH, function (...) { ... })'
              - pattern: '$RES.sendFile($PATH, (...) => $BODY)'
          - pattern-not: '$RES.sendFile($PATH, {..., root: $ROOT, ...}, ...)'
          - metavariable-regex: {metavariable: $RES, regex: '^(res|response|reply)$'}
          - focus-metavariable: $PATH

  - id: codewatch.js.xss
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Data from the request, the URL or a form field is written into HTML without escaping, so it can carry
      script. Escape it
      (escape-html, he.encode, DOMPurify.sanitize for markup), use textContent, or render through a template engine
      that escapes by default.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request or URL data written into HTML
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
    pattern-sources:
      - *src-request-field
      - *src-request-getter
      - *src-search-params
      - *src-url-search-params
      - *src-nest-param
      - &dom-sources
        pattern-either:
          - pattern: location.hash
          - pattern: location.search
          - pattern: location.href
          - pattern: window.location.hash
          - pattern: window.location.search
          - pattern: window.location.href
          - pattern: document.location.hash
          - pattern: document.location.search
          - pattern: document.location.href
          - pattern: document.URL
          - pattern: document.documentURI
          - pattern: document.referrer
          - pattern: window.name
          - patterns:
              - pattern-inside: |
                  $W.addEventListener("message", ($E) => { ... })
              - pattern: $E.data
      # A form field's value is whatever was typed or pasted into it (calibre-web GHSA-wrp6: an upload's file name
      # from $(this).val() into .html(); Modoboa GHSA-c467: $("#id_name").val()). For this rule only: as a URL or
      # a path it is the user's own navigation.
      - pattern-either:
          - pattern: $($SEL).val()
          - pattern: $($SEL).$FIND(...).val()
          - pattern: document.getElementById(...).value
          - pattern: document.querySelector(...).value
    pattern-sanitizers:
      - *san-numeric
      - *san-named
      - *san-allowlist-ternary
      - *san-guard
      - *san-signed
      - *san-file-content
      - *san-lookup-result
      # The Host and X-Forwarded-* headers: a victim's browser sends the real host for a page, and a proxy sets the
      # rest, so a link can't make them carry markup (linkwarden: an RSS feed's site_url from req.headers.host).
      - patterns:
          - pattern-either:
              - pattern: $REQ.headers.host
              - pattern: $REQ.hostname
              - pattern: $REQ.host
              - pattern: $REQ.protocol
          - metavariable-regex: {metavariable: $REQ, regex: '^(req|request|ctx|ctx\.request|context\.req)$'}
      - patterns:
          - pattern-either:
              - pattern: $REQ.headers[$HEADER]
              - pattern: $REQ.get($HEADER)
              - pattern: $REQ.header($HEADER)
          - metavariable-regex: {metavariable: $REQ, regex: '^(req|request|ctx|ctx\.request|context\.req)$'}
          - metavariable-regex: {metavariable: $HEADER, regex: '(?i)^[''"](host|x-forwarded-[a-z-]+)[''"]$'}
      - pattern-either:
          - pattern: escapeHtml(...)
          - pattern: escape(...)
          - pattern: he.encode(...)
          - pattern: he.escape(...)
          - pattern: DOMPurify.sanitize(...)
          - pattern: sanitizeHtml(...)
          - pattern: xss(...)
          - pattern: validator.escape(...)
          - pattern: encodeURIComponent(...)
          - pattern: encodeURI(...)
          - pattern: $X.textContent
      # A fetch's response is what the server sent back, not the text the request carried: a form value posted
      # with fetch('/api/compare', {body: ...}) doesn't make the reply's fields the user's input.
      - pattern: fetch(...)
      # htmlEncode(str) / encodeHTML / html_encode: named for escaping markup (Modoboa's fix for GHSA-c467).
      - patterns:
          - pattern: $ENCODE(...)
          - metavariable-regex: {metavariable: $ENCODE, regex: '(?i)(.*\.)?(html_?encode|encode_?html|html_?entities)\w*$'}
      # A record from the data layer, found or saved using the request's values, is the stored object rather
      # than the request's text: await userService.getUserById(req.params.id)
      - patterns:
          - pattern: await $DATA.$ACCESS(...)
          - metavariable-regex:
              metavariable: $DATA
              regex: '(?i)(.*\.)?(\w*(service|repo|repository|model|dao|store)|db|prisma|collection|knex)$'
          - metavariable-regex:
              metavariable: $ACCESS
              regex: '^(?!.*(?i:html|render|template|markup|view|page))(find|get|create|update|save|insert|upsert|delete|remove|query|fetch|load|count)\w*$'
      # A fixed template rendered with the request's values: these engines escape <%= %>, {{ }} and #{} unless the
      # template asks for raw output (<%-, {{{, !{, !=, | safe).
      - patterns:
          - pattern-either:
              - pattern: $ENGINE.render($TEMPLATE, ...)
              - pattern: $ENGINE.renderString($TEMPLATE, ...)
              - pattern: $ENGINE.compile($TEMPLATE, ...)(...)
          - metavariable-regex: {metavariable: $ENGINE, regex: '(?i)^(pug|jade|ejs|handlebars|hbs|nunjucks|mustache|eta)$'}
          - metavariable-regex:
              metavariable: $TEMPLATE
              regex: '^[''"`](?![\s\S]*(<%-|\{\{\{|!\{|!=|\|\s*safe|\$\{))[\s\S]*[''"`]$'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.send($HTML)
              - pattern: $RES.write($HTML)
              - pattern: $RES.end($HTML)
          - metavariable-regex: {metavariable: $RES, regex: '^(res|response)$'}
          # Objects and arrays go out as JSON, not HTML.
          - pattern-not: $RES.$SEND({...})
          - pattern-not: $RES.$SEND([...])
          # So does anything after the response was given a non-HTML type (JSON, plain text, an event stream).
          - pattern-not-inside: |
              $RES.setHeader("=~/(?i)^content-type$/", "=~/(?i)(json|event-stream|text\/plain|octet-stream)/");
              ...
          - pattern-not-inside: |
              $RES.set("=~/(?i)^content-type$/", "=~/(?i)(json|event-stream|text\/plain|octet-stream)/");
              ...
          - pattern-not-inside: |
              $RES.type("=~/(?i)(json|text|plain|event-stream)/");
              ...
          - focus-metavariable: $HTML
      - patterns:
          - pattern-either:
              - pattern: $EL.innerHTML = $HTML
              - pattern: $EL.outerHTML = $HTML
              - pattern: $EL.insertAdjacentHTML($POS, $HTML)
              - pattern: document.write($HTML)
              - pattern: document.writeln($HTML)
              - pattern: $($SEL).html($HTML)
              - pattern: $($SEL).append($HTML)
              # A jQuery object kept in a variable, named with a $ as jQuery code does: $span.html(...)
              - patterns:
                  - pattern-either:
                      - pattern: $JQ.html($HTML)
                      - pattern: $JQ.append($HTML)
                  - metavariable-regex: {metavariable: $JQ, regex: '^\$\w+$'}
          - focus-metavariable: $HTML

  - id: codewatch.js.open-redirect
    mode: taint
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Data from the request or the URL decides where the user is redirected, so a link to this page can send them
      to any site. Redirect only to relative paths or to hosts on an exact allowlist (compare new URL(x).origin).
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Redirect target taken from the request
      cwe: ["CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"]
      owasp: ["A01:2025 - Broken Access Control"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
    pattern-sources:
      - *src-request-field
      - *src-request-getter
      - *src-search-params
      - *src-url-search-params
      - *src-nest-param
      - *src-destructured-request
      - *dom-sources
    pattern-sanitizers:
      - *san-numeric
      - *san-named
      - *san-allowlist-ternary
      - *san-guard
      - *san-signed
      - *san-file-content
      - *san-lookup-result
      - patterns:
          - pattern-inside: |
              if (<... $ALLOWED.includes($X) ...>) { ... }
          - pattern: $X
      - patterns:
          - pattern-inside: |
              if (<... $ALLOWED.has($X) ...>) { ... }
          - pattern: $X
      # The Host header is the site the browser is already on; a link can't change it (HTTPS-upgrade redirects).
      - patterns:
          - pattern-either:
              - pattern: $REQ.headers.host
              - pattern: $REQ.hostname
              - pattern: $REQ.host
              - pattern: $REQ.get("host")
              - pattern: $REQ.header("host")
          - metavariable-regex: {metavariable: $REQ, regex: '^(req|request|ctx|ctx\.request)$'}
      # The request's own path stays on this site unless it starts with "//"; open-redirect-path covers that
      # (outline: /share/... rewritten to /s/..., and a URL on the team's host given the request's path).
      - patterns:
          - pattern-either:
              - pattern: $REQ.$PATH
              - pattern: $REQ.$PATH.$ANY
          - metavariable-regex: {metavariable: $REQ, regex: '^(req|request|ctx|ctx\.request)$'}
          - metavariable-regex: {metavariable: $PATH, regex: '^(url|originalUrl|path|baseUrl)$'}
      # A literal prefix of "/" and a character other than "/" or "\", or one with "?" or "#" before the value,
      # keeps the target on this site: the value can change the path or query, not the host (outline:
      # `/?notice=auth-error&description=${description}`). A bare "/" + value is still open ("//evil.example").
      - &san-fixed-prefix
        pattern-either:
          - patterns:
              - pattern: $TEMPLATE
              - metavariable-regex: {metavariable: $TEMPLATE, regex: '^`(/[^/\\`$]|[^`$]*[?#])'}
          - patterns:
              - pattern: $PREFIX + $REST
              - metavariable-regex: {metavariable: $PREFIX, regex: '^[''"](/[^/\\''"]|[^''"]*[?#])'}
      # A variable that starts as such a path stays on this site whatever is appended to it (habitica:
      # let url = `/static/apple-redirect?code=${code}`; url += `&name=${name}`): the append is clean. Semgrep sees
      # `url += x` as an assignment to url like any other, so a later `url = req.body.next` can't be told apart;
      # it stays tainted because it isn't an append, but one appended to after that would be missed.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  let $U = $START;
                  ...
              - pattern-inside: |
                  var $U = $START;
                  ...
          - metavariable-regex:
              metavariable: $START
              regex: '^(`(/[^/\\`$]|[^`$]*[?#])|[''"](/[^/\\''"]|[^''"]*[?#]))'
          - pattern-either:
              - pattern: $U + $X
              - pattern: $U += $X
      # The same after the app's configured base URL, which a link can't change (CTFd:
      # CTFd.config.urlRoot + "/login?next=" + ..., `${CTFd.config.urlRoot}/login?next=...`).
      - pattern-either:
          - patterns:
              - pattern: $TEMPLATE
              - metavariable-regex:
                  metavariable: $TEMPLATE
                  regex: '(?i)^`\$\{[\w$.]*\.(url_?root|root_?url|base_?url|base_?path|app_?url|site_?url)\}(/[^/\\`$]|[^`$]*[?#])'
          # Each value added after that prefix, however long the chain: `+` nests to the left, so in
          # root + "/login?next=" + root + location.pathname + location.hash the prefix is deep inside the
          # left operand of every later value.
          - patterns:
              - pattern-inside: $LEFT + $VALUE
              - metavariable-pattern:
                  metavariable: $LEFT
                  patterns:
                    - pattern: <... $ROOT + $LITERAL ...>
                    - metavariable-regex:
                        metavariable: $ROOT
                        regex: '(?i)^[\w$.]*\.(url_?root|root_?url|base_?url|base_?path|app_?url|site_?url)$'
                    - metavariable-regex: {metavariable: $LITERAL, regex: '^[''"](/[^/\\''"]|[^''"]*[?#])'}
              - pattern: $VALUE
      # The page's own address up to its fragment is this site, path included, so nothing appended can change the
      # host: a same-page jump (CTFd: window.location.href.split("#")[0] + "#preview"). Not location.origin, which
      # "@evil.example" or ".evil.example" appended would move to another host.
      - patterns:
          - pattern-either:
              - pattern: $LOC.href.split(...)[0]
              - pattern: $LOC.href.split(...)[0] + $REST
              - pattern: $LOC.href.split(...)[0] + $REST + $MORE
          - metavariable-regex: {metavariable: $LOC, regex: '^((window|document)\.)?location$'}
      # A URL object made from the page's own address keeps its origin when only its path or query is changed
      # (a filter link). What its query holds is still tainted: only the whole URL is clean.
      - patterns:
          - pattern-inside: |
              $U = new URL($LOC);
              ...
          - pattern-not-inside: |
              $U.href = $V;
              ...
          - pattern-not-inside: |
              $U.host = $V;
              ...
          - pattern-not-inside: |
              $U.hostname = $V;
              ...
          - pattern-not-inside: |
              $U.protocol = $V;
              ...
          - pattern-either:
              - pattern: $U.toString()
              - pattern: $U.href
              - pattern: String($U)
          - metavariable-regex: {metavariable: $LOC, regex: '^((window|document)\.)?(location(\.href)?|URL)$'}
    pattern-sinks: &js-redirect-sinks
      - patterns:
          - pattern-either:
              - pattern: $RES.redirect($URL)
              - pattern: $RES.redirect($STATUS, $URL)
          - metavariable-regex: {metavariable: $RES, regex: '^(res|response|ctx|reply)$'}
          - focus-metavariable: $URL
      - patterns:
          - pattern-either:
              - pattern: $RES.setHeader($NAME, $URL)
              - pattern: $RES.set($NAME, $URL)
              - pattern: $RES.header($NAME, $URL)
              - pattern: '$RES.writeHead($STATUS, {..., $NAME: $URL, ...})'
          - metavariable-regex: {metavariable: $RES, regex: '^(res|response|reply)$'}
          - metavariable-regex: {metavariable: $NAME, regex: '(?i)^[''"]?location[''"]?$'}
          - focus-metavariable: $URL
      - patterns:
          - pattern: $RES.location($URL)
          - metavariable-regex: {metavariable: $RES, regex: '^(res|response)$'}
          - focus-metavariable: $URL
      - patterns:
          - pattern-either:
              - pattern: location.href = $URL
              - pattern: window.location.href = $URL
              - pattern: window.location = $URL
              - pattern: location.assign($URL)
              - pattern: location.replace($URL)
              - pattern: window.location.assign($URL)
              - pattern: window.location.replace($URL)
              - pattern: window.open($URL, ...)
          - focus-metavariable: $URL

  - id: codewatch.js.open-redirect-path
    mode: taint
    languages: [typescript, javascript]
    severity: INFO
    message: >-
      The redirect target is built from the request's own path. That stays on this site unless the path can
      start with "//" (a request for "//evil.example/..." becomes a redirect to another host): check that the
      routes can't match such a path, or collapse repeated slashes first.
    # For review, as in Python: whether "//host" can reach this handler depends on the routing.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: Redirect built from the request path
      interprocedural: false
      cwe: ["CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"]
      owasp: ["A01:2025 - Broken Access Control"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
    pattern-sources:
      - patterns:
          - pattern: $REQ.$PATH
          - metavariable-regex: {metavariable: $REQ, regex: '^(req|request|ctx|ctx\.request)$'}
          - metavariable-regex: {metavariable: $PATH, regex: '^(url|originalUrl|path|baseUrl)$'}
    pattern-sanitizers:
      - *san-named
      - *san-guard
      - *san-signed
      - *san-lookup-result
      - *san-fixed-prefix
      # After a literal "https://host" prefix the path stays on that host.
      - patterns:
          - pattern: $TEMPLATE
          - metavariable-regex: {metavariable: $TEMPLATE, regex: '^`https?://[^`$]*\$\{[^}]*\}[^`$/]*\$\{'}
      - patterns:
          - pattern-inside: $PREFIX + $REQ.$PATH
          - pattern: $REQ.$PATH
          - metavariable-regex: {metavariable: $PREFIX, regex: '^[''"`]https?://'}
      - patterns:
          - pattern: $X.replace($PATTERN, "/")
          - metavariable-regex: {metavariable: $PATTERN, regex: '^/(\\/\{2,\}|\\/\+|\\/\\/\+)/g?$'}
      # A URL object on a fixed host keeps that host when only its path is set from the request.
      - patterns:
          - pattern-inside: |
              $U = new URL($BASE);
              ...
          - pattern-not-inside: |
              $U.href = $V;
              ...
          - pattern-not-inside: |
              $U.host = $V;
              ...
          - pattern-either:
              - pattern: $U.toString()
              - pattern: $U.href
              - pattern: String($U)
    pattern-sinks: *js-redirect-sinks

  - id: codewatch.js.code-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Data from the request or the URL is run as code. Parse it as data instead (JSON.parse, a lookup table of
      allowed operations); never evaluate it.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request or URL data evaluated as code
      cwe: ["CWE-94: Improper Control of Generation of Code ('Code Injection')", "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://nodejs.org/api/vm.html#vm-executing-javascript
        - https://cheatsheetseries.owasp.org/cheatsheets/Nodejs_Security_Cheat_Sheet.html
    pattern-sources:
      - *src-request-field
      - *src-request-getter
      - *src-search-params
      - *src-url-search-params
      - *src-nest-param
      - *src-destructured-request
      - *dom-sources
    pattern-sanitizers: *js-sanitizers
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($CODE)
              - pattern: new Function(..., $CODE)
              - pattern: Function(..., $CODE)
              - pattern: vm.runInThisContext($CODE, ...)
              - pattern: vm.runInNewContext($CODE, ...)
              - pattern: vm.runInContext($CODE, ...)
              - pattern: new vm.Script($CODE, ...)
              - pattern: setTimeout($CODE, ...)
              - pattern: setInterval($CODE, ...)
          - pattern-not: setTimeout((...) => {...}, ...)
          - pattern-not: setTimeout(function (...) {...}, ...)
          - pattern-not: setInterval((...) => {...}, ...)
          - pattern-not: setInterval(function (...) {...}, ...)
          - focus-metavariable: $CODE

  - id: codewatch.js.ssrf
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Data from the request decides which URL the server fetches, so it can be pointed at internal services or
      cloud metadata endpoints. Fetch only from hosts on an exact allowlist, and resolve and block private addresses.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Server-side request to a URL from the request
      cwe: ["CWE-918: Server-Side Request Forgery (SSRF)"]
      owasp: ["A01:2025 - Broken Access Control"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
    pattern-sources: *js-sources
    pattern-sanitizers:
      - *san-numeric
      - *san-named
      - *san-allowlist-ternary
      - *san-guard
      - *san-signed
      - *san-file-content
      - *san-lookup-result
      # Only the path or query is user data when the scheme and host are fixed in front of it: a literal
      # "https://host/", or a constant base (PAYPAL_API_URL, process.env.X, config.x) then "/" (proshop-v2:
      # `${PAYPAL_API_URL}/v2/checkout/orders/${id}`).
      - patterns:
          - pattern: $URL
          - metavariable-pattern:
              metavariable: $URL
              patterns:
                - pattern: '`...`'
                - pattern-regex: '^`(https?://[^/`$]+|\$\{\s*([A-Z][A-Z0-9_]*|process\.env\.\w+|(this\.)?(config|env|conf|settings)(\.\w+)+)\s*\})/'
      - patterns:
          - pattern: $PREFIX + $X
          - metavariable-regex: {metavariable: $PREFIX, regex: '^[''"]https?://[^/''"]+/'}
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($URL, ...)
              - pattern: axios($URL, ...)
              - pattern: axios.$METHOD($URL, ...)
              - pattern: got($URL, ...)
              - pattern: got.$METHOD($URL, ...)
              - pattern: request($URL, ...)
              # The request library's verbs only: Semgrep resolves a function imported from a project's own
              # utils/request module as request.$NAME (immich: fromMaybeArray(req.headers[...])).
              - patterns:
                  - pattern: request.$METHOD($URL, ...)
                  - metavariable-regex: {metavariable: $METHOD, regex: '^(get|post|put|patch|del|delete|head|options)$'}
              - pattern: needle.get($URL, ...)
              - pattern: superagent.$METHOD($URL, ...)
              - pattern: http.get($URL, ...)
              - pattern: http.request($URL, ...)
              - pattern: https.get($URL, ...)
              - pattern: https.request($URL, ...)
          # With an options object only the host decides where it goes: a path or headers from the request don't
          # (linkwarden's SSRF-guard proxy connects to a checked IP with the request's path).
          - pattern-not: http.get({...}, ...)
          - pattern-not: http.request({...}, ...)
          - pattern-not: https.get({...}, ...)
          - pattern-not: https.request({...}, ...)
          - focus-metavariable: $URL
      - patterns:
          - pattern-either:
              - pattern: '$HTTP.$CALL({..., host: $URL, ...}, ...)'
              - pattern: '$HTTP.$CALL({..., hostname: $URL, ...}, ...)'
              - pattern: '$HTTP.$CALL({..., url: $URL, ...}, ...)'
          - metavariable-regex: {metavariable: $HTTP, regex: '^https?$'}
          - metavariable-regex: {metavariable: $CALL, regex: '^(get|request)$'}
          - focus-metavariable: $URL
      # Clients called directly, which javascript-taint.yml only matches through a method (superagent.get(url),
      # needle.get(url)): superagent(url), needle('get', url), ky(url).
      - patterns:
          - pattern-either:
              - pattern: superagent($URL, ...)
              - pattern: superagent($METHOD, $URL, ...)
              - pattern: needle($METHOD, $URL, ...)
              - pattern: needle.request($METHOD, $URL, ...)
              - pattern: ky($URL, ...)
              - patterns:
                  - pattern-either:
                      - pattern: needle.$VERB($URL, ...)
                      - pattern: ky.$VERB($URL, ...)
                  - metavariable-regex: {metavariable: $VERB, regex: '^(post|put|patch|delete|head)$'}
              - patterns:
                  - pattern: ky.get($URL, ...)
          - pattern-not: superagent("$LITERAL", $URL, ...)
          - focus-metavariable: $URL
      # undici through its module object, or a name imported under another name: undici.request(url),
      # import { fetch as ufetch } from 'undici'. javascript-taint.yml's fetch(url) and request(url) cover the
      # plain names.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $U = require("undici");
                  ...
              - pattern-inside: |
                  import * as $U from "undici";
                  ...
              - pattern-inside: |
                  import $U from "undici";
                  ...
          - pattern: $U.$FN($URL, ...)
          - metavariable-regex: {metavariable: $FN, regex: '^(request|fetch|stream|pipeline|connect)$'}
          - focus-metavariable: $URL
      - patterns:
          - pattern: require("undici").$FN($URL, ...)
          - metavariable-regex: {metavariable: $FN, regex: '^(request|fetch|stream|pipeline|connect)$'}
          - focus-metavariable: $URL
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import { $IMP as $FN } from "undici";
                  ...
              - pattern-inside: |
                  const { $IMP: $FN } = require("undici");
                  ...
          - pattern: $FN($URL, ...)
          - metavariable-regex: {metavariable: $IMP, regex: '^(request|fetch|stream|pipeline|connect)$'}
          - metavariable-regex: {metavariable: $FN, regex: '^(?!(request|fetch)$)'}
          - focus-metavariable: $URL
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import { $FN } from "undici";
                  ...
              - pattern-inside: |
                  const { $FN } = require("undici");
                  ...
          - pattern: $FN($URL, ...)
          - metavariable-regex: {metavariable: $FN, regex: '^(stream|pipeline|connect)$'}
          - focus-metavariable: $URL

  - id: codewatch.js.unsafe-deserialization
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Data from the request is deserialized with a library that can run code embedded in it (node-serialize,
      funcster). Use JSON.parse, which only builds plain data.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data deserialized unsafely
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      owasp: ["A08:2025 - Software or Data Integrity Failures"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
    pattern-sources: *js-sources
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: require('node-serialize').unserialize($DATA)
              - pattern: serialize.unserialize($DATA)
              - pattern: funcster.deepDeserialize($DATA)
              - patterns:
                  - pattern: $LIB.unserialize($DATA)
                  - pattern-inside: |
                      $LIB = require('node-serialize')
                      ...
          - focus-metavariable: $DATA

  - id: codewatch.js.regex-injection
    mode: taint
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Data from the request or the URL is compiled as a regular expression, so a user can send a pattern that
      takes exponential time to match and blocks the event loop (ReDoS). Escape its special characters first
      (lodash's escapeRegExp), or match literally with includes().
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data used as a regular expression
      cwe: ["CWE-730: OWASP Top Ten 2004 Category A9 - Denial of Service", "CWE-1333: Inefficient Regular Expression Complexity"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://owasp.org/www-community/attacks/Regular_expression_Denial_of_Service_-_ReDoS
    pattern-sources:
      - *src-request-field
      - *src-request-getter
      - *src-search-params
      - *src-url-search-params
      - *src-nest-param
      - *src-destructured-request
    pattern-sanitizers:
      - *san-numeric
      - *san-named
      - *san-allowlist-ternary
      - *san-guard
      - *san-signed
      # Its special characters escaped by hand: x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') puts a backslash before
      # each match (habitica), so the pattern matches the text literally.
      - patterns:
          - pattern: $X.replace($RE, $ESCAPE)
          - metavariable-regex: {metavariable: $ESCAPE, regex: '^[''"`]\\\\\$&[''"`]$'}
      - *san-lookup-result
      - patterns:
          - pattern: $X.replace($RE, $WITH)
          - metavariable-regex: {metavariable: $WITH, regex: '\$\x26'}
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: new RegExp($PATTERN, ...)
              - pattern: RegExp($PATTERN, ...)
          - focus-metavariable: $PATTERN

  - id: codewatch.js.stack-trace-exposure
    mode: taint
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      An error's stack trace is sent back in the response. It shows file paths and code to whoever made the
      request. Log it on the server and send a generic error message instead.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Stack trace sent in the response
      interprocedural: false
      cwe: ["CWE-209: Generation of Error Message Containing Sensitive Information"]
      owasp: ["A10:2025 - Mishandling of Exceptional Conditions"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html
        - https://expressjs.com/en/guide/error-handling.html
    pattern-sources:
      - patterns:
          - pattern: $ERR.stack
          - metavariable-regex: {metavariable: $ERR, regex: '(?i)^(e|ex|exc|exception|\w*err(or)?)$'}
          # Only in development: if (process.env.NODE_ENV !== "production"), config.env === "development" && ...
          - pattern-not-inside: 'if (<... $C.NODE_ENV === $V ...>) { ... }'
          - pattern-not-inside: '<... $C.NODE_ENV === $V ...> ? $A : $B'
          - pattern-not-inside: '<... $C.NODE_ENV === $V ...> && $Y'
          - pattern-not-inside: 'if (<... $C.NODE_ENV !== $V ...>) { ... }'
          - pattern-not-inside: '<... $C.NODE_ENV !== $V ...> ? $A : $B'
          - pattern-not-inside: '<... $C.NODE_ENV !== $V ...> && $Y'
          - pattern-not-inside: 'if (<... $C.NODE_ENV == $V ...>) { ... }'
          - pattern-not-inside: '<... $C.NODE_ENV == $V ...> ? $A : $B'
          - pattern-not-inside: '<... $C.NODE_ENV == $V ...> && $Y'
          - pattern-not-inside: 'if (<... $C.NODE_ENV != $V ...>) { ... }'
          - pattern-not-inside: '<... $C.NODE_ENV != $V ...> ? $A : $B'
          - pattern-not-inside: '<... $C.NODE_ENV != $V ...> && $Y'
          - pattern-not-inside: 'if (<... $C.env === $V ...>) { ... }'
          - pattern-not-inside: '<... $C.env === $V ...> ? $A : $B'
          - pattern-not-inside: '<... $C.env === $V ...> && $Y'
          - pattern-not-inside: 'if (<... $C.env !== $V ...>) { ... }'
          - pattern-not-inside: '<... $C.env !== $V ...> ? $A : $B'
          - pattern-not-inside: '<... $C.env !== $V ...> && $Y'
          - pattern-not-inside: 'if (<... $C.env == $V ...>) { ... }'
          - pattern-not-inside: '<... $C.env == $V ...> ? $A : $B'
          - pattern-not-inside: '<... $C.env == $V ...> && $Y'
          - pattern-not-inside: 'if (<... $C.env != $V ...>) { ... }'
          - pattern-not-inside: '<... $C.env != $V ...> ? $A : $B'
          - pattern-not-inside: '<... $C.env != $V ...> && $Y'
          - pattern-not-inside: 'if (<... $APP.get("env") === $V ...>) { ... }'
          - pattern-not-inside: '<... $APP.get("env") === $V ...> ? $A : $B'
          - pattern-not-inside: '<... $APP.get("env") === $V ...> && $Y'
          - pattern-not-inside: 'if (<... $APP.get("env") !== $V ...>) { ... }'
          - pattern-not-inside: '<... $APP.get("env") !== $V ...> ? $A : $B'
          - pattern-not-inside: '<... $APP.get("env") !== $V ...> && $Y'
          - pattern-not-inside: 'if (<... $APP.get("env") == $V ...>) { ... }'
          - pattern-not-inside: '<... $APP.get("env") == $V ...> ? $A : $B'
          - pattern-not-inside: '<... $APP.get("env") == $V ...> && $Y'
          - pattern-not-inside: 'if (<... $APP.get("env") != $V ...>) { ... }'
          - pattern-not-inside: '<... $APP.get("env") != $V ...> ? $A : $B'
          - pattern-not-inside: '<... $APP.get("env") != $V ...> && $Y'
          - pattern-not-inside: 'if (<... $C.debug ...>) { ... }'
          - pattern-not-inside: '<... $C.debug ...> ? $A : $B'
          - pattern-not-inside: '<... $C.debug ...> && $Y'
          - pattern-not-inside: 'if (<... $C.DEBUG ...>) { ... }'
          - pattern-not-inside: '<... $C.DEBUG ...> ? $A : $B'
          - pattern-not-inside: '<... $C.DEBUG ...> && $Y'
          # Put in a response object that drops it again unless some condition holds (express-rest-boilerplate:
          # `if (env !== 'development') { delete response.stack; }`).
          - pattern-not-inside: |
              $OBJ = {..., stack: $ERR.stack, ...};
              ...
              if ($COND) { ... delete $OBJ.stack; ... }
          - pattern-not-inside: |
              const $OBJ = {..., stack: $ERR.stack, ...};
              ...
              if ($COND) { ... delete $OBJ.stack; ... }
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.$SEND(...)
              - pattern: $RES.status(...).$SEND(...)
          - metavariable-regex: {metavariable: $RES, regex: '^(res|response|reply)$'}
          - metavariable-regex: {metavariable: $SEND, regex: '^(send|json|jsonp|end|write|render)$'}
      - pattern: ctx.body = $BODY

  - id: codewatch.js.template-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Data from the request is compiled as a template, so a user can write template code that runs on the
      server. Pass request data as template variables, never as the template text.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data compiled as a server-side template
      cwe: ["CWE-1336: Improper Neutralization of Special Elements Used in a Template Engine"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://portswigger.net/web-security/server-side-template-injection
    pattern-sources: *js-sources
    pattern-sanitizers:
      - *san-numeric
      - *san-named
      - *san-allowlist-ternary
      - *san-guard
      - *san-signed
      - *san-lookup-result
    pattern-sinks:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $ENGINE.$COMPILE($TEMPLATE, ...)
                  - metavariable-regex:
                      metavariable: $ENGINE
                      regex: '(?i)^(pug|jade|ejs|handlebars|hbs|nunjucks|_|lodash|dot|mustache|hogan|swig|dust|eta|velocity|velocityjs|liquid|liquidjs)$'
                  - metavariable-regex:
                      metavariable: $COMPILE
                      regex: '^(render|compile|renderString|template|compileString|parseAndRender|parseAndRenderSync)$'
              - pattern: new nunjucks.Environment(...).renderString($TEMPLATE, ...)
              - pattern: new Liquid(...).parseAndRender($TEMPLATE, ...)
          - focus-metavariable: $TEMPLATE

  - id: codewatch.js.ldap-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Data from the request is built into an LDAP filter, so characters such as * ( ) can change what the
      search matches (and bypass a login check). Escape values for LDAP filters, or build the filter with
      ldapjs filter objects (new EqualityFilter({ attribute, value })).
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data built into an LDAP filter
      cwe: ["CWE-90: Improper Neutralization of Special Elements used in an LDAP Query ('LDAP Injection')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/LDAP_Injection_Prevention_Cheat_Sheet.html
    pattern-sources: *js-sources
    pattern-sanitizers:
      - *san-numeric
      - *san-named
      - *san-allowlist-ternary
      - *san-guard
      - *san-signed
      - *san-lookup-result
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: '$CLIENT.search($BASE, {..., filter: $FILTER, ...}, ...)'
              - pattern: ldap.parseFilter($FILTER)
          - focus-metavariable: $FILTER

  - id: codewatch.js.xpath-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Data from the request is built into an XPath expression, so quotes and operators in it can change which
      nodes are selected (and bypass a check). Pass it as an XPath variable, or allow only expected values.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data built into an XPath expression
      cwe: ["CWE-643: Improper Neutralization of Data within XPath Expressions ('XPath Injection')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://owasp.org/www-community/attacks/XPATH_Injection
    pattern-sources: *js-sources
    pattern-sanitizers:
      - *san-numeric
      - *san-named
      - *san-allowlist-ternary
      - *san-guard
      - *san-signed
      - *san-lookup-result
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: xpath.select($EXPR, ...)
              - pattern: xpath.select1($EXPR, ...)
              - pattern: xpath.evaluate($EXPR, ...)
              - pattern: xpath.parse($EXPR)
              - pattern: document.evaluate($EXPR, ...)
              - pattern: $DOC.evaluate($EXPR, $NODE, ...)
          - focus-metavariable: $EXPR
