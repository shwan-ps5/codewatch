# codewatch built-in taint rules for JavaScript/TypeScript: data from the HTTP request (Express, Koa, Next.js
# route handlers) or, in the browser, from the URL and messages, reaching an injection sink unchecked.
rules:
  - id: codewatch.js.sql-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Data from the request is built into a SQL query. Pass it as a bound parameter instead
      (sequelize.query(sql, { replacements }), pool.query(sql, [value]), knex.raw(sql, [value])).
    metadata: &js-meta-sql
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data built into a SQL query
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
        - https://sequelize.org/docs/v6/core-concepts/raw-queries/#replacements
    pattern-sources: &js-sources
      - &src-request-field
        patterns:
          - pattern-either:
              - pattern: $REQ.$FIELD
              - pattern: $REQ.$FIELD.$ANY
          - metavariable-regex: {metavariable: $REQ, regex: '^(req|request|ctx|ctx\.request|context\.req)$'}
          - metavariable-regex:
              metavariable: $FIELD
              regex: '^(body|query|params|cookies|signedCookies|headers|path|url|originalUrl|baseUrl|hostname|files|file)$'
      - &src-request-getter
        patterns:
          - pattern: $REQ.$GETTER(...)
          - metavariable-regex: {metavariable: $REQ, regex: '^(req|request|ctx|ctx\.request)$'}
          - metavariable-regex: {metavariable: $GETTER, regex: '^(get|header|param|cookies|json|text|formData)$'}
      - &src-search-params
        pattern: new URLSearchParams(...).get(...)
      - &src-url-search-params
        pattern: $URL.searchParams.get(...)
      # Handlers that destructure the request: ({ params, body }: Request, res) => ...
      - &src-destructured-request
        patterns:
          - pattern-either:
              - pattern-inside: '({..., $FIELD, ...}: Request, ...) => { ... }'
              - pattern-inside: 'function $F({..., $FIELD, ...}: Request, ...) { ... }'
              - pattern-inside: '$APP.$METHOD($PATH, ..., ({..., $FIELD, ...}, $RES, ...) => { ... })'
          - pattern: $FIELD
          - metavariable-regex: {metavariable: $FIELD, regex: '^(body|query|params|cookies|signedCookies|headers|files|file)$'}
    pattern-sanitizers: &js-sanitizers
      - &san-numeric
        pattern-either:
          - pattern: parseInt(...)
          - pattern: parseFloat(...)
          - pattern: Number(...)
          - pattern: Number.parseInt(...)
          - pattern: Number.parseFloat(...)
          - pattern: Boolean(...)
          - pattern: Math.$F(...)
          - pattern: $X.length
          - pattern: typeof $X
      # Functions named as validators (isValid, validateId, sanitizeName, escapeHtml) return checked data.
      - &san-named
        patterns:
          - pattern: $CHECK(...)
          - metavariable-regex: {metavariable: $CHECK, regex: '(?i)(.*\.)?(is_?valid|validat|sanitiz|escape|clean|safe|whitelist|allowlist)\w{0,40}$'}
      # [allowed].includes(x) ? x : fallback only ever yields an allowed value.
      - &san-allowlist-ternary
        pattern: '$ALLOWED.includes($X) ? $X : $FALLBACK'
      # A check on the value that bails out: if (!next.startsWith("/") || next.startsWith("//")) return ...
      - &san-guard
        patterns:
          - pattern-either:
              - pattern-inside: |
                  if (<... $X.startsWith(...) ...>) { ... return ...; }
                  ...
              - pattern-inside: |
                  if (<... $X.startsWith(...) ...>) return ...;
                  ...
              - pattern-inside: |
                  if (<... $X.startsWith(...) ...>) { ... throw $E; }
                  ...
              - pattern-inside: |
                  if (<... $X.startsWith(...) ...>) throw $E;
                  ...
              - pattern-inside: |
                  if (<... $X.endsWith(...) ...>) { ... return ...; }
                  ...
              - pattern-inside: |
                  if (<... $X.endsWith(...) ...>) return ...;
                  ...
              - pattern-inside: |
                  if (<... $X.endsWith(...) ...>) { ... throw $E; }
                  ...
              - pattern-inside: |
                  if (<... $X.endsWith(...) ...>) throw $E;
                  ...
              - pattern-inside: |
                  if (<... $X.includes(...) ...>) { ... return ...; }
                  ...
              - pattern-inside: |
                  if (<... $X.includes(...) ...>) return ...;
                  ...
              - pattern-inside: |
                  if (<... $X.includes(...) ...>) { ... throw $E; }
                  ...
              - pattern-inside: |
                  if (<... $X.includes(...) ...>) throw $E;
                  ...
              - pattern-inside: |
                  if (<... $ALLOWED.includes($X) ...>) { ... return ...; }
                  ...
              - pattern-inside: |
                  if (<... $ALLOWED.includes($X) ...>) return ...;
                  ...
              - pattern-inside: |
                  if (<... $ALLOWED.includes($X) ...>) { ... throw $E; }
                  ...
              - pattern-inside: |
                  if (<... $ALLOWED.includes($X) ...>) throw $E;
                  ...
              - pattern-inside: |
                  if (<... $ALLOWED.has($X) ...>) { ... return ...; }
                  ...
              - pattern-inside: |
                  if (<... $ALLOWED.has($X) ...>) return ...;
                  ...
              - pattern-inside: |
                  if (<... $ALLOWED.has($X) ...>) { ... throw $E; }
                  ...
              - pattern-inside: |
                  if (<... $ALLOWED.has($X) ...>) throw $E;
                  ...
              - pattern-inside: |
                  if (<... $RE.test($X) ...>) { ... return ...; }
                  ...
              - pattern-inside: |
                  if (<... $RE.test($X) ...>) return ...;
                  ...
              - pattern-inside: |
                  if (<... $RE.test($X) ...>) { ... throw $E; }
                  ...
              - pattern-inside: |
                  if (<... $RE.test($X) ...>) throw $E;
                  ...
              - pattern-inside: |
                  if (<... $X.match(...) ...>) { ... return ...; }
                  ...
              - pattern-inside: |
                  if (<... $X.match(...) ...>) return ...;
                  ...
              - pattern-inside: |
                  if (<... $X.match(...) ...>) { ... throw $E; }
                  ...
              - pattern-inside: |
                  if (<... $X.match(...) ...>) throw $E;
                  ...
          - pattern: $X
      # What a file contains is the server's data, whatever path was used to read it (path-traversal checks the path).
      - &san-file-content
        pattern-either:
          - pattern: fs.readFile(...)
          - pattern: fs.readFileSync(...)
          - pattern: fs.promises.readFile(...)
          - pattern: readFile(...)
          - pattern: readFileSync(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($SQL, ...)
              - pattern: $DB.raw($SQL, ...)
              - pattern: $DB.$queryRawUnsafe($SQL, ...)
              - pattern: $DB.$executeRawUnsafe($SQL, ...)
              - pattern: $DB.execute($SQL, ...)
          - metavariable-regex:
              metavariable: $DB
              regex: '(?i)^(.*\.)?(sequelize|db|database|conn|connection|pool|client|knex|pg|mysql|sql|sqlite|prisma|tx|trx|transaction)$'
          - focus-metavariable: $SQL

  - id: codewatch.js.command-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Data from the request reaches a shell command. Call execFile()/spawn() with an argument array and no
      shell, so the value can't add commands.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data in a shell command
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://nodejs.org/api/child_process.html#child_processexecfilefile-args-options-callback
    pattern-sources: *js-sources
    pattern-sanitizers: *js-sanitizers
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: child_process.exec($CMD, ...)
              - pattern: child_process.execSync($CMD, ...)
              - pattern: require('child_process').exec($CMD, ...)
              - pattern: require('child_process').execSync($CMD, ...)
              - pattern: 'child_process.spawn($CMD, ..., {..., shell: true, ...})'
              - pattern: 'child_process.spawnSync($CMD, ..., {..., shell: true, ...})'
              - pattern: execa.command($CMD, ...)
              - pattern: shelljs.exec($CMD, ...)
              # A shell started by hand: spawn("sh", ["-c", cmd])
              - pattern: 'child_process.$SPAWN("=~/^(\/bin\/|\/usr\/bin\/)?(sh|bash|zsh|dash|cmd|cmd\.exe|powershell)$/", [..., $CMD, ...], ...)'
              # const exec = require('child_process').exec
              - patterns:
                  - pattern: $EXEC($CMD, ...)
                  - pattern-inside: |
                      $EXEC = require('child_process').$METHOD
                      ...
                  - metavariable-regex: {metavariable: $METHOD, regex: ^(exec|execSync)$}
          - focus-metavariable: $CMD

  - id: codewatch.js.path-traversal
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Data from the request is used as a file path, so "../" can reach files outside the intended folder. Take
      path.basename() of it, or resolve it and check the result still starts with the base folder.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data used as a file path
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"]
      owasp: ["A01:2025 - Broken Access Control"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Nodejs_Security_Cheat_Sheet.html
        - https://expressjs.com/en/api.html#res.sendFile
    pattern-sources: *js-sources
    pattern-sanitizers:
      - *san-numeric
      - *san-named
      - *san-allowlist-ternary
      - *san-guard
      - pattern: path.basename(...)
      # multer and express-fileupload take the file name through busboy, which drops any directory part.
      - pattern-either:
          - pattern: $REQ.file.originalname
          - pattern: $REQ.files.$FIELD.name
          - pattern: $REQ.files[$FIELD].originalname
          - pattern: $REQ.files[$FIELD].name
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      const $F = $REQ.files.$FIELD;
                      ...
                  - pattern-inside: |
                      let $F = $REQ.files.$FIELD;
                      ...
                  - pattern-inside: |
                      const $F = $REQ.files[$FIELD];
                      ...
              - pattern-either:
                  - pattern: $F.name
                  - pattern: $F.originalname
      # if (!resolved.startsWith(base)) return/throw ...
      - patterns:
          - pattern-inside: |
              if (<... !$X.startsWith(...) ...>) { ... }
              ...
          - pattern: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: fs.$FN($PATH, ...)
                      - pattern: fs.promises.$FN($PATH, ...)
                      - pattern: fsPromises.$FN($PATH, ...)
                  - metavariable-regex:
                      metavariable: $FN
                      regex: '^(readFile|readFileSync|createReadStream|writeFile|writeFileSync|createWriteStream|appendFile|appendFileSync|unlink|unlinkSync|rm|rmSync|readdir|readdirSync|open|openSync|copyFile|copyFileSync|rename|renameSync)$'
              - patterns:
                  - pattern: $RES.sendFile($PATH)
                  - metavariable-regex: {metavariable: $RES, regex: '^(res|response|reply)$'}
              - patterns:
                  - pattern: $RES.download($PATH, ...)
                  - metavariable-regex: {metavariable: $RES, regex: '^(res|response|reply)$'}
              # express-fileupload: req.files.upload.mv(path)
              - pattern: $FILE.mv($PATH, ...)
          - focus-metavariable: $PATH

  - id: codewatch.js.xss
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Data from the request or the URL is written into HTML without escaping, so it can carry script. Escape it
      (escape-html, he.encode, DOMPurify.sanitize for markup), use textContent, or render through a template engine
      that escapes by default.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request or URL data written into HTML
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
    pattern-sources:
      - *src-request-field
      - *src-request-getter
      - *src-search-params
      - *src-url-search-params
      - &dom-sources
        pattern-either:
          - pattern: location.hash
          - pattern: location.search
          - pattern: location.href
          - pattern: window.location.hash
          - pattern: window.location.search
          - pattern: window.location.href
          - pattern: document.location.hash
          - pattern: document.location.search
          - pattern: document.location.href
          - pattern: document.URL
          - pattern: document.documentURI
          - pattern: document.referrer
          - pattern: window.name
          - patterns:
              - pattern-inside: |
                  $W.addEventListener("message", ($E) => { ... })
              - pattern: $E.data
    pattern-sanitizers:
      - *san-numeric
      - *san-named
      - *san-allowlist-ternary
      - *san-guard
      - *san-file-content
      - pattern-either:
          - pattern: escapeHtml(...)
          - pattern: escape(...)
          - pattern: he.encode(...)
          - pattern: he.escape(...)
          - pattern: DOMPurify.sanitize(...)
          - pattern: sanitizeHtml(...)
          - pattern: xss(...)
          - pattern: validator.escape(...)
          - pattern: encodeURIComponent(...)
          - pattern: encodeURI(...)
          - pattern: $X.textContent
      # A record from the data layer, found or saved using the request's values, is the stored object rather
      # than the request's text: await userService.getUserById(req.params.id)
      - patterns:
          - pattern: await $DATA.$ACCESS(...)
          - metavariable-regex:
              metavariable: $DATA
              regex: '(?i)(.*\.)?(\w*(service|repo|repository|model|dao|store)|db|prisma|collection|knex)$'
          - metavariable-regex:
              metavariable: $ACCESS
              regex: '^(?!.*(?i:html|render|template|markup|view|page))(find|get|create|update|save|insert|upsert|delete|remove|query|fetch|load|count)\w*$'
      # A fixed template rendered with the request's values: these engines escape <%= %>, {{ }} and #{} unless the
      # template asks for raw output (<%-, {{{, !{, !=, | safe).
      - patterns:
          - pattern-either:
              - pattern: $ENGINE.render($TEMPLATE, ...)
              - pattern: $ENGINE.renderString($TEMPLATE, ...)
              - pattern: $ENGINE.compile($TEMPLATE, ...)(...)
          - metavariable-regex: {metavariable: $ENGINE, regex: '(?i)^(pug|jade|ejs|handlebars|hbs|nunjucks|mustache|eta)$'}
          - metavariable-regex:
              metavariable: $TEMPLATE
              regex: '^[''"`](?![\s\S]*(<%-|\{\{\{|!\{|!=|\|\s*safe|\$\{))[\s\S]*[''"`]$'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.send($HTML)
              - pattern: $RES.write($HTML)
              - pattern: $RES.end($HTML)
          - metavariable-regex: {metavariable: $RES, regex: '^(res|response)$'}
          # Objects and arrays go out as JSON, not HTML.
          - pattern-not: $RES.$SEND({...})
          - pattern-not: $RES.$SEND([...])
          # So does anything after the response was given a non-HTML type (JSON, plain text, an event stream).
          - pattern-not-inside: |
              $RES.setHeader("=~/(?i)^content-type$/", "=~/(?i)(json|event-stream|text\/plain|octet-stream)/");
              ...
          - pattern-not-inside: |
              $RES.set("=~/(?i)^content-type$/", "=~/(?i)(json|event-stream|text\/plain|octet-stream)/");
              ...
          - pattern-not-inside: |
              $RES.type("=~/(?i)(json|text|plain|event-stream)/");
              ...
          - focus-metavariable: $HTML
      - patterns:
          - pattern-either:
              - pattern: $EL.innerHTML = $HTML
              - pattern: $EL.outerHTML = $HTML
              - pattern: $EL.insertAdjacentHTML($POS, $HTML)
              - pattern: document.write($HTML)
              - pattern: document.writeln($HTML)
              - pattern: $($SEL).html($HTML)
              - pattern: $($SEL).append($HTML)
          - focus-metavariable: $HTML

  - id: codewatch.js.open-redirect
    mode: taint
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Data from the request or the URL decides where the user is redirected, so a link to this page can send them
      to any site. Redirect only to relative paths or to hosts on an exact allowlist (compare new URL(x).origin).
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Redirect target taken from the request
      cwe: ["CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"]
      owasp: ["A01:2025 - Broken Access Control"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
    pattern-sources:
      - *src-request-field
      - *src-request-getter
      - *src-search-params
      - *src-url-search-params
      - *src-destructured-request
      - *dom-sources
    pattern-sanitizers:
      - *san-numeric
      - *san-named
      - *san-allowlist-ternary
      - *san-guard
      - *san-file-content
      - patterns:
          - pattern-inside: |
              if (<... $ALLOWED.includes($X) ...>) { ... }
          - pattern: $X
      - patterns:
          - pattern-inside: |
              if (<... $ALLOWED.has($X) ...>) { ... }
          - pattern: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.redirect($URL)
              - pattern: $RES.redirect($STATUS, $URL)
          - metavariable-regex: {metavariable: $RES, regex: '^(res|response|ctx|reply)$'}
          - focus-metavariable: $URL
      - patterns:
          - pattern-either:
              - pattern: $RES.setHeader($NAME, $URL)
              - pattern: $RES.set($NAME, $URL)
              - pattern: $RES.header($NAME, $URL)
              - pattern: '$RES.writeHead($STATUS, {..., $NAME: $URL, ...})'
          - metavariable-regex: {metavariable: $RES, regex: '^(res|response|reply)$'}
          - metavariable-regex: {metavariable: $NAME, regex: '(?i)^[''"]?location[''"]?$'}
          - focus-metavariable: $URL
      - patterns:
          - pattern: $RES.location($URL)
          - metavariable-regex: {metavariable: $RES, regex: '^(res|response)$'}
          - focus-metavariable: $URL
      - patterns:
          - pattern-either:
              - pattern: location.href = $URL
              - pattern: window.location.href = $URL
              - pattern: window.location = $URL
              - pattern: location.assign($URL)
              - pattern: location.replace($URL)
              - pattern: window.location.assign($URL)
              - pattern: window.location.replace($URL)
              - pattern: window.open($URL, ...)
          - focus-metavariable: $URL

  - id: codewatch.js.code-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Data from the request or the URL is run as code. Parse it as data instead (JSON.parse, a lookup table of
      allowed operations); never evaluate it.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request or URL data evaluated as code
      cwe: ["CWE-94: Improper Control of Generation of Code ('Code Injection')", "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://nodejs.org/api/vm.html#vm-executing-javascript
        - https://cheatsheetseries.owasp.org/cheatsheets/Nodejs_Security_Cheat_Sheet.html
    pattern-sources:
      - *src-request-field
      - *src-request-getter
      - *src-search-params
      - *src-url-search-params
      - *src-destructured-request
      - *dom-sources
    pattern-sanitizers: *js-sanitizers
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($CODE)
              - pattern: new Function(..., $CODE)
              - pattern: Function(..., $CODE)
              - pattern: vm.runInThisContext($CODE, ...)
              - pattern: vm.runInNewContext($CODE, ...)
              - pattern: vm.runInContext($CODE, ...)
              - pattern: new vm.Script($CODE, ...)
              - pattern: setTimeout($CODE, ...)
              - pattern: setInterval($CODE, ...)
          - pattern-not: setTimeout((...) => {...}, ...)
          - pattern-not: setTimeout(function (...) {...}, ...)
          - pattern-not: setInterval((...) => {...}, ...)
          - pattern-not: setInterval(function (...) {...}, ...)
          - focus-metavariable: $CODE

  - id: codewatch.js.ssrf
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Data from the request decides which URL the server fetches, so it can be pointed at internal services or
      cloud metadata endpoints. Fetch only from hosts on an exact allowlist, and resolve and block private addresses.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Server-side request to a URL from the request
      cwe: ["CWE-918: Server-Side Request Forgery (SSRF)"]
      owasp: ["A01:2025 - Broken Access Control"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
    pattern-sources: *js-sources
    pattern-sanitizers: *js-sanitizers
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($URL, ...)
              - pattern: axios($URL, ...)
              - pattern: axios.$METHOD($URL, ...)
              - pattern: got($URL, ...)
              - pattern: got.$METHOD($URL, ...)
              - pattern: request($URL, ...)
              - pattern: request.$METHOD($URL, ...)
              - pattern: needle.get($URL, ...)
              - pattern: superagent.$METHOD($URL, ...)
              - pattern: http.get($URL, ...)
              - pattern: http.request($URL, ...)
              - pattern: https.get($URL, ...)
              - pattern: https.request($URL, ...)
          - focus-metavariable: $URL

  - id: codewatch.js.unsafe-deserialization
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Data from the request is deserialized with a library that can run code embedded in it (node-serialize,
      funcster). Use JSON.parse, which only builds plain data.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data deserialized unsafely
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      owasp: ["A08:2025 - Software or Data Integrity Failures"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
    pattern-sources: *js-sources
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: require('node-serialize').unserialize($DATA)
              - pattern: serialize.unserialize($DATA)
              - pattern: funcster.deepDeserialize($DATA)
              - patterns:
                  - pattern: $LIB.unserialize($DATA)
                  - pattern-inside: |
                      $LIB = require('node-serialize')
                      ...
          - focus-metavariable: $DATA

  - id: codewatch.js.regex-injection
    mode: taint
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Data from the request or the URL is compiled as a regular expression, so a user can send a pattern that
      takes exponential time to match and blocks the event loop (ReDoS). Escape its special characters first
      (lodash's escapeRegExp), or match literally with includes().
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data used as a regular expression
      cwe: ["CWE-730: OWASP Top Ten 2004 Category A9 - Denial of Service", "CWE-1333: Inefficient Regular Expression Complexity"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://owasp.org/www-community/attacks/Regular_expression_Denial_of_Service_-_ReDoS
    pattern-sources:
      - *src-request-field
      - *src-request-getter
      - *src-search-params
      - *src-url-search-params
      - *src-destructured-request
    pattern-sanitizers:
      - *san-numeric
      - *san-named
      - *san-allowlist-ternary
      - *san-guard
      - patterns:
          - pattern: $X.replace($RE, $WITH)
          - metavariable-regex: {metavariable: $WITH, regex: '\$\x26'}
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: new RegExp($PATTERN, ...)
              - pattern: RegExp($PATTERN, ...)
          - focus-metavariable: $PATTERN

  - id: codewatch.js.stack-trace-exposure
    mode: taint
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      An error's stack trace is sent back in the response. It shows file paths and code to whoever made the
      request. Log it on the server and send a generic error message instead.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Stack trace sent in the response
      interprocedural: false
      cwe: ["CWE-209: Generation of Error Message Containing Sensitive Information"]
      owasp: ["A10:2025 - Mishandling of Exceptional Conditions"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html
        - https://expressjs.com/en/guide/error-handling.html
    pattern-sources:
      - patterns:
          - pattern: $ERR.stack
          - metavariable-regex: {metavariable: $ERR, regex: '(?i)^(e|ex|exc|exception|\w*err(or)?)$'}
          # Only in development: if (process.env.NODE_ENV !== "production"), config.env === "development" && ...
          - pattern-not-inside: 'if (<... $C.NODE_ENV === $V ...>) { ... }'
          - pattern-not-inside: '<... $C.NODE_ENV === $V ...> ? $A : $B'
          - pattern-not-inside: '<... $C.NODE_ENV === $V ...> && $Y'
          - pattern-not-inside: 'if (<... $C.NODE_ENV !== $V ...>) { ... }'
          - pattern-not-inside: '<... $C.NODE_ENV !== $V ...> ? $A : $B'
          - pattern-not-inside: '<... $C.NODE_ENV !== $V ...> && $Y'
          - pattern-not-inside: 'if (<... $C.NODE_ENV == $V ...>) { ... }'
          - pattern-not-inside: '<... $C.NODE_ENV == $V ...> ? $A : $B'
          - pattern-not-inside: '<... $C.NODE_ENV == $V ...> && $Y'
          - pattern-not-inside: 'if (<... $C.NODE_ENV != $V ...>) { ... }'
          - pattern-not-inside: '<... $C.NODE_ENV != $V ...> ? $A : $B'
          - pattern-not-inside: '<... $C.NODE_ENV != $V ...> && $Y'
          - pattern-not-inside: 'if (<... $C.env === $V ...>) { ... }'
          - pattern-not-inside: '<... $C.env === $V ...> ? $A : $B'
          - pattern-not-inside: '<... $C.env === $V ...> && $Y'
          - pattern-not-inside: 'if (<... $C.env !== $V ...>) { ... }'
          - pattern-not-inside: '<... $C.env !== $V ...> ? $A : $B'
          - pattern-not-inside: '<... $C.env !== $V ...> && $Y'
          - pattern-not-inside: 'if (<... $C.env == $V ...>) { ... }'
          - pattern-not-inside: '<... $C.env == $V ...> ? $A : $B'
          - pattern-not-inside: '<... $C.env == $V ...> && $Y'
          - pattern-not-inside: 'if (<... $C.env != $V ...>) { ... }'
          - pattern-not-inside: '<... $C.env != $V ...> ? $A : $B'
          - pattern-not-inside: '<... $C.env != $V ...> && $Y'
          - pattern-not-inside: 'if (<... $APP.get("env") === $V ...>) { ... }'
          - pattern-not-inside: '<... $APP.get("env") === $V ...> ? $A : $B'
          - pattern-not-inside: '<... $APP.get("env") === $V ...> && $Y'
          - pattern-not-inside: 'if (<... $APP.get("env") !== $V ...>) { ... }'
          - pattern-not-inside: '<... $APP.get("env") !== $V ...> ? $A : $B'
          - pattern-not-inside: '<... $APP.get("env") !== $V ...> && $Y'
          - pattern-not-inside: 'if (<... $APP.get("env") == $V ...>) { ... }'
          - pattern-not-inside: '<... $APP.get("env") == $V ...> ? $A : $B'
          - pattern-not-inside: '<... $APP.get("env") == $V ...> && $Y'
          - pattern-not-inside: 'if (<... $APP.get("env") != $V ...>) { ... }'
          - pattern-not-inside: '<... $APP.get("env") != $V ...> ? $A : $B'
          - pattern-not-inside: '<... $APP.get("env") != $V ...> && $Y'
          - pattern-not-inside: 'if (<... $C.debug ...>) { ... }'
          - pattern-not-inside: '<... $C.debug ...> ? $A : $B'
          - pattern-not-inside: '<... $C.debug ...> && $Y'
          - pattern-not-inside: 'if (<... $C.DEBUG ...>) { ... }'
          - pattern-not-inside: '<... $C.DEBUG ...> ? $A : $B'
          - pattern-not-inside: '<... $C.DEBUG ...> && $Y'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.$SEND(...)
              - pattern: $RES.status(...).$SEND(...)
          - metavariable-regex: {metavariable: $RES, regex: '^(res|response|reply)$'}
          - metavariable-regex: {metavariable: $SEND, regex: '^(send|json|jsonp|end|write|render)$'}
      - pattern: ctx.body = $BODY

  - id: codewatch.js.template-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Data from the request is compiled as a template, so a user can write template code that runs on the
      server. Pass request data as template variables, never as the template text.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data compiled as a server-side template
      cwe: ["CWE-1336: Improper Neutralization of Special Elements Used in a Template Engine"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://portswigger.net/web-security/server-side-template-injection
    pattern-sources: *js-sources
    pattern-sanitizers:
      - *san-numeric
      - *san-named
      - *san-allowlist-ternary
      - *san-guard
    pattern-sinks:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $ENGINE.$COMPILE($TEMPLATE, ...)
                  - metavariable-regex:
                      metavariable: $ENGINE
                      regex: '(?i)^(pug|jade|ejs|handlebars|hbs|nunjucks|_|lodash|dot|mustache|hogan|swig|dust|eta|velocity|velocityjs|liquid|liquidjs)$'
                  - metavariable-regex:
                      metavariable: $COMPILE
                      regex: '^(render|compile|renderString|template|compileString|parseAndRender|parseAndRenderSync)$'
              - pattern: new nunjucks.Environment(...).renderString($TEMPLATE, ...)
              - pattern: new Liquid(...).parseAndRender($TEMPLATE, ...)
          - focus-metavariable: $TEMPLATE

  - id: codewatch.js.ldap-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Data from the request is built into an LDAP filter, so characters such as * ( ) can change what the
      search matches (and bypass a login check). Escape values for LDAP filters, or build the filter with
      ldapjs filter objects (new EqualityFilter({ attribute, value })).
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data built into an LDAP filter
      cwe: ["CWE-90: Improper Neutralization of Special Elements used in an LDAP Query ('LDAP Injection')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/LDAP_Injection_Prevention_Cheat_Sheet.html
    pattern-sources: *js-sources
    pattern-sanitizers:
      - *san-numeric
      - *san-named
      - *san-allowlist-ternary
      - *san-guard
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: '$CLIENT.search($BASE, {..., filter: $FILTER, ...}, ...)'
              - pattern: ldap.parseFilter($FILTER)
          - focus-metavariable: $FILTER

  - id: codewatch.js.xpath-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Data from the request is built into an XPath expression, so quotes and operators in it can change which
      nodes are selected (and bypass a check). Pass it as an XPath variable, or allow only expected values.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data built into an XPath expression
      cwe: ["CWE-643: Improper Neutralization of Data within XPath Expressions ('XPath Injection')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://owasp.org/www-community/attacks/XPATH_Injection
    pattern-sources: *js-sources
    pattern-sanitizers:
      - *san-numeric
      - *san-named
      - *san-allowlist-ternary
      - *san-guard
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: xpath.select($EXPR, ...)
              - pattern: xpath.select1($EXPR, ...)
              - pattern: xpath.evaluate($EXPR, ...)
              - pattern: xpath.parse($EXPR)
              - pattern: document.evaluate($EXPR, ...)
              - pattern: $DOC.evaluate($EXPR, $NODE, ...)
          - focus-metavariable: $EXPR
