# codewatch built-in rules for JavaScript/TypeScript web code (Express, Angular, MongoDB).
rules:
  - id: codewatch.js.angular-bypass-sanitizer
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Angular's sanitizer is bypassed for a value that isn't a fixed string, so HTML or script in it reaches the
      page. Let Angular sanitize it (bind to [innerHTML] without bypassing), or only bypass for constants.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Angular sanitizer bypassed for dynamic data
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://angular.dev/best-practices/security#bypass-security-apis-sparingly
        - https://angular.dev/api/platform-browser/DomSanitizer
    patterns:
      - pattern: $SANITIZER.$BYPASS($VALUE)
      - metavariable-regex: {metavariable: $BYPASS, regex: '^bypassSecurityTrust(Html|Script|Style|Url|ResourceUrl)$'}
      - pattern-not: $SANITIZER.$BYPASS("...")
      - pattern-not: $SANITIZER.$BYPASS(`...`)

  - id: codewatch.js.substring-url-allowlist
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      A URL is checked against an allowlist with a substring test, so "https://evil.example/?https://good.example"
      passes. Parse the URL (new URL(value)) and compare its origin or hostname exactly.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: URL allowlist checked with a substring test
      cwe: ["CWE-20: Improper Input Validation", "CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"]
      owasp: ["A01:2025 - Broken Access Control"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
        - https://developer.mozilla.org/en-US/docs/Web/API/URL
    patterns:
      - pattern-either:
          - pattern: $URL.includes($ALLOWED)
          - pattern: $URL.indexOf($ALLOWED) !== -1
          - pattern: $URL.indexOf($ALLOWED) > -1
          - pattern: $URL.indexOf($ALLOWED) >= 0
      - metavariable-regex: {metavariable: $URL, regex: '(?i).*(url|uri|redirect|href|location|target|returnto|next)'}
      - metavariable-regex: {metavariable: $ALLOWED, regex: '(?i).*(allow|white|trusted|safe|permitted)'}

  - id: codewatch.js.nosql-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A value from the request body is placed directly in a MongoDB query. A JSON body can send an object such as
      {"$ne": null} instead of a string and change what the query matches. Convert it to the expected type
      (String(), Number()) or validate it first.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request body used in a MongoDB query
      cwe: ["CWE-943: Improper Neutralization of Special Elements in Data Query Logic"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Injection_Prevention_Cheat_Sheet.html
        - https://www.mongodb.com/docs/manual/core/server-side-javascript/
    pattern-sources:
      - pattern: $REQ.body
      - pattern: $REQ.query
    pattern-sanitizers:
      - pattern: String(...)
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: $X.toString()
    pattern-sinks:
      # $where runs as JavaScript on the database server, so request data in it is code, whatever its type.
      - patterns:
          - pattern-either:
              - pattern: '{..., $where: $QUERY, ...}'
              - pattern: '{..., "$where": $QUERY, ...}'
              - pattern: $MODEL.$where($QUERY)
          - focus-metavariable: $QUERY
      - patterns:
          - pattern: $COLL.$METHOD($QUERY, ...)
          - metavariable-regex: {metavariable: $COLL, regex: '(?i).*(collection|mongo)'}
          - metavariable-regex:
              metavariable: $METHOD
              regex: '^(find|findOne|update|updateOne|updateMany|remove|deleteOne|deleteMany|count|countDocuments|findOneAndUpdate|findOneAndDelete|findOneAndReplace|replaceOne)$'
          - focus-metavariable: $QUERY

  - id: codewatch.js.unauthenticated-metrics
    languages: [typescript, javascript]
    severity: INFO
    message: >-
      The metrics endpoint is served with no middleware in front of it, so anyone can read internal counters,
      paths and versions. Put it behind authentication or serve it on an internal-only port.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: Metrics endpoint without authentication
      cwe: ["CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"]
      owasp: ["A02:2025 - Security Misconfiguration"]
      references:
        - https://prometheus.io/docs/operating/security/
    pattern-either:
      - pattern: $APP.get("/metrics", $HANDLER)
      - pattern: $APP.use("/metrics", $HANDLER)

  - id: codewatch.js.weak-hash
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      MD4, MD5 and SHA-1 are broken for security use. Use SHA-256 or better, or a password hash
      (scrypt, argon2, bcrypt) for passwords.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Weak hash algorithm
      security-purpose: required
      cwe: ["CWE-328: Use of Weak Hash"]
      owasp: ["A04:2025 - Cryptographic Failures"]
      references:
        - https://nodejs.org/api/crypto.html#cryptocreatehashalgorithm-options
        - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
    pattern: $CRYPTO.createHash("=~/(?i)^(md4|md5|sha1|sha-1|ripemd160)$/", ...)

  - id: codewatch.js.directory-listing
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Directory listing is switched on for this path, so anyone can browse every file in the folder, including
      ones nobody linked to (backups, logs, keys). Serve the files that are meant to be public by name instead.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Directory listing enabled
      cwe: ["CWE-548: Exposure of Information Through Directory Listing"]
      owasp: ["A02:2025 - Security Misconfiguration"]
      references:
        - https://github.com/expressjs/serve-index#readme
    pattern-either:
      - pattern: $APP.use(..., serveIndex(...), ...)
      - pattern: $APP.use(..., $MOD.serveIndex(...), ...)

  - id: codewatch.js.template-autoescape-disabled
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      HTML escaping is switched off for every template this engine renders, so any request data a template prints
      becomes markup and script (XSS). Leave autoescape on and mark the few trusted fragments safe one by one.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Template auto-escaping disabled
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://mozilla.github.io/nunjucks/api.html#configure
        - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
    pattern-either:
      - pattern: '$SWIG.setDefaults({..., autoescape: false, ...})'
      - pattern: '$NUNJUCKS.configure(..., {..., autoescape: false, ...})'
      - pattern: '$NUNJUCKS.configure({..., autoescape: false, ...})'
      - pattern: 'new $ENV(..., {..., autoescape: false, ...})'
      - pattern: '$HANDLEBARS.compile($TEMPLATE, {..., noEscape: true, ...})'

  - id: codewatch.js.unrestricted-upload
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      An uploaded file is stored under the name the client sent, extension included. An .html, .svg or script
      file served back from this site runs as part of it. Check the extension and type against an allowlist
      (multer's fileFilter), or store the file under a generated name with an extension you choose.
    # For review: harmless if the folder is never served; multer and busboy already drop any directory part.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: Upload stored under the client's file name
      cwe: ["CWE-434: Unrestricted Upload of File with Dangerous Type"]
      owasp: ["A06:2025 - Insecure Design"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html
        - https://github.com/expressjs/multer#diskstorage
    pattern-either:
      # multer.diskStorage({ filename: (req, file, cb) => cb(null, Date.now() + "-" + file.originalname) })
      - patterns:
          - pattern-inside: multer.diskStorage({...})
          - pattern: '$CB(null, <... $FILE.originalname ...>)'
          - pattern-not: '$CB(null, <... path.parse($FILE.originalname).name ...>)'
      # express-fileupload: file.mv(dir + file.name)
      - patterns:
          - pattern: '$FILE.mv(<... $FILE.name ...>, ...)'

  - id: codewatch.js.mass-assignment
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      The whole request body is written to a model, so a client can also set fields the form never offers
      (isAdmin, role, ownerId, price). Pick the fields this route should change, or validate the body against a
      schema that strips unknown keys.
    # For review: fine if the model has no field a client mustn't set, or validation middleware strips them.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: Whole request body assigned to a model
      cwe: ["CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes"]
      owasp: ["A08:2025 - Software or Data Integrity Failures"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Mass_Assignment_Cheat_Sheet.html
    patterns:
      # The body itself, spread into an object, or a variable holding it.
      - pattern-either:
          - patterns:
              - pattern-either: &js-model-writes
                  - patterns:
                      - pattern-either:
                          - pattern: $MODEL.create($BODY, ...)
                          - pattern: $MODEL.insertMany($BODY, ...)
                          - pattern: $MODEL.build($BODY, ...)
                          - pattern: $MODEL.update($BODY, ...)
                          - pattern: $MODEL.findByIdAndUpdate($ID, $BODY, ...)
                          - pattern: $MODEL.findOneAndUpdate($FILTER, $BODY, ...)
                          - pattern: $MODEL.updateOne($FILTER, $BODY, ...)
                          - pattern: $MODEL.updateMany($FILTER, $BODY, ...)
                          - pattern: new $MODEL($BODY)
                      - metavariable-regex: {metavariable: $MODEL, regex: '^[A-Z]\w*$'}
                  - pattern: $REPO.save($BODY)
                  - pattern: '$PRISMA.$TABLE.create({..., data: $BODY, ...})'
                  - pattern: '$PRISMA.$TABLE.update({..., data: $BODY, ...})'
                  - pattern: '$PRISMA.$TABLE.upsert({..., update: $BODY, ...})'
                  - pattern: Object.assign($TARGET, $BODY)
                  - pattern: $DOC.set($BODY)
              - metavariable-regex: &js-whole-body
                  metavariable: $BODY
                  regex: '^((req|request|ctx\.request)\.body|\{[\s\S]*\.\.\.\s*(req|request|ctx\.request)\.body\s*(,[\s\S]*)?\})$'
          - patterns:
              - pattern-either: *js-model-writes
              - pattern-either:
                  - pattern-inside: |
                      const $BODY = $WHOLE;
                      ...
                  - pattern-inside: |
                      let $BODY = $WHOLE;
                      ...
                  - pattern-inside: |
                      $BODY = $WHOLE;
                      ...
              - metavariable-regex:
                  <<: *js-whole-body
                  metavariable: $WHOLE
      - focus-metavariable: $BODY
