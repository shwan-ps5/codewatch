# codewatch built-in rules for JavaScript/TypeScript web code (Express, Angular, MongoDB).
rules:
  - id: codewatch.js.angular-bypass-sanitizer
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Angular's sanitizer is bypassed for a value that isn't a fixed string, so HTML or script in it reaches the
      page. Let Angular sanitize it (bind to [innerHTML] without bypassing), or only bypass for constants.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Angular sanitizer bypassed for dynamic data
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://angular.dev/best-practices/security#bypass-security-apis-sparingly
        - https://angular.dev/api/platform-browser/DomSanitizer
    patterns:
      - pattern: $SANITIZER.$BYPASS($VALUE)
      - metavariable-regex: {metavariable: $BYPASS, regex: '^bypassSecurityTrust(Html|Script|Style|Url|ResourceUrl)$'}
      - pattern-not: $SANITIZER.$BYPASS("...")
      - pattern-not: $SANITIZER.$BYPASS(`...`)

  - id: codewatch.js.substring-url-allowlist
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      A URL is checked against an allowlist with a substring test, so "https://evil.example/?https://good.example"
      passes. Parse the URL (new URL(value)) and compare its origin or hostname exactly.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: URL allowlist checked with a substring test
      cwe: ["CWE-20: Improper Input Validation", "CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"]
      owasp: ["A01:2025 - Broken Access Control"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
        - https://developer.mozilla.org/en-US/docs/Web/API/URL
    patterns:
      - pattern-either:
          - pattern: $URL.includes($ALLOWED)
          - pattern: $URL.indexOf($ALLOWED) !== -1
          - pattern: $URL.indexOf($ALLOWED) > -1
          - pattern: $URL.indexOf($ALLOWED) >= 0
      - metavariable-regex: {metavariable: $URL, regex: '(?i).*(url|uri|redirect|href|location|target|returnto|next)'}
      - metavariable-regex: {metavariable: $ALLOWED, regex: '(?i).*(allow|white|trusted|safe|permitted)'}

  - id: codewatch.js.nosql-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A value from the request body is placed directly in a MongoDB query. A JSON body can send an object such as
      {"$ne": null} instead of a string and change what the query matches. Convert it to the expected type
      (String(), Number()) or validate it first.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request body used in a MongoDB query
      cwe: ["CWE-943: Improper Neutralization of Special Elements in Data Query Logic"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Injection_Prevention_Cheat_Sheet.html
        - https://www.mongodb.com/docs/manual/core/server-side-javascript/
    pattern-sources:
      - pattern: $REQ.body
      - pattern: $REQ.query
    pattern-sanitizers:
      - pattern: String(...)
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: $X.toString()
    pattern-sinks:
      # $where runs as JavaScript on the database server, so request data in it is code, whatever its type.
      - patterns:
          - pattern-either:
              - pattern: '{..., $where: $QUERY, ...}'
              - pattern: '{..., "$where": $QUERY, ...}'
              - pattern: $MODEL.$where($QUERY)
          - focus-metavariable: $QUERY
      - patterns:
          - pattern: $COLL.$METHOD($QUERY, ...)
          - metavariable-regex: {metavariable: $COLL, regex: '(?i).*(collection|mongo)'}
          - metavariable-regex:
              metavariable: $METHOD
              regex: '^(find|findOne|update|updateOne|updateMany|remove|deleteOne|deleteMany|count|countDocuments|findOneAndUpdate|findOneAndDelete|findOneAndReplace|replaceOne)$'
          - focus-metavariable: $QUERY

  - id: codewatch.js.unauthenticated-metrics
    languages: [typescript, javascript]
    severity: INFO
    message: >-
      The metrics endpoint is served with no middleware in front of it, so anyone can read internal counters,
      paths and versions. Put it behind authentication or serve it on an internal-only port.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: Metrics endpoint without authentication
      cwe: ["CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"]
      owasp: ["A02:2025 - Security Misconfiguration"]
      references:
        - https://prometheus.io/docs/operating/security/
    pattern-either:
      - pattern: $APP.get("/metrics", $HANDLER)
      - pattern: $APP.use("/metrics", $HANDLER)

  - id: codewatch.js.weak-hash
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      MD4, MD5 and SHA-1 are broken for security use. Use SHA-256 or better, or a password hash
      (scrypt, argon2, bcrypt) for passwords.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Weak hash algorithm
      security-purpose: required
      cwe: ["CWE-328: Use of Weak Hash"]
      owasp: ["A04:2025 - Cryptographic Failures"]
      references:
        - https://nodejs.org/api/crypto.html#cryptocreatehashalgorithm-options
        - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
    pattern: $CRYPTO.createHash("=~/(?i)^(md4|md5|sha1|sha-1|ripemd160)$/", ...)

  - id: codewatch.js.directory-listing
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Directory listing is switched on for this path, so anyone can browse every file in the folder, including
      ones nobody linked to (backups, logs, keys). Serve the files that are meant to be public by name instead.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Directory listing enabled
      cwe: ["CWE-548: Exposure of Information Through Directory Listing"]
      owasp: ["A02:2025 - Security Misconfiguration"]
      references:
        - https://github.com/expressjs/serve-index#readme
    pattern-either:
      - pattern: $APP.use(..., serveIndex(...), ...)
      - pattern: $APP.use(..., $MOD.serveIndex(...), ...)

  - id: codewatch.js.template-autoescape-disabled
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      HTML escaping is switched off for every template this engine renders, so any request data a template prints
      becomes markup and script (XSS). Leave autoescape on and mark the few trusted fragments safe one by one.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Template auto-escaping disabled
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://mozilla.github.io/nunjucks/api.html#configure
        - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
    pattern-either:
      - pattern: '$SWIG.setDefaults({..., autoescape: false, ...})'
      - pattern: '$NUNJUCKS.configure(..., {..., autoescape: false, ...})'
      - pattern: '$NUNJUCKS.configure({..., autoescape: false, ...})'
      - pattern: 'new $ENV(..., {..., autoescape: false, ...})'
      - pattern: '$HANDLEBARS.compile($TEMPLATE, {..., noEscape: true, ...})'

  - id: codewatch.js.unrestricted-upload
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      An uploaded file is stored under the name the client sent, extension included. An .html, .svg or script
      file served back from this site runs as part of it. Check the extension and type against an allowlist
      (multer's fileFilter), or store the file under a generated name with an extension you choose.
    # For review: harmless if the folder is never served; multer and busboy already drop any directory part.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: Upload stored under the client's file name
      cwe: ["CWE-434: Unrestricted Upload of File with Dangerous Type"]
      owasp: ["A06:2025 - Insecure Design"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html
        - https://github.com/expressjs/multer#diskstorage
    pattern-either:
      # multer.diskStorage({ filename: (req, file, cb) => cb(null, Date.now() + "-" + file.originalname) })
      - patterns:
          - pattern-inside: multer.diskStorage({...})
          - pattern: '$CB(null, <... $FILE.originalname ...>)'
          - pattern-not: '$CB(null, <... path.parse($FILE.originalname).name ...>)'
          # The same options check the type: { fileFilter, storage: diskStorage({ filename }) }
          - pattern-not-inside: '$FN({..., fileFilter: $FILTER, ...})'
          - pattern-not-inside: '({..., fileFilter: $FILTER, ...})'
          - pattern-not-inside: '$FN({..., fileFilter: (...) => $BODY, ...})'
          - pattern-not-inside: '({..., fileFilter: (...) => $BODY, ...})'
          - pattern-not-inside: '$FN({..., fileFilter: function (...) { ... }, ...})'
          - pattern-not-inside: '({..., fileFilter: function (...) { ... }, ...})'
          - pattern-not-inside: '$FN({..., fileFilter, ...})'
          - pattern-not-inside: '({..., fileFilter, ...})'
          - pattern-not-inside: '$FN({..., fileFilter(...) { ... }, ...})'
          - pattern-not-inside: '({..., fileFilter(...) { ... }, ...})'
      # express-fileupload: file.mv(dir + file.name)
      - patterns:
          - pattern: '$FILE.mv(<... $FILE.name ...>, ...)'

  - id: codewatch.js.mass-assignment
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      The whole request body is written to a model, so a client can also set fields the form never offers
      (isAdmin, role, ownerId, price). Pick the fields this route should change, or validate the body against a
      schema that strips unknown keys.
    # For review: fine if the model has no field a client mustn't set, or validation middleware strips them.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: Whole request body assigned to a model
      cwe: ["CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes"]
      owasp: ["A08:2025 - Software or Data Integrity Failures"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Mass_Assignment_Cheat_Sheet.html
    patterns:
      # The body itself, spread into an object, or a variable holding it.
      - pattern-either:
          - patterns:
              - pattern-either: &js-model-writes
                  - patterns:
                      - pattern-either:
                          - pattern: $MODEL.create($BODY, ...)
                          - pattern: $MODEL.insertMany($BODY, ...)
                          - pattern: $MODEL.build($BODY, ...)
                          - pattern: $MODEL.update($BODY, ...)
                          - pattern: $MODEL.findByIdAndUpdate($ID, $BODY, ...)
                          - pattern: $MODEL.findOneAndUpdate($FILTER, $BODY, ...)
                          - pattern: $MODEL.updateOne($FILTER, $BODY, ...)
                          - pattern: $MODEL.updateMany($FILTER, $BODY, ...)
                          - pattern: new $MODEL($BODY)
                      - metavariable-regex: {metavariable: $MODEL, regex: '^[A-Z]\w*$'}
                  - pattern: $REPO.save($BODY)
                  - pattern: '$PRISMA.$TABLE.create({..., data: $BODY, ...})'
                  - pattern: '$PRISMA.$TABLE.update({..., data: $BODY, ...})'
                  - pattern: '$PRISMA.$TABLE.upsert({..., update: $BODY, ...})'
                  - pattern: Object.assign($TARGET, $BODY)
                  - pattern: $DOC.set($BODY)
              - metavariable-regex: &js-whole-body
                  metavariable: $BODY
                  regex: '^((req|request|ctx\.request)\.body|\{[\s\S]*\.\.\.\s*(req|request|ctx\.request)\.body\s*(,[\s\S]*)?\})$'
          - patterns:
              - pattern-either: *js-model-writes
              - pattern-either:
                  - pattern-inside: |
                      const $BODY = $WHOLE;
                      ...
                  - pattern-inside: |
                      let $BODY = $WHOLE;
                      ...
                  - pattern-inside: |
                      $BODY = $WHOLE;
                      ...
              - metavariable-regex:
                  <<: *js-whole-body
                  metavariable: $WHOLE
      - focus-metavariable: $BODY

  - id: codewatch.js.cors-any-origin-with-credentials
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      CORS echoes back whatever Origin the browser sends and also allows credentials, so any website can make
      logged-in requests to this API and read the answers. List the origins that may call it.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Any origin allowed together with credentials
      cwe: ["CWE-942: Permissive Cross-domain Security Policy with Untrusted Domains"]
      owasp: ["A02:2025 - Security Misconfiguration"]
      references:
        - https://portswigger.net/web-security/cors
        - https://github.com/expressjs/cors#configuration-options
    pattern-either:
      # The cors package: origin: true (or a callback that accepts everything) reflects the request's Origin.
      - patterns:
          - pattern-either:
              - pattern: 'cors({..., origin: true, ...})'
              - pattern: 'cors({..., origin: ($O, $CB) => $CB(null, true), ...})'
              - pattern: 'cors({..., origin: function ($O, $CB) { $CB(null, true); }, ...})'
              - pattern: '$APP.enableCors({..., origin: true, ...})'
          - pattern-either:
              - pattern: 'cors({..., credentials: true, ...})'
              - pattern: '$APP.enableCors({..., credentials: true, ...})'
      # By hand: the request's Origin echoed on a response that also allows credentials.
      - patterns:
          - pattern-either:
              - pattern: |
                  $RES.$SET($ACAO, <... $REQ.headers.origin ...>);
                  ...
                  $RES.$SET2($ACAC, $TRUE);
              - pattern: |
                  $RES.$SET2($ACAC, $TRUE);
                  ...
                  $RES.$SET($ACAO, <... $REQ.headers.origin ...>);
              - pattern: |
                  $RES.$SET($ACAO, <... $REQ.get($ORIGIN) ...>);
                  ...
                  $RES.$SET2($ACAC, $TRUE);
              - pattern: |
                  $RES.$SET2($ACAC, $TRUE);
                  ...
                  $RES.$SET($ACAO, <... $REQ.get($ORIGIN) ...>);
              - pattern: |
                  $RES.$SET($ACAO, <... $REQ.header($ORIGIN) ...>);
                  ...
                  $RES.$SET2($ACAC, $TRUE);
              - pattern: |
                  $RES.$SET2($ACAC, $TRUE);
                  ...
                  $RES.$SET($ACAO, <... $REQ.header($ORIGIN) ...>);
          # An allowlist check around it means only listed origins are echoed.
          - pattern-not-inside: 'if ($COND) { ... }'
          - pattern-not-inside: '$COND ? $A : $B'
          - metavariable-regex: {metavariable: $SET, regex: '^(setHeader|header|set|append)$'}
          - metavariable-regex: {metavariable: $SET2, regex: '^(setHeader|header|set|append)$'}
          - metavariable-regex: {metavariable: $ACAO, regex: '(?i)^[''"`]access-control-allow-origin[''"`]$'}
          - metavariable-regex: {metavariable: $ACAC, regex: '(?i)^[''"`]access-control-allow-credentials[''"`]$'}
          - metavariable-regex: {metavariable: $TRUE, regex: '^([''"`]true[''"`]|true)$'}

  - id: codewatch.js.timing-unsafe-signature-check
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      An HMAC or signature is compared with === or ==, which stops at the first differing character: by timing
      responses an attacker can guess a valid signature byte by byte. Compare with crypto.timingSafeEqual().
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Signature compared in variable time
      cwe: ["CWE-208: Observable Timing Discrepancy"]
      owasp: ["A04:2025 - Cryptographic Failures"]
      references:
        - https://nodejs.org/api/crypto.html#cryptotimingsafeequala-b
    pattern-either:
      - pattern: <... $C.createHmac(...) ...> === $B
      - pattern: $A === <... $C.createHmac(...) ...>
      - pattern: <... $C.createHmac(...) ...> !== $B
      - pattern: $A !== <... $C.createHmac(...) ...>
      - pattern: <... $C.createHmac(...) ...> == $B
      - pattern: $A == <... $C.createHmac(...) ...>
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $MAC = <... $C.createHmac(...) ...>;
                  ...
              - pattern-inside: |
                  let $MAC = <... $C.createHmac(...) ...>;
                  ...
          - pattern-either:
              - pattern: $MAC === $B
              - pattern: $A === $MAC
              - pattern: $MAC !== $B
              - pattern: $A !== $MAC
              - pattern: $MAC == $B
              - pattern: $A == $MAC

  - id: codewatch.js.cookie-without-secure
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      This cookie can be sent over plain HTTP, where it can be intercepted. Set secure: true (and httpOnly:
      true unless JavaScript needs it).
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Cookie without the Secure flag
      cwe: ["CWE-614: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute"]
      owasp: ["A02:2025 - Security Misconfiguration"]
      references:
        - https://expressjs.com/en/api.html#res.cookie
    patterns:
      - pattern-either:
          - pattern: $RES.cookie($NAME, $VALUE)
          - pattern: '$RES.cookie($NAME, $VALUE, {...})'
          - pattern: '$RES.cookie($NAME, $VALUE, {..., secure: false, ...})'
      - pattern-not: '$RES.cookie($NAME, $VALUE, {..., secure: $SET, ...})'
      - metavariable-regex: {metavariable: $RES, regex: '^(res|response|reply|ctx\.cookies)$'}
      # Only cookies that carry a credential: a theme or locale cookie isn't worth intercepting.
      - metavariable-regex:
          metavariable: $NAME
          regex: '(?i).*(sess|sid|token|auth|jwt|remember|login|csrf|xsrf|refresh|access)'
      # Clearing a cookie sends nothing worth intercepting.
      - pattern-not: $RES.cookie($NAME, "", ...)
      - pattern-not: '$RES.cookie($NAME, $VALUE, {..., maxAge: 0, ...})'
      - pattern-not: '$RES.cookie($NAME, $VALUE, {..., expires: new Date(0), ...})'

  - id: codewatch.js.session-cookie-flags
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      The session cookie's protection is switched off here: without httpOnly any injected script can read the
      session, without secure it travels over plain HTTP, and sameSite "none" sends it on cross-site requests.
      Keep httpOnly: true, secure: true (behind a proxy, also set "trust proxy") and sameSite "lax" or "strict".
    # For review: secure: false is common in development configs.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: Session cookie protection switched off
      cwe: ["CWE-1004: Sensitive Cookie Without 'HttpOnly' Flag", "CWE-614: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute", "CWE-1275: Sensitive Cookie with Improper SameSite Attribute"]
      owasp: ["A07:2025 - Authentication Failures"]
      references:
        - https://github.com/expressjs/session#cookie
    pattern-either:
      - pattern: 'session({..., cookie: {..., httpOnly: false, ...}, ...})'
      - pattern: 'session({..., cookie: {..., secure: false, ...}, ...})'
      - pattern: 'session({..., cookie: {..., sameSite: "none", ...}, ...})'
      - pattern: 'cookieSession({..., httpOnly: false, ...})'
      - pattern: 'cookieSession({..., secure: false, ...})'
      - pattern: '$RES.cookie($NAME, $VALUE, {..., httpOnly: false, ...})'
      - pattern: '$RES.cookie($NAME, $VALUE, {..., sameSite: "none", ...})'

  - id: codewatch.js.secret-in-log
    languages: [typescript, javascript]
    severity: INFO
    message: >-
      A password, token or secret is written to the log, where it is kept and read by more people and systems
      than the secret itself. Log that it was present, not its value.
    # For review: the name suggests a secret, but it might be a token's ID or a password-policy setting.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: Secret written to the log
      cwe: ["CWE-532: Insertion of Sensitive Information into Log File"]
      owasp: ["A09:2025 - Security Logging and Alerting Failures"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html#data-to-exclude
    patterns:
      - pattern-either:
          - pattern: console.$LEVEL(..., $SECRET, ...)
          - pattern: 'console.$LEVEL(..., `...${$SECRET}...`, ...)'
          - patterns:
              - pattern-either:
                  - pattern: $LOGGER.$LEVEL(..., $SECRET, ...)
                  - pattern: '$LOGGER.$LEVEL(..., `...${$SECRET}...`, ...)'
              - metavariable-regex: {metavariable: $LOGGER, regex: '(?i)^(this\.)?(log|logger|winston|pino|bunyan)$'}
      - metavariable-regex: {metavariable: $LEVEL, regex: '^(log|info|warn|error|debug|trace|fatal)$'}
      - metavariable-regex:
          metavariable: $SECRET
          regex: '(?i)^([\w$]+\.)*[\w$]*(password|passwd|secret|token|api_?key|authorization|credentials?|private_?key)$'

  - id: codewatch.js.route-without-auth
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      This route changes data but has no authentication middleware, while other routes in the same file do.
      Check that anonymous users may really call it; if not, add the same middleware here.
    # For review: some routes are meant to be public; one missing middleware in a protected router often isn't.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: Changing route without the authentication other routes use
      cwe: ["CWE-306: Missing Authentication for Critical Function"]
      owasp: ["A07:2025 - Authentication Failures"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
    patterns:
      - pattern-either:
          - pattern: $APP.$METHOD($PATH, $HANDLER)
          - patterns:
              - pattern: $APP.$METHOD($PATH, $MW1, $HANDLER)
              - metavariable-regex: {metavariable: $MW1, regex: '^(?!(?i:.*(auth|login|logged|protect|guard|session|passport|jwt|token|permission|role|admin|require|verify|ensure|isuser|currentuser))).*$'}
          - patterns:
              - pattern: $APP.$METHOD($PATH, $MW1, $MW2, $HANDLER)
              - metavariable-regex: {metavariable: $MW1, regex: '^(?!(?i:.*(auth|login|logged|protect|guard|session|passport|jwt|token|permission|role|admin|require|verify|ensure|isuser|currentuser))).*$'}
              - metavariable-regex: {metavariable: $MW2, regex: '^(?!(?i:.*(auth|login|logged|protect|guard|session|passport|jwt|token|permission|role|admin|require|verify|ensure|isuser|currentuser))).*$'}
      - metavariable-regex: {metavariable: $METHOD, regex: '^(post|put|patch|delete)$'}
      - metavariable-regex: {metavariable: $APP, regex: '(?i)^(app|router|\w*router|api|server)$'}
      - metavariable-regex: {metavariable: $PATH, regex: '^[''"`]/'}
      # Routes that are public by nature, and sign-up as POST to the users collection.
      - pattern-not: $APP.post("=~/^\/(api\/)?(v\d+\/)?(users?|accounts?|members?)\/?$/", ...)
      - pattern-not: $APP.$METHOD("=~/(?i).*(login|logout|register|signup|sign-up|sign_up|signin|sign-in|forgot|reset|verify|confirm|activate|token|refresh|oauth|callback|webhook|public|health|status|contact|subscribe|newsletter)/", ...)
      # Another route in this file names an authentication middleware first.
      - pattern-either:
          - pattern-inside: |
              $APP.$OTHER($OTHERPATH, $AUTH, ...);
              ...
          - pattern-inside: |
              $APP.$METHOD($PATH, ...);
              ...
              $APP.$OTHER($OTHERPATH, $AUTH, ...);
      - metavariable-regex: {metavariable: $AUTH, regex: '(?i).*(auth|login|logged|protect|guard|session|passport|jwt|token|permission|role|admin|require|verify|ensure|isUser|currentUser)'}
      - metavariable-regex: {metavariable: $OTHER, regex: '^(get|post|put|patch|delete|all)$'}

  - id: codewatch.js.upload-without-limits
    languages: [typescript, javascript]
    severity: INFO
    message: >-
      multer is set up without limits, so a client can send files of any size and number until the disk or
      memory runs out. Set limits: { fileSize, files }.
    # For review: a proxy in front may already cap the request size.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: File uploads without a size limit
      cwe: ["CWE-770: Allocation of Resources Without Limits or Throttling"]
      owasp: ["A06:2025 - Insecure Design"]
      references:
        - https://github.com/expressjs/multer#limits
    patterns:
      - pattern-either:
          - pattern: multer()
          - pattern: 'multer({...})'
      - pattern-not: 'multer({..., limits: $LIMITS, ...})'

