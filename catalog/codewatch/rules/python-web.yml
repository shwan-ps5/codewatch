# codewatch built-in rules for Python web code (Flask, Django, FastAPI, Starlette).
# Taint rules report a vulnerability only when data from the HTTP request reaches a dangerous call, so plain use
# of an API is left to the hotspot rules. Shared pieces are YAML anchors.
rules:
  - id: codewatch.python.web.command-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request reaches a shell or process command, so a user can run their own commands.
      Pass arguments as a list without a shell, validate them against an allowlist, or quote with shlex.quote().
    metadata: &meta-command
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data used in an OS command
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
        - https://docs.python.org/3/library/subprocess.html#security-considerations
    pattern-sources: &web-sources
      - pattern: flask.request
      # A view's request, not a local such as `request = urllib.request.Request(url)`.
      - patterns:
          - pattern: request
          - pattern-not-inside: |
              request = $MAKE(...)
              ...
      - pattern: starlette.requests.Request
      # The request passed on to a helper under a short name: pgAdmin's file manager, add(self, req) reading
      # req.form.get('currentpath') (GHSA-cr8c-972v-rmp3). Only the parts a Flask/Werkzeug request has and an
      # HTTP client's response doesn't (`req = requests.get(url); req.json()` is the server's reply).
      - patterns:
          - pattern-either:
              - pattern: req.form
              - pattern: req.args
              - pattern: req.values
              - pattern: req.files
              - pattern: req.get_json(...)
          - pattern-not-inside: |
              req = $MAKE(...)
              ...
      # Class-based views (Django, DRF, Tornado) keep the request on self, and Django's the URL captures in
      # self.kwargs/self.args.
      - patterns:
          - pattern: self.request
          - pattern-not-inside: |
              self.request = $MAKE(...)
              ...
      - patterns:
          - pattern-inside: |
              class $VIEW(..., $BASE, ...):
                ...
          - metavariable-regex: {metavariable: $BASE, regex: '(View|ViewSet)$'}
          - pattern-either:
              - pattern: self.kwargs
              - pattern: self.args
      # A route function's parameters come from the URL path or, in FastAPI, the query string, form or headers:
      # @app.route("/user/<name>") def user(name). Typed ones count only as text (str, Optional[str], list[str]);
      # numbers, UUIDs, models and Depends() don't. Flask converters (<int:id>) are written on the scanned copy
      # as annotations (route_converters.py). The parameter itself is the source (focus-metavariable), not each use of
      # its name, so `name = secure_filename(name)` replaces it (changedetection.io GHSA-9jj8-v89v-xjvw).
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$ROUTE($PATH, ...)
                  def $VIEW(..., $PARAM: $TYPE, ...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE($PATH, ...)
                  async def $VIEW(..., $PARAM: $TYPE, ...):
                    ...
          - metavariable-regex:
              metavariable: $TYPE
              regex: '^((typing\.)?(Optional|List|Annotated)\[str\b.*|(list|set)\[str\]|str( \| None)?|Any)$'
          - metavariable-regex: {metavariable: $ROUTE, regex: '^(route|get|post|put|patch|delete|api_route)$'}
          - metavariable-regex: {metavariable: $PATH, regex: '^[rbuf]*[''"]/'}
          - focus-metavariable: $PARAM
      # An MCP server's tool arguments (FastMCP, mcp.server.fastmcp: @mcp.tool / @mcp.tool()): the model chooses
      # them, and whatever text it reads can steer it, so they're as untrusted as a request's. Text-typed only, as
      # for routes. Vibe-Trading GHSA-mjrq-xg2m-qg94 (a run id joined into a path).
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$MCP.tool
                  def $TOOL(..., $PARAM: $TYPE, ...):
                    ...
              - pattern-inside: |
                  @$MCP.tool
                  async def $TOOL(..., $PARAM: $TYPE, ...):
                    ...
              - pattern-inside: |
                  @$MCP.tool(...)
                  def $TOOL(..., $PARAM: $TYPE, ...):
                    ...
              - pattern-inside: |
                  @$MCP.tool(...)
                  async def $TOOL(..., $PARAM: $TYPE, ...):
                    ...
              - pattern-inside: |
                  @$MCP.tool
                  def $TOOL(..., $PARAM: $TYPE = $DEFAULT, ...):
                    ...
              - pattern-inside: |
                  @$MCP.tool
                  async def $TOOL(..., $PARAM: $TYPE = $DEFAULT, ...):
                    ...
              - pattern-inside: |
                  @$MCP.tool(...)
                  def $TOOL(..., $PARAM: $TYPE = $DEFAULT, ...):
                    ...
              - pattern-inside: |
                  @$MCP.tool(...)
                  async def $TOOL(..., $PARAM: $TYPE = $DEFAULT, ...):
                    ...
          - metavariable-regex:
              metavariable: $TYPE
              regex: '^((typing\.)?(Optional|List|Annotated)\[str\b.*|(list|set)\[str\]|str( \| None)?|Any)$'
          - focus-metavariable: $PARAM
      # An agent tool class's arguments, which the model fills in from a JSON schema, as for MCP tools above: the
      # method an agent framework calls (LangChain/CrewAI `_run`, smolagents `forward`, a project's own
      # `execute(self, **kwargs)`) in a class based on a *Tool class that describes itself to the model
      # (`description`, `args_schema` or a `parameters` schema). Vibe-Trading GHSA-3j25 (RememberTool.execute's
      # memory_type joined into a file path). Not numeric-typed parameters.
      - patterns:
          - pattern-inside: |
              class $CLS(..., $BASE, ...):
                ...
          - pattern-either:
              - pattern-inside: |
                  class $CLS(...):
                    ...
                    $DESC = ...
                    ...
              - pattern-inside: |
                  class $CLS(...):
                    ...
                    $DESC: $DTYPE = ...
                    ...
          - metavariable-regex: {metavariable: $BASE, regex: '^(\w+\.)*\w*Tool$'}
          - metavariable-regex: {metavariable: $DESC, regex: '^(description|args_schema|parameters)$'}
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      def $RUN(self, ..., **$KW):
                        ...
                  - pattern: $KW
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          def $RUN(self, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          async def $RUN(self, ..., $PARAM, ...):
                            ...
                  - pattern-not-inside: |
                      def $RUN(..., $PARAM: int, ...):
                        ...
                  - pattern-not-inside: |
                      def $RUN(..., $PARAM: int = $DEFAULT, ...):
                        ...
                  - pattern-not-inside: |
                      def $RUN(..., $PARAM: float, ...):
                        ...
                  - pattern-not-inside: |
                      def $RUN(..., $PARAM: float = $DEFAULT, ...):
                        ...
                  - pattern-not-inside: |
                      def $RUN(..., $PARAM: bool, ...):
                        ...
                  - pattern-not-inside: |
                      def $RUN(..., $PARAM: bool = $DEFAULT, ...):
                        ...
                  - focus-metavariable: $PARAM
          - metavariable-regex: {metavariable: $RUN, regex: '^(execute|run|_run|_arun|arun|forward|invoke|ainvoke|__call__)$'}
      # Django REST framework serializers: the request body after DRF's field checks, as `validated_data` in
      # create()/update(), `attrs` in validate(), a field's value in validate_<field>(), and .validated_data or
      # .initial_data on a serializer (firefighter GHSA-fqvv: create(self, validated_data) passes
      # validated_data["attachments"] to the Jira client, which fetches each URL). A field with its own
      # validate_<field> method is cleared by the project's serializer checks (drf_serializers.py).
      - patterns:
          - pattern-inside: |
              class $SER(..., $SBASE, ...):
                ...
          - metavariable-regex: {metavariable: $SBASE, regex: '^(\w+\.)*\w*Serializer(\[.*\])?$'}
          - pattern-either:
              - pattern-inside: |
                  def create(self, $PARAM, ...):
                    ...
              - pattern-inside: |
                  def update(self, $INSTANCE, $PARAM, ...):
                    ...
              - pattern-inside: |
                  def validate(self, $PARAM, ...):
                    ...
              - patterns:
                  - pattern-inside: |
                      def $FIELD_CHECK(self, $PARAM, ...):
                        ...
                  - metavariable-regex: {metavariable: $FIELD_CHECK, regex: '^validate_\w+$'}
          - focus-metavariable: $PARAM
      - pattern: $SERIALIZER.validated_data
      - pattern: $SERIALIZER.initial_data
      # A FastAPI route's uploaded files: the name the client sent (file: UploadFile, files: List[UploadFile]),
      # not the file object, whose contents aren't a path or markup. libre-chat GHSA-3864-rp2m-2qfj, LightRAG
      # GHSA-v9w6-9hq9-33ch (both: open(os.path.join(folder, file.filename), "wb")).
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$ROUTE($PATH, ...)
                  def $VIEW(..., $PARAM: $TYPE, ...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE($PATH, ...)
                  async def $VIEW(..., $PARAM: $TYPE, ...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE($PATH, ...)
                  def $VIEW(..., $PARAM: $TYPE = $DEFAULT, ...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE($PATH, ...)
                  async def $VIEW(..., $PARAM: $TYPE = $DEFAULT, ...):
                    ...
          - metavariable-regex:
              metavariable: $TYPE
              regex: '^((typing\.)?(Optional|List)\[|(list|set)\[)?(fastapi\.)?UploadFile\]?( \| None)?$'
          - metavariable-regex: {metavariable: $ROUTE, regex: '^(route|get|post|put|patch|delete|api_route)$'}
          - metavariable-regex: {metavariable: $PATH, regex: '^[rbuf]*[''"]/'}
          - pattern-either:
              - pattern: $PARAM.filename
              - patterns:
                  - pattern-inside: |
                      for $F in $PARAM:
                        ...
                  - pattern: $F.filename
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$ROUTE($PATH, ...)
                  def $VIEW(..., $PARAM, ...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE($PATH, ...)
                  async def $VIEW(..., $PARAM, ...):
                    ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: $TYPE, ...):
                ...
          - pattern-not-inside: |
              async def $VIEW(..., $PARAM: $TYPE, ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM=Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM=fastapi.Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM=Security(...), ...):
                ...
          - pattern-not-inside: |
              async def $VIEW(..., $PARAM=Depends(...), ...):
                ...
          - pattern-not-inside: |
              async def $VIEW(..., $PARAM=fastapi.Depends(...), ...):
                ...
          - pattern-not-inside: |
              async def $VIEW(..., $PARAM=Security(...), ...):
                ...
          - metavariable-regex: {metavariable: $PARAM, regex: '^(?!(self|cls)$)\w+$'}
          - metavariable-regex: {metavariable: $ROUTE, regex: '^(route|get|post|put|patch|delete|api_route)$'}
          - metavariable-regex: {metavariable: $PATH, regex: '^[rbuf]*[''"]/'}
          - focus-metavariable: $PARAM
      # A Django function view's arguments from its urls.py route, where the converter or regex group passes free
      # text (path("files/<path:name>", serve)); marked on the scanned copy by route_converters.py. CodeRed CMS
      # GHSA-h454-rq3m-89rc.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  def $VIEW($REQUEST, ..., $PARAM: codewatch_url_text, ...):
                    ...
              - pattern-inside: |
                  async def $VIEW($REQUEST, ..., $PARAM: codewatch_url_text, ...):
                    ...
          - focus-metavariable: $PARAM
    pattern-propagators: &propagators
      - {pattern: '$TO.append($FROM)', from: $FROM, to: $TO}
      - {pattern: '$TO.extend($FROM)', from: $FROM, to: $TO}
      - {pattern: '$TO.insert($I, $FROM)', from: $FROM, to: $TO}
      - {pattern: '$TO.add($FROM)', from: $FROM, to: $TO}
      - {pattern: '$TO.update($FROM)', from: $FROM, to: $TO}
      - {pattern: '$TO.set($SECTION, $KEY, $FROM)', from: $FROM, to: $TO}
      - {pattern: '$TO.put($FROM)', from: $FROM, to: $TO}
      - {pattern: '$TO.write($FROM)', from: $FROM, to: $TO}
    # Shared: data counts as validated after an `if` that checks its content and returns or raises.
    pattern-sanitizers:
      - &validated-guard
        pattern-either:
          # A validator that raises, called on its own before the value is used: check_lfi_path(image_url)
          # (LLaMA Factory), validate_path_is_safe(path) (MLflow). Named for what it checks, so an authorization
          # call (check_permission(user, name)) doesn't clear the name.
          - patterns:
              - pattern-inside: |
                  $CHECK(..., $X, ...)
                  ...
              - pattern-not-inside: $CHECK(..., $X, ...)
              - metavariable-regex:
                  metavariable: $CHECK
                  regex: '(?i)^(.*\.)?_?(check|validate|verify|ensure|assert)_?\w{0,30}(path|url|uri|file|filename|safe|ssrf|lfi|traversal|redirect|host)\w{0,30}$'
              - pattern: $X
          # A named check that said no ends the request: `if not is_safe_url(nxt): return redirect("/")`, or
          # `if not url_has_allowed_host_and_scheme(nxt, ...): abort(400)`. The yes-branch form is checked-inside.
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      if not $CHECK(..., $X, ...):
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      if not $CHECK(..., $X, ...):
                        ...
                        raise ...
                      ...
                  - pattern-inside: |
                      if not $CHECK(..., $X, ...):
                        ...
                        flask.abort(...)
                      ...
                  - pattern-inside: |
                      if not $CHECK(..., $X, ...):
                        ...
                        abort(...)
                      ...
                  - pattern-inside: |
                      if not $CHECK(..., url=$X, ...):
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      if not $CHECK(..., url=$X, ...):
                        ...
                        raise ...
                      ...
                  - pattern-inside: |
                      if not $CHECK(..., url=$X, ...):
                        ...
                        flask.abort(...)
                      ...
                  - pattern-inside: |
                      if not $CHECK(..., url=$X, ...):
                        ...
                        abort(...)
                      ...
              # Not in the branch where the check said no: `if not is_safe_url(nxt): return redirect(nxt)`.
              - pattern-not-inside: |
                  if not $CHECK(..., $X, ...):
                    ...
              - pattern-not-inside: |
                  if not $CHECK(..., url=$X, ...):
                    ...
              - metavariable-regex:
                  metavariable: $CHECK
                  regex: '(?i)^(.*\.)?(is_?|check_?)?(safe|valid|allowed|permitted|trusted|whitelisted|allowlisted)\w{0,40}$|^(.*\.)?url_has_allowed_host_and_scheme$'
              - pattern: $X
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      if <... $X.startswith(...) ...>:
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      if <... $X.startswith(...) ...>:
                        ...
                        raise ...
                      ...
                  - pattern-inside: |
                      if <... $X.endswith(...) ...>:
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      if <... $X.endswith(...) ...>:
                        ...
                        raise ...
                      ...
                  - pattern-inside: |
                      if <... $X.isalnum() ...>:
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      if <... $X.isalnum() ...>:
                        ...
                        raise ...
                      ...
                  - pattern-inside: |
                      if <... $X.isdigit() ...>:
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      if <... $X.isdigit() ...>:
                        ...
                        raise ...
                      ...
                  - pattern-inside: |
                      if <... $X.isidentifier() ...>:
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      if <... $X.isidentifier() ...>:
                        ...
                        raise ...
                      ...
                  - pattern-inside: |
                      if <... re.match(..., $X, ...) ...>:
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      if <... re.match(..., $X, ...) ...>:
                        ...
                        raise ...
                      ...
                  - pattern-inside: |
                      if <... re.fullmatch(..., $X, ...) ...>:
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      if <... re.fullmatch(..., $X, ...) ...>:
                        ...
                        raise ...
                      ...
                  - pattern-inside: |
                      if <... $X in $ALLOWED ...>:
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      if <... $X in $ALLOWED ...>:
                        ...
                        raise ...
                      ...
                  - pattern-inside: |
                      if <... $X not in $ALLOWED ...>:
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      if <... $X not in $ALLOWED ...>:
                        ...
                        raise ...
                      ...
                  - pattern-inside: |
                      if <... url_has_allowed_host_and_scheme($X, ...) ...>:
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      if <... url_has_allowed_host_and_scheme(..., url=$X, ...) ...>:
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      if <... url_has_allowed_host_and_scheme($X, ...) ...>:
                        ...
                        raise ...
                      ...
                  - pattern-inside: |
                      if <... url_has_allowed_host_and_scheme(..., url=$X, ...) ...>:
                        ...
                        raise ...
                      ...
                  - pattern-inside: |
                      $URL = urllib.parse.urlparse($X)
                      ...
                      if <... $URL.$PART ...>:
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      $URL = urllib.parse.urlparse($X)
                      ...
                      if <... $URL.$PART ...>:
                        ...
                        raise ...
                      ...
                  - pattern-inside: |
                      try:
                        ...
                        $URL = urllib.parse.urlparse($X)
                        ...
                        if <... $URL.$PART ...>:
                          ...
                          return ...
                        ...
                      except $EXC:
                        ...
                      ...
                  - pattern-inside: |
                      try:
                        ...
                        $URL = urllib.parse.urlparse($X)
                        ...
                        if <... $URL.$PART ...>:
                          ...
                          return ...
                        ...
                      except:
                        ...
                      ...
                  # A compiled pattern, as re.match above: `subdomain_regex = re.compile("^[a-zA-Z-]+$")` then
                  # `if not subdomain_regex.match(subdomain): return Response(...)` (PostHog GHSA-jrwm at its fix).
                  # Only receivers named as a pattern, so a router's or a model's own .match() isn't one.
                  - patterns:
                      - pattern-either:
                          - pattern-inside: |
                              if <... $RE.$MATCH($X, ...) ...>:
                                ...
                                return ...
                              ...
                          - pattern-inside: |
                              if <... $RE.$MATCH($X, ...) ...>:
                                ...
                                raise ...
                              ...
                      - metavariable-regex: {metavariable: $MATCH, regex: ^(match|fullmatch)$}
                      - metavariable-regex: {metavariable: $RE, regex: '(?i)^(.*[._])?(re|rx|regex|regexp|pattern)$'}
                  # A normalised path checked against its base and a separator (pyLoad GHSA-48rp at its fix):
                  # if not os.path.abspath(p).startswith(os.path.abspath(base) + os.sep): return. Not without the
                  # separator: /srv/files_evil starts with /srv/files (xiaomusic's advisory).
                  - pattern-inside: |
                      if <... os.path.abspath($X).startswith($BASE + os.sep) ...>:
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      if <... os.path.abspath($X).startswith($BASE + os.sep) ...>:
                        ...
                        raise ...
                      ...
                  - pattern-inside: |
                      if <... os.path.abspath($X).startswith($BASE + "/") ...>:
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      if <... os.path.abspath($X).startswith($BASE + "/") ...>:
                        ...
                        raise ...
                      ...
                  - pattern-inside: |
                      if <... os.path.realpath($X).startswith($BASE + os.sep) ...>:
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      if <... os.path.realpath($X).startswith($BASE + os.sep) ...>:
                        ...
                        raise ...
                      ...
                  - pattern-inside: |
                      if <... os.path.realpath($X).startswith($BASE + "/") ...>:
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      if <... os.path.realpath($X).startswith($BASE + "/") ...>:
                        ...
                        raise ...
                      ...
                  - pattern-inside: |
                      if <... os.path.normpath($X).startswith($BASE + os.sep) ...>:
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      if <... os.path.normpath($X).startswith($BASE + os.sep) ...>:
                        ...
                        raise ...
                      ...
                  - pattern-inside: |
                      if <... os.path.normpath($X).startswith($BASE + "/") ...>:
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      if <... os.path.normpath($X).startswith($BASE + "/") ...>:
                        ...
                        raise ...
                      ...
                  # A resolved path checked against its base directory: if not str(p).startswith(str(base)): return
                  - pattern-inside: |
                      if <... str($X).startswith(...) ...>:
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      if <... str($X).startswith(...) ...>:
                        ...
                        raise ...
                      ...
                  - pattern-inside: |
                      if <... $X.is_relative_to(...) ...>:
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      if <... $X.is_relative_to(...) ...>:
                        ...
                        raise ...
                      ...
                  # A normalised path compared with its base by commonpath: `if os.path.commonpath([p, base]) != base:
                  # raise` (SQLBot GHSA-fghj-qqgj-7rxf's fix).
                  - pattern-inside: |
                      if <... os.path.commonpath(<... $X ...>) ...>:
                        ...
                        raise ...
                      ...
                  - pattern-inside: |
                      if <... os.path.commonpath(<... $X ...>) ...>:
                        ...
                        return ...
                      ...
                  # The same check as a relative_to() that raises, on a normalised path: pgAdmin GHSA-cr8c-972v-rmp3's
                  # fix, `try: Path(os.path.abspath(os.path.join(base, name))).relative_to(base) except ValueError:
                  # return`. Not the lexical one it replaced (Path(name).relative_to(base) lets "a/../../x" through).
                  - pattern-inside: |
                      try:
                        ...
                        pathlib.Path(<... os.path.abspath(<... $X ...>) ...>).relative_to(...)
                        ...
                      except ValueError:
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      try:
                        ...
                        pathlib.Path(<... os.path.realpath(<... $X ...>) ...>).relative_to(...)
                        ...
                      except ValueError:
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      try:
                        ...
                        pathlib.Path(..., <... $X ...>, ...).resolve().relative_to(...)
                        ...
                      except ValueError:
                        ...
                        return ...
                      ...
                  # A failed check that replaces the value: if urlsplit(next).netloc != "": next = url_for("index")
                  - pattern-inside: |
                      if <... urllib.parse.urlsplit($X).$PART ...>:
                        ...
                        $X = $SAFE
                      ...
                  - pattern-inside: |
                      if <... urllib.parse.urlparse($X).$PART ...>:
                        ...
                        $X = $SAFE
                      ...
                  # ...or a named check that said no replaces it: `if nxt is None or not _is_safe_redirect_url(nxt):
                  # nxt = url_for("index")` (pgAdmin GHSA-7r93-vp6c-cw5m's fix). Not when an `and` can skip the check.
                  - patterns:
                      - pattern-inside: |
                          if <... not $CHECK(..., $X, ...) ...>:
                            ...
                            $X = $SAFE
                          ...
                      - pattern-not-inside: |
                          if $A and <... not $CHECK(..., $X, ...) ...>:
                            ...
                          ...
                      - pattern-not-inside: |
                          if <... not $CHECK(..., $X, ...) ...> and $B:
                            ...
                          ...
                      - pattern-not-inside: |
                          if <... not $CHECK(..., $X, ...) ...>:
                            ...
                      - metavariable-regex:
                          metavariable: $CHECK
                          regex: '(?i)^(.*\.)?_?(is_?|check_?)?(safe|valid|allowed|permitted|trusted|whitelisted|allowlisted)\w{0,40}$'
                  # ...or used only inside the branch where an allowlist check passed.
                  - pattern-inside: |
                      if <... url_has_allowed_host_and_scheme($X, ...) ...>:
                        ...
                  - pattern-inside: |
                      if <... url_has_allowed_host_and_scheme(..., url=$X, ...) ...>:
                        ...
                  # A forbidden-character check that bails out: if "'" in name: return ... Only for a few punctuation
                  # characters or a control escape: `if 'http' in q: return redirect(q)` routes the value, it doesn't
                  # check it (Whoogle GHSA-mxvc: the else branch put q in an error page printed |safe).
                  - patterns:
                      - pattern-either:
                          - pattern-inside: |
                              if <... $CHAR in $X ...>:
                                ...
                                return ...
                              ...
                          - pattern-inside: |
                              if <... $CHAR in $X ...>:
                                ...
                                raise ...
                              ...
                      - metavariable-regex:
                          metavariable: $CHAR
                          regex: '^[rbu]*(''|")([^A-Za-z0-9\s]{1,3}|\\[nrt0]|\\x00)\1$'
                  - pattern-inside: |
                      if <... $X in $ALLOWED ...>:
                        ...
              - pattern: $X
              # Never the request's own mappings: `if not ("hitId" in request.args): raise` checks that a key is
              # there and says nothing about the values (psiturk GHSA-9mq4-9556-6qxq lost every finding below it).
              - metavariable-regex:
                  metavariable: $X
                  regex: '^(?!((flask\.)?request|self\.request|req)\.(args|form|values|GET|POST|files|FILES|cookies|COOKIES|headers|META|data|query_params|json)$)'
          - patterns:
              - pattern-either:
                  # A value that must equal a known one, or the request ends: if path != s.mac + ".png": abort(404)
                  # (CTFd share.py). Only a plain comparison: `if x != y and z: return` lets x through when z is false.
                  - pattern-inside: |
                      if $X != $EXPECTED:
                        ...
                        return ...
                      ...
                  - pattern-inside: |
                      if $X != $EXPECTED:
                        ...
                        raise ...
                      ...
                  - pattern-inside: |
                      if $X != $EXPECTED:
                        ...
                        abort(...)
                      ...
                  - pattern-inside: |
                      if $X != $EXPECTED:
                        ...
                        flask.abort(...)
                      ...
              - pattern: $X
              # Known to the server: not a bare variable or anything from the request (vulpy:
              # `if password != password_again: return` compares two request values).
              - metavariable-regex:
                  metavariable: $EXPECTED
                  regex: '^(?![a-z_][a-z0-9_]*$)(?!.*\b(request|req|form|args|params|data|query|body|json|POST|GET)\b)'
      # Used only where a check said yes: `if is_safe_url(x): return redirect(x)` (GHSA-6rmf-cv6p-4h27).
      - &checked-inside
        patterns:
          - pattern-either:
              - pattern-inside: |
                  if $CHECK(..., $X, ...):
                    ...
              - pattern-inside: |
                  if $CHECK(..., $X, ...) and $MORE:
                    ...
              - pattern-inside: |
                  if $FIRST and $CHECK(..., $X, ...):
                    ...
          - metavariable-regex:
              metavariable: $CHECK
              regex: '(?i)^(.*\.)?(is_?|check_?)?(safe|valid|allowed|permitted|trusted|whitelisted|allowlisted)\w{0,40}$|^(.*\.)?url_has_allowed_host_and_scheme$'
          - pattern: $X
      # Replaced where a check said no: `if not url_has_allowed_host_and_scheme(next, ...): next = reverse(...)`
      # (wger), so afterwards it is either checked or the replacement.
      - &checked-or-replaced
        patterns:
          - pattern-either:
              - pattern-inside: |
                  if <... not $CHECK(..., $X, ...) ...>:
                    ...
                    $X = $OTHER
                  ...
              - pattern-inside: |
                  if <... not $CHECK(..., url=$X, ...) ...>:
                    ...
                    $X = $OTHER
                  ...
          - metavariable-regex:
              metavariable: $CHECK
              regex: '(?i)^(.*\.)?(is_?|check_?)?(safe|valid|allowed|permitted|trusted|whitelisted|allowlisted)\w{0,40}$|^(.*\.)?url_has_allowed_host_and_scheme$'
          - pattern: $X
      # Shared: functions named as validators (safe_next, validate_url, sanitize_path, clean_*) return checked
      # data, taken at face value since the analysis doesn't look inside them; and request.path in a route with
      # no variable parts, whose value routing has already fixed.
      - &known-safe
        pattern-either:
          - patterns:
              - pattern: $CHECK(...)
              - metavariable-regex: {metavariable: $CHECK, regex: '(?i)(.*\.)?((get_|make_|to_)?safe|valid|saniti[sz]|clean|is_allowed)\w{0,40}$'}
          # Numbers can't carry markup, paths or quotes; url_for() only builds links to this app's own routes.
          - pattern: int(...)
          - pattern: float(...)
          - pattern: bool(...)
          - pattern: len(...)
          - pattern: flask.url_for(...)
          - pattern: url_for(...)
          # Flask-Login's link to the app's own login view, the request's URL only in its `next` parameter
          # (pgAdmin: redirect(login_url("mfa.validate", next_url=next_url))).
          - pattern: flask_login.login_url(...)
          - pattern: flask_login.utils.login_url(...)
          # Django's equivalents: a URL for one of this app's routes, or a model's own page (wger).
          - pattern: django.urls.reverse(...)
          - pattern: reverse(...)
          - pattern: $OBJ.get_absolute_url()
          # An extension or type from Python's own table (".jpg", "image/png"), whatever it was asked about
          # (recipes: mimetypes.guess_extension(content_type) in an uploaded image's file name).
          - pattern: mimetypes.guess_extension(...)
          - pattern: mimetypes.guess_type(...)
          # The signed-in account and a model's metadata are the server's data, not what the client sent (taiga:
          # request.user.id and qs.model._meta.db_table formatted into SQL).
          - pattern: request.user
          - pattern: self.request.user
          - pattern: $MODEL._meta
          - patterns:
              - pattern: request.$PART.get(..., type=$NUMERIC, ...)
              - metavariable-regex: {metavariable: $NUMERIC, regex: ^(int|float|bool)$}
          - patterns:
              - pattern-either:
                  - pattern: flask.request.path
                  - pattern: request.path
              - pattern-inside: |
                  @$APP.route("$ROUTE", ...)
                  def $VIEW(...):
                    ...
              - metavariable-regex: {metavariable: $ROUTE, regex: '^[^<]*$'}
      # A helper that looks something up by the request value returns that thing, not the value: get_clip(clip_id),
      # fetch_order(order_no). Only bare calls (project helpers, not request.get_json()), and not names that say
      # they return request data (get_param, get_json). A helper that does return it is found by the returner pass.
      - &lookup-result
        pattern-either:
          - patterns:
              # The variable it's assigned to, not the call: a sink among the call's arguments still counts.
              - pattern-either:
                  - pattern-inside: |
                      $RESULT = $LOOKUP(...)
                      ...
                  - pattern-inside: |
                      $RESULT, $CREATED = $LOOKUP(...)
                      ...
                  - pattern-inside: |
                      try:
                        ...
                        $RESULT = $LOOKUP(...)
                        ...
                      except $ERR:
                        ...
                      ...
                  - pattern-inside: |
                      try:
                        ...
                        $RESULT = $LOOKUP(...)
                        ...
                      except $ERR as $E:
                        ...
                      ...
              - pattern: $RESULT
              - metavariable-regex:
                  metavariable: $LOOKUP
                  # A method on self counts too (paperless: self._get_effective_file_doc(...)), but not one that
                  # hands back the request's own data (get_serializer, get_form, get_success_url, get_next_url).
                  # So does one on a store or a call that returns one (MLflow GHSA-wc6j-5g83-xfm6 at its fix:
                  # _get_tracking_store().get_run(run_id)), but not on the request.
                  # An ORM query run to its row (Model.objects.filter(...).first(), Users.query.filter_by(...).first(),
                  # manager.only(...).filter(id=x).first()) is the stored row too.
                  regex: '(?s)^((self\.|(?!((flask\.)?request|self\.request|req)\b)[\w.]+(\(\))?\.)?_?(cached_)?(get|fetch|load|find|lookup)_(?!(json|data|params?|args?|query|queries|headers?|cookies?|body|form|forms|fields?|values?|inputs?|text|str|string|url|uri|path|file|filename|name|key|id|var|env|config|setting|content|request|req|payload|serializer|success|redirect|next|return|kwargs)(_|$))\w+|(?!((flask\.)?request|self\.request|req)\.)\w+(\.\w+)*\.(objects\.|query\.|(only|filter|filter_by|exclude|where|select_related|prefetch_related|order_by)\(.*\)\.(first|last|get|one|one_or_none|scalar_one_or_none|first_or_404|get_or_404|get_or_create|update_or_create)$).*)$'
          # Rows a Django query returns, wherever they're used (recipes: `for rule in
          # Automation.objects.filter(space=request.space)...`). The query's own arguments can't be a
          # project function's sink; raw() and extra() take SQL and stay out.
          - patterns:
              - pattern: $MODEL.objects.$QUERY(...)
              - metavariable-regex: {metavariable: $QUERY, regex: '^(?!(raw|extra)$)\w+$'}
          # What an outbound HTTP call returns is the remote server's data, not the request's (taiga's importers:
          # a project id sent to GitHub or Jira, then avatar URLs and attachment names from the reply).
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $RESULT = requests.$HTTP_METHOD(...)
                      ...
                  - pattern-inside: |
                      $RESULT = httpx.$HTTP_METHOD(...)
                      ...
                  - pattern-inside: |
                      $RESULT = requests.$HTTP_METHOD(...).$READ(...)
                      ...
                  - pattern-inside: |
                      $RESULT = httpx.$HTTP_METHOD(...).$READ(...)
                      ...
              - pattern: $RESULT
          # A django-filter FilterSet's rows (netbox: self.filterset(request.GET, self.queryset).qs).
          - pattern: $FILTERSET(...).qs
      - pattern: shlex.quote(...)
      # secure_filename() leaves only letters, digits, "_", "." and "-": nothing a shell treats specially.
      - pattern: secure_filename(...)
      - pattern: werkzeug.utils.secure_filename(...)
      # A URL with a literal scheme and host, as one argv element (mpv "https://youtube.com/watch?v={id}"): it can't
      # become the program or an option, and a shell command line doesn't start with "https://".
      - patterns:
          - pattern: $URL
          - pattern: f"..."
          - metavariable-regex: {metavariable: $URL, regex: '^[fF][rR]?["'']https?://[\w.-]+/'}
      - patterns:
          - pattern: '"$PREFIX" + $X'
          - metavariable-regex: {metavariable: $PREFIX, regex: '^https?://[\w.-]+/'}
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: subprocess.$FUNC($CMD, ...)
              - pattern: os.system($CMD)
              - pattern: os.popen($CMD, ...)
              - patterns:
                  - pattern: os.$EXEC($CMD, ...)
                  - metavariable-regex: {metavariable: $EXEC, regex: '^(exec[lv]p?e?|spawn[lv]p?e?)$'}
          - focus-metavariable: $CMD

  - id: codewatch.python.web.code-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request is evaluated as Python code. Never pass user input to eval/exec/compile;
      use ast.literal_eval for literals or an explicit mapping of allowed operations.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data evaluated as code
      cwe: ["CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://docs.python.org/3/library/functions.html#eval
        - https://owasp.org/www-community/attacks/Code_Injection
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *checked-inside
      - *known-safe
      - *lookup-result
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($CODE, ...)
              - pattern: exec($CODE, ...)
              - pattern: compile($CODE, ...)
          - focus-metavariable: $CODE

  - id: codewatch.python.web.sql-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request is built into an SQL statement. Use query parameters
      (cursor.execute(sql, params), the ORM, or sqlalchemy.text() with bound parameters) instead of string formatting.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data built into SQL
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Query_Parameterization_Cheat_Sheet.html
        - https://docs.djangoproject.com/en/stable/topics/db/sql/#passing-parameters-into-raw
        - https://peps.python.org/pep-0249/
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *checked-inside
      - *known-safe
      - *lookup-result
      # A SQLAlchemy statement built by select()/insert()/update()/delete() or a session's ORM query() binds the
      # values in it as parameters (flaskbb: sa.select(Topic).filter(Topic.id.in_(ids)) run by session.execute;
      # dispatch: db_session.query(...).filter(Entity.value == value)). sqlalchemy.text() stays a sink.
      - pattern-either:
          - patterns:
              - pattern: sqlalchemy.$BUILD(...)
              - metavariable-regex: {metavariable: $BUILD, regex: '^(select|insert|update|delete)$'}
          - patterns:
              - pattern: $SESSION.query(...)
              - metavariable-regex: {metavariable: $SESSION, regex: '(?i)^(.*\.)?(db_?)?session$'}
          # A model's table builds the same statements (CTFd: Pages.__table__.select().where(Pages.route == route)).
          - patterns:
              - pattern: $MODEL.__table__.$BUILD(...)
              - metavariable-regex: {metavariable: $BUILD, regex: '^(select|insert|update|delete)$'}
          - patterns:
              - pattern: $CHAIN.$METHOD(...)
              - metavariable-pattern:
                  metavariable: $CHAIN
                  pattern-either:
                    - patterns:
                        - pattern: <... sqlalchemy.$BUILD(...) ...>
                        - metavariable-regex: {metavariable: $BUILD, regex: '^(select|insert|update|delete)$'}
                    - patterns:
                        - pattern: <... $SESSION.query(...) ...>
                        - metavariable-regex: {metavariable: $SESSION, regex: '(?i)^(.*\.)?(db_?)?session$'}
                    - patterns:
                        - pattern: <... $MODEL.__table__.$BUILD(...) ...>
                        - metavariable-regex: {metavariable: $BUILD, regex: '^(select|insert|update|delete)$'}
      # Django's compiled WHERE/query: SQL with %s placeholders, the values returned separately (taiga:
      # queryset.query.where.as_sql(compiler, connection)). str(queryset.query) inlines them and stays tainted.
      - pattern: $NODE.as_sql(...)
      # The same shape from a project's own builder: `sql, params = build(...)` hands back the SQL text and the
      # values to bind, and unpacking taints both names alike (label-studio's _build_flat_increment_sql puts every
      # key in params and only %s in the text). The params half stays tainted for whatever else uses it.
      - patterns:
          - pattern-inside: |
              $SQL, $PARAMS = $BUILD(...)
              ...
          - pattern: $SQL
          - metavariable-regex: {metavariable: $PARAMS, regex: '(?i)^\w*(params|args|values|bindings|binds)$'}
          - metavariable-regex: {metavariable: $SQL, regex: '(?i)^\w*(sql|query|expr|clause|where)$'}
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CUR.execute($SQL, ...)
              - pattern: $CUR.executemany($SQL, ...)
              - pattern: $CUR.executescript($SQL)
              - pattern: $MODEL.objects.raw($SQL, ...)
              - pattern: $QS.extra(where=$SQL, ...)
              - pattern: sqlalchemy.text($SQL)
              - pattern: $CONN.exec_driver_sql($SQL, ...)
              # pandas runs the string as given; params= binds values.
              - pattern: pandas.read_sql($SQL, ...)
              - pattern: pandas.read_sql_query($SQL, ...)
              - pattern: pandas.read_sql(sql=$SQL, ...)
              - pattern: pandas.read_sql_query(sql=$SQL, ...)
              # Prisma Client Python: query_raw(sql, *params).
              - pattern: $DB.query_raw($SQL, ...)
              - pattern: $DB.query_raw(query=$SQL, ...)
              - pattern: $DB.query_first($SQL, ...)
              - pattern: $DB.query_first(query=$SQL, ...)
              - pattern: $DB.execute_raw($SQL, ...)
              - pattern: $DB.execute_raw(query=$SQL, ...)
              # pgAdmin's driver runs the string it's given: conn.execute_scalar(sql), execute_dict, execute_2darray,
              # execute_void (GHSA-v395-x24j-4r3g: a restore point's name formatted into the SQL).
              - patterns:
                  - pattern: $CONN.$EXEC($SQL, ...)
                  - metavariable-regex: {metavariable: $EXEC, regex: '^execute_(scalar|dict|2darray|void|async)$'}
          - focus-metavariable: $SQL

  - id: codewatch.python.web.path-traversal
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request is used in a file path, so "../" can reach files outside the intended directory.
      Use werkzeug.utils.secure_filename / os.path.basename, or resolve the path and check it stays inside the base.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data used in a file path
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"]
      owasp: ["A01:2025 - Broken Access Control"]
      references:
        - https://owasp.org/www-community/attacks/Path_Traversal
        - https://werkzeug.palletsprojects.com/en/stable/utils/#werkzeug.utils.secure_filename
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *checked-inside
      - *known-safe
      - *lookup-result
      - pattern: os.path.basename(...)
      - pattern: pathlib.Path(...).name
      - pattern: pathlib.Path(...).stem
      - pattern: pathlib.PurePath(...).name
      - pattern: pathlib.PurePath(...).stem
      # The same through a variable: candidate = Path(run_id) ... base / candidate.name (Vibe-Trading GHSA-mjrq at its
      # fix).
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $CANDIDATE = pathlib.Path(...)
                  ...
              - pattern-inside: |
                  $CANDIDATE = pathlib.PurePath(...)
                  ...
          - pattern-either:
              - pattern: $CANDIDATE.name
              - pattern: $CANDIDATE.stem
      - pattern: werkzeug.utils.secure_filename(...)
      - pattern: secure_filename(...)
      # Replacing every character outside a class of letters, digits, "_", "-" and spaces leaves one name that can't
      # climb (changedetection.io GHSA-9jj8-v89v-xjvw at its fix: re.sub(r'[^a-z0-9_]+', '', group)). [^\w.-] keeps
      # "..", so it doesn't.
      - patterns:
          - pattern: re.sub($PATTERN, $WITH, ...)
          - metavariable-regex:
              metavariable: $PATTERN
              regex: '^r?[''"]\[\^([a-zA-Z0-9_ -]|\\[wd])+\][+*]?[''"]$'
          - metavariable-regex: {metavariable: $WITH, regex: '^[rbu]*[''"][-_]?[''"]$'}
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: open($PATH, ...)
              - pattern: io.open($PATH, ...)
              - pattern: codecs.open($PATH, ...)
              - pattern: os.open($PATH, ...)
              - pattern: pathlib.Path($PATH, ...)
              - pattern: os.remove($PATH)
              - pattern: os.unlink($PATH)
              - pattern: os.rename($PATH, ...)
              - pattern: os.listdir($PATH)
              - pattern: os.path.exists($PATH)
              - pattern: os.path.isfile($PATH)
              - pattern: os.path.isdir($PATH)
              - pattern: os.stat($PATH)
              # A pathlib.Path built from request data, used once it's built: (base / name).read_text()
              - patterns:
                  - pattern: $PATH.$USE(...)
                  - metavariable-regex:
                      metavariable: $USE
                      regex: ^(exists|is_file|is_dir|stat|open|read_text|read_bytes|write_text|write_bytes|unlink|rmdir|mkdir|touch|rename|replace|iterdir|glob|rglob|chmod)$
                  - metavariable-pattern:
                      metavariable: $PATH
                      pattern-either: &pathlib-value
                        - pattern: pathlib.Path(...)
                        - pattern: pathlib.PurePath(...)
                        - pattern: pathlib.Path(...) / $NAME
                        - pattern: (pathlib.Path(...) / $NAME).resolve(...)
                        - pattern: pathlib.Path(...).joinpath(...)
                        - pattern: $BASE / $NAME
                        - pattern: ($BASE / $NAME).resolve(...)
                        - pattern: $BASE.joinpath(...)
              - patterns:
                  - pattern: $PATH.$USE(...)
                  - metavariable-regex:
                      metavariable: $USE
                      regex: ^(exists|is_file|is_dir|stat|open|read_text|read_bytes|write_text|write_bytes|unlink|rmdir|mkdir|touch|rename|replace|iterdir|glob|rglob|chmod)$
                  - pattern-inside: |
                      $PATH = $INIT
                      ...
                  - metavariable-pattern:
                      metavariable: $INIT
                      pattern-either: *pathlib-value
              - pattern: shutil.$OP($PATH, ...)
              # werkzeug's FileStorage.save(path) for an upload, or an image saved under a request-made name.
              # Django storages reject "..", so their save() isn't a sink.
              - patterns:
                  - pattern: $FILE.save($PATH, ...)
                  - metavariable-regex: {metavariable: $FILE, regex: '(?i)^(?!.*storage)'}
              - pattern: flask.send_file($PATH, ...)
              - pattern: send_file($PATH, ...)
              - pattern: django.http.FileResponse(open($PATH, ...), ...)
              # Starlette and FastAPI open the path they're given (Fides GHSA-r25m-cr6v-p9hq).
              - pattern: starlette.responses.FileResponse($PATH, ...)
              - pattern: fastapi.responses.FileResponse($PATH, ...)
          # A path's name or extension is a string, not a file opened (paperless-ngx: Path(str(doc.filename)).suffix).
          - pattern-not-inside: pathlib.Path(...).suffix
          - pattern-not-inside: pathlib.Path(...).suffixes
          - pattern-not-inside: pathlib.Path(...).stem
          - pattern-not-inside: pathlib.Path(...).name
          - pattern-not-inside: pathlib.Path(...).parts
          # A containment check opens nothing (pgAdmin GHSA-cr8c-972v-rmp3: Path(new_name).relative_to(the_dir) in a
          # try, before the open() that is the sink).
          - pattern-not-inside: pathlib.Path(...).relative_to(...)
          - pattern-not-inside: pathlib.Path(...).is_relative_to(...)
          # A Path assigned to a variable opens nothing yet; each use of the variable is a sink of its own
          # (Vibe-Trading GHSA-mjrq at its fix: candidate = Path(run_id), checked, then only candidate.name used).
          - pattern-not-inside: $CANDIDATE = pathlib.Path($PATH, ...)
          - pattern-not-inside: $CANDIDATE = pathlib.PurePath($PATH, ...)
          - focus-metavariable: $PATH

  - id: codewatch.python.web.xss
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request is written into an HTML response without escaping. Render it through an
      auto-escaping template, or escape it with html.escape()/markupsafe.escape() first.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data in an HTML response without escaping
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
        - https://flask.palletsprojects.com/en/stable/web-security/#cross-site-scripting-xss
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *checked-inside
      - *known-safe
      - *lookup-result
      - pattern: html.escape(...)
      - pattern: markupsafe.escape(...)
      - pattern: flask.escape(...)
      - pattern: django.utils.html.escape(...)
      - pattern: bleach.clean(...)
      - pattern: flask.jsonify(...)
      - pattern: jsonify(...)
      - pattern: json.dumps(...)
      # A file response's body is the file; the name only goes into a quoted Content-Disposition header.
      - pattern: flask.send_file(...)
      - pattern: send_file(...)
      - pattern: flask.send_from_directory(...)
      - pattern: send_from_directory(...)
      # What a file holds isn't what the request sent, even when the request named the file; reading from a path it
      # chose is path traversal, reported by its own rule (CodeRed: HttpResponse(open(fullpath, 'rb').read())).
      - pattern: open(...)
      - pattern: $PATH.read_text(...)
      - pattern: $PATH.read_bytes(...)
      # Jinja templates escape what they're given; redirect() escapes the URL in its body.
      - pattern: flask.render_template(...)
      - pattern: render_template(...)
      - pattern: django.shortcuts.render(...)
      - pattern: django.template.loader.render_to_string(...)
      # A model or helper that renders its own template, given the request for context (djangoproject.com:
      # instance.render_to_string(request=request)).
      - pattern: $OBJ.render_to_string(...)
      - pattern: django.template.response.TemplateResponse(...)
      - pattern: flask.redirect(...)
      - pattern: redirect(...)
      - pattern: url_for(...)
      - pattern: flask.url_for(...)
      # Project helpers named like escape_html / html_escape are treated as escaping functions.
      - patterns:
          - pattern: $ESCAPE(...)
          - metavariable-regex: {metavariable: $ESCAPE, regex: '(?i).*escape\w{0,30}$'}
    pattern-sinks:
      # A (body, status, headers) tuple: only the body is rendered; header values can't inject markup.
      - patterns:
          - pattern-inside: |
              @$APP.route(...)
              def $VIEW(...):
                ...
          # A function defined inside the view returns to its caller, not to the client.
          - pattern-not-inside: |
              def $VIEW(...):
                ...
                def $INNER(...):
                  ...
          - pattern-either:
              - patterns:
                  - pattern: return $BODY
                  - pattern-not: return ($FIRST, $SECOND, ...)
              - pattern: return ($BODY, $SECOND, ...)
          # Flask serves a returned dict or list as JSON.
          - pattern-not: return {...}
          - pattern-not: return [...]
          - pattern-not: return ({...}, ...)
          - pattern-not: return ([...], ...)
          # Returning a response object built earlier: its body was checked where it was built (sinks below).
          - pattern-not-inside: |
              $BODY = make_response(...)
              ...
          - pattern-not-inside: |
              $BODY = flask.make_response(...)
              ...
          - pattern-not-inside: |
              $BODY = flask.Response(...)
              ...
          - pattern-not: return flask.Response(...)
          - pattern-not: return flask.make_response(...)
          - pattern-not: return make_response(...)
          - focus-metavariable: $BODY
      # A dict or list body is turned into JSON by Flask (MLflow: make_response({"user": user.to_json()})).
      - patterns:
          - pattern-either:
              - pattern: flask.make_response(($BODY, $SECOND, ...), ...)
              - pattern: make_response(($BODY, $SECOND, ...), ...)
          - pattern-not: $MAKE(({...}, ...), ...)
          - pattern-not: $MAKE(([...], ...), ...)
          - focus-metavariable: $BODY
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: flask.make_response($BODY, ...)
                      - pattern: make_response($BODY, ...)
                  - pattern-not: flask.make_response(($FIRST, $SECOND, ...), ...)
                  - pattern-not: make_response(($FIRST, $SECOND, ...), ...)
                  - pattern-not: $MAKE({...}, ...)
                  - pattern-not: $MAKE([...], ...)
              - patterns:
                  - pattern-either:
                      - pattern: flask.Response($BODY, ...)
                      - pattern: django.http.HttpResponse($BODY, ...)
                  # Media, JSON, plain text and downloads aren't rendered as HTML (recipes:
                  # HttpResponse(export_file, content_type='application/force-download')).
                  - pattern-not: $RESP($B, ..., mimetype="=~/^(image|video|audio|font)\/|^application\/(json|octet-stream|pdf|zip|force-download|x-download)|^text\/(plain|csv)/", ...)
                  - pattern-not: $RESP($B, ..., content_type="=~/^(image|video|audio|font)\/|^application\/(json|octet-stream|pdf|zip|force-download|x-download)|^text\/(plain|csv)/", ...)
              - pattern: flask.render_template_string($BODY, ...)
              - pattern: render_template_string($BODY, ...)
              - pattern: markupsafe.Markup($BODY)
              - pattern: django.utils.safestring.mark_safe($BODY)
              - pattern: mark_safe($BODY)
          # A response given a non-HTML type on the next lines: r = make_response(text); r.mimetype = "text/plain"
          # (CTFd views.py).
          - pattern-not-inside: |
              $R = $MAKE(...)
              ...
              $R.mimetype = "=~/^(image|video|audio|font)\/|^application\/(json|octet-stream|pdf|zip|force-download|x-download)|^text\/(plain|csv)/"
          - pattern-not-inside: |
              $R = $MAKE(...)
              ...
              $R.content_type = "=~/^(image|video|audio|font)\/|^application\/(json|octet-stream|pdf|zip|force-download|x-download)|^text\/(plain|csv)/"
          - pattern-not-inside: |
              $R = $MAKE(...)
              ...
              $R[$HEADER] = "=~/^(image|video|audio|font)\/|^application\/(json|octet-stream|pdf|zip|force-download|x-download)|^text\/(plain|csv)/"
          - pattern-not-inside: |
              $R = $MAKE(...)
              ...
              $R.headers[$HEADER] = "=~/^(image|video|audio|font)\/|^application\/(json|octet-stream|pdf|zip|force-download|x-download)|^text\/(plain|csv)/"
          - focus-metavariable: $BODY

  - id: codewatch.python.web.xpath-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request is built into an XPath query. Pass it as an XPath variable
      (e.g. tree.xpath("//user[@name=$name]", name=value)) instead of formatting it into the query.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data built into XPath
      cwe: ["CWE-643: Improper Neutralization of Data within XPath Expressions ('XPath Injection')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://owasp.org/www-community/attacks/XPATH_Injection
        - https://lxml.de/xpathxslt.html#the-xpath-method
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *checked-inside
      - *known-safe
      - *lookup-result
      # Replacing the quote that delimits the value (' -> &apos;) stops it from closing the XPath string.
      - patterns:
          - pattern: $X.replace($QUOTE, ...)
          - metavariable-regex: {metavariable: $QUOTE, regex: '^["'']\\?["'']["'']$'}
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: lxml.etree.XPath($QUERY, ...)
              - pattern: lxml.etree.ETXPath($QUERY, ...)
              - pattern: $TREE.xpath($QUERY, ...)
              - pattern: elementpath.select($ROOT, $QUERY, ...)
          - focus-metavariable: $QUERY
      # ElementTree's find/findall, not a regular expression's: re.findall(pattern, text) or a compiled
      # `_TOKEN_RE.findall(text)` (Vibe-Trading's memory search, reached once agent tool arguments were sources).
      - patterns:
          - pattern-either:
              - pattern: $TREE.findall($QUERY, ...)
              - pattern: $TREE.find($QUERY, ...)
          - metavariable-regex:
              metavariable: $TREE
              regex: '^(?!(re|regex)$)(?!(?i:.*([._]|^)(re|rx|regex|regexp|pattern)$)).*$'
          - focus-metavariable: $QUERY

  - id: codewatch.python.web.ldap-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request is built into an LDAP search filter. Escape it with
      ldap3.utils.conv.escape_filter_chars() (or ldap.filter.escape_filter_chars) first.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data built into an LDAP filter
      cwe: ["CWE-90: Improper Neutralization of Special Elements used in an LDAP Query ('LDAP Injection')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/LDAP_Injection_Prevention_Cheat_Sheet.html
        - https://ldap3.readthedocs.io/en/latest/searches.html
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *checked-inside
      - *known-safe
      - *lookup-result
      - patterns:
          - pattern: $ESCAPE(...)
          - metavariable-regex: {metavariable: $ESCAPE, regex: '(?i).*escape'}
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CONN.search($BASE, $FILTER, ...)
              - pattern: $CONN.search(..., search_filter=$FILTER, ...)
              - pattern: $CONN.search_s($BASE, $SCOPE, $FILTER, ...)
              - pattern: $CONN.search_st($BASE, $SCOPE, $FILTER, ...)
              - pattern: $CONN.search_ext_s($BASE, $SCOPE, $FILTER, ...)
          # Only where an LDAP library is in use: Post.search(q, page) is an ORM method, not a directory query.
          - pattern-either:
              - pattern-inside: |
                  import ldap3
                  ...
              - pattern-inside: |
                  import ldap
                  ...
              - pattern-inside: |
                  from ldap3 import $NAME
                  ...
              - pattern-inside: |
                  from ldap import $NAME
                  ...
          - focus-metavariable: $FILTER

  - id: codewatch.python.web.open-redirect
    mode: taint
    languages: [python]
    severity: WARNING
    message: >-
      Data from the HTTP request decides where the user is redirected, so a link to this site can forward
      users to any other site. Redirect only to relative paths or an allowlist of hosts
      (Django: url_has_allowed_host_and_scheme).
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data used as a redirect target
      cwe: ["CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"]
      owasp: ["A01:2025 - Broken Access Control"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
        - https://docs.djangoproject.com/en/stable/ref/utils/#django.utils.http.url_has_allowed_host_and_scheme
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *checked-inside
      - *checked-or-replaced
      - *known-safe
      - *lookup-result
      # Back to the page the user came from: only the site that linked here chose it, so it can't send anyone
      # anywhere they weren't already.
      - pattern-either:
          - pattern: $REQ.referrer
          - pattern: $REQ.headers.get("Referer", ...)
          - pattern: $REQ.META.get("HTTP_REFERER", ...)
      # The app's own root (scheme and Host): a link can't change the Host header (GHSA-g3cm-qg2v-2hj5, pyload,
      # urljoin(request.url_root, url_for(...))).
      - patterns:
          - pattern-either:
              - pattern: $REQ.url_root
              - pattern: $REQ.host_url
              - pattern: $REQ.build_absolute_uri("/")
          - metavariable-regex: {metavariable: $REQ, regex: '^((flask\.)?request|self\.request)$'}
      # The request's own path stays on this site unless it starts with "//"; open-redirect-path covers that.
      - &request-path
        pattern-either:
          - pattern: request.path
          - pattern: request.path_info
          - pattern: request.full_path
          - pattern: request.get_full_path(...)
          - pattern: request.get_full_path_info(...)
          - pattern: flask.request.path
          - pattern: flask.request.full_path
      # Added after "?", "#" or "&", a value can change the query or fragment but not where the link goes.
      - pattern-either:
          - pattern: '"=~/^[?#\x26]/" % $X'
          - pattern: '"=~/^[?#\x26]/" + $X'
          - pattern: '"=~/^[?#\x26]/".format(...)'
          - pattern: urllib.parse.urlencode(...)
      # A route's own URL with more text after it stays on this site when that text starts with something other
      # than "/" (reverse("index") is "/", and "/" + "/evil.example" would leave): recipes'
      # build_absolute_uri(request, reverse("index")) + f"recipe/{pk}" and reverse("login") + "?next=" + path.
      - patterns:
          - pattern-either:
              - pattern: $BASE + $REST
              - pattern: $BASE + $REST + $MORE
          - metavariable-pattern:
              metavariable: $BASE
              pattern-either:
                - pattern: reverse(...)
                - pattern: django.urls.reverse(...)
                - pattern: url_for(...)
                - pattern: flask.url_for(...)
                - patterns:
                    - pattern-either:
                        - pattern: $BUILD(..., reverse(...), ...)
                        - pattern: $BUILD(..., django.urls.reverse(...), ...)
                    - metavariable-regex: {metavariable: $BUILD, regex: '^(.*\.)?build_absolute_uri$'}
          - metavariable-regex: {metavariable: $REST, regex: '^f?[''"][^/\\''"{]'}
      # The mount point the server was configured with (SCRIPT_NAME), not something a link can set.
      - pattern: request.script_root
      - pattern: flask.request.script_root
      # A model looked up by the value: redirect() sends the user to the stored object's own URL.
      - pattern: $MODEL.objects.$QUERY(...)
      # A project helper that returns only a URL it found safe (flaskbb: get_first_safe_redirect_url(next, ...,
      # allowed_hosts=...) returns the candidate when its host is allowed, else the fallback).
      - patterns:
          - pattern: $SAFE(...)
          - metavariable-regex: {metavariable: $SAFE, regex: '(?i)^(.*\.)?(\w+_)?safe_(\w+_)?(url|redirect|next|target)$'}
    pattern-sinks: &redirect-sinks
      - patterns:
          - pattern-either:
              - pattern: flask.redirect($URL, ...)
              - pattern: redirect($URL, ...)
              - pattern: django.http.HttpResponseRedirect($URL, ...)
              - pattern: django.http.HttpResponsePermanentRedirect($URL, ...)
              - pattern: starlette.responses.RedirectResponse($URL, ...)
          - focus-metavariable: $URL
      - patterns:
          - pattern-either:
              - pattern: $RESP.headers[$NAME] = $URL
              - pattern: $RESP[$NAME] = $URL
              - pattern: $HEADERS.add($NAME, $URL, ...)
              - pattern: $HEADERS.set($NAME, $URL, ...)
              - pattern: $HEADERS.setdefault($NAME, $URL)
          - metavariable-regex: {metavariable: $NAME, regex: '(?i)^[''"]location[''"]$'}
          - focus-metavariable: $URL
      - patterns:
          - pattern-either:
              - pattern: '$RESPONSE(..., headers={..., $NAME: $URL, ...}, ...)'
          - metavariable-regex: {metavariable: $NAME, regex: '(?i)^[''"]location[''"]$'}
          - focus-metavariable: $URL

  - id: codewatch.python.web.trust-boundary
    mode: taint
    languages: [python]
    severity: WARNING
    message: >-
      Unvalidated data from the HTTP request is stored in the server-side session, where later code will trust it.
      Validate it (type, range, allowlist) before storing it.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data stored in the session unvalidated
      cwe: ["CWE-501: Trust Boundary Violation"]
      owasp: ["A06:2025 - Insecure Design"]
      references:
        - https://cwe.mitre.org/data/definitions/501.html
        - https://flask.palletsprojects.com/en/stable/api/#sessions
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *checked-inside
      - *known-safe
      - *lookup-result
      # What a login or verification call returns is the checked identity, not the raw request value.
      - patterns:
          - pattern: $AUTH(...)
          - metavariable-regex: {metavariable: $AUTH, regex: '(?i)(.*\.)?(login|authenticate|verify_\w{1,30}|check_password)$'}
      # A record's id and a hash or signature are the server's values, whatever the request said: CTFd's
      # login_user(user) stores user.id and hmac(user.password) for a user just created from the sign-up form.
      - patterns:
          - pattern-either:
              - pattern: $OBJ.id
              - pattern: $OBJ.pk
          - metavariable-regex: {metavariable: $OBJ, regex: '^(?!((flask\.)?request|self\.request)(\.|$))[\w.]+$'}
      - patterns:
          - pattern: $HASH(...)
          - metavariable-regex:
              metavariable: $HASH
              regex: '(?i)^(.*\.)?(hmac|hash\w*|\w+_hash|\w*digest|sha\d+|md5|blake2\w|sign|sign_\w+)$'
      # A row looked up by a request value is the database's record, not the request's (GHSA-9x43-5qcq-h79q,
      # Grappelli: the switched-from user's id and name).
      - pattern: get_object_or_404(...)
      - patterns:
          - pattern-either:
              - pattern: $MODEL.objects.$QUERY(...)
              - pattern: $MODEL.query.$QUERY(...)
          - metavariable-regex: {metavariable: $QUERY, regex: '^(get|filter|first|get_or_404|first_or_404|one|one_or_none|filter_by)$'}
    pattern-sinks:
      - patterns:
          - pattern-either: &session-store
              - pattern: flask.session[$KEY] = $VALUE
              - pattern: session[$KEY] = $VALUE
              - pattern: $REQ.session[$KEY] = $VALUE
          # A key with a fixed prefix (f"player_{code}") can't name another entry, such as the logged-in user's.
          - metavariable-regex: {metavariable: $KEY, regex: '^(?![rbuf]*[''"][^''"{]+)'}
          - focus-metavariable: $KEY
      - patterns:
          - pattern-either: *session-store
          - focus-metavariable: $VALUE

  - id: codewatch.python.web.unsafe-deserialization
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request is deserialized with a loader that can run code (pickle, marshal, yaml.load
      without SafeLoader). Use JSON or yaml.safe_load for untrusted data.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data deserialized unsafely
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      owasp: ["A08:2025 - Software or Data Integrity Failures"]
      references:
        - https://docs.python.org/3/library/pickle.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *checked-inside
      - *known-safe
      - *lookup-result
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: pickle.loads($DATA, ...)
              - pattern: pickle.load($DATA, ...)
              - pattern: _pickle.loads($DATA, ...)
              - pattern: marshal.loads($DATA, ...)
              - pattern: shelve.open($DATA, ...)
              - pattern: jsonpickle.decode($DATA, ...)
              - pattern: dill.loads($DATA, ...)
              - patterns:
                  - pattern: yaml.load($DATA, ...)
                  - pattern-not: yaml.load($DATA, Loader=yaml.SafeLoader, ...)
                  - pattern-not: yaml.load($DATA, Loader=yaml.CSafeLoader, ...)
              - pattern: yaml.unsafe_load($DATA, ...)
          - focus-metavariable: $DATA

  - id: codewatch.python.web.weak-random-token
    mode: taint
    languages: [python]
    severity: WARNING
    message: >-
      A value from the non-cryptographic `random` module is used as a session or cookie value, so it can be
      predicted. Use the `secrets` module (secrets.token_urlsafe(), secrets.randbelow()).
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Predictable random value used as a token
      cwe: ["CWE-330: Use of Insufficiently Random Values"]
      owasp: ["A04:2025 - Cryptographic Failures"]
      references:
        - https://docs.python.org/3/library/random.html
        - https://docs.python.org/3/library/secrets.html
    pattern-sources:
      - patterns:
          - pattern: random.$FUNC(...)
          - metavariable-regex: {metavariable: $FUNC, regex: '^(?!SystemRandom$)\w{1,40}$'}
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *checked-inside
      - *known-safe
      - *lookup-result
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RESP.set_cookie($NAME, $VALUE, ...)
              - pattern: flask.session[$KEY] = $VALUE
              - pattern: session[$KEY] = $VALUE
              # request.session, self.session; not any dict (game['questions'] = ...).
              - patterns:
                  - pattern: $SESSION[$KEY] = $VALUE
                  - metavariable-regex: {metavariable: $SESSION, regex: '(?i)^(.*\.)?\w*session$'}
          - focus-metavariable: $VALUE

  - id: codewatch.python.weak-hash
    languages: [python]
    severity: WARNING
    message: >-
      MD4, MD5 and SHA-1 are broken for security use. Use SHA-256 or better, or a password hash
      (hashlib.scrypt, argon2, Django's password hashers) for passwords. If this hash isn't used for security,
      pass usedforsecurity=False.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Weak hash algorithm
      security-purpose: required
      cwe: ["CWE-328: Use of Weak Hash"]
      owasp: ["A04:2025 - Cryptographic Failures"]
      references:
        - https://docs.python.org/3/library/hashlib.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          # Matches the value, so hashlib.new(ALGORITHM) with ALGORITHM = "sha1" counts too.
          - pattern: hashlib.new("=~/(?i)^(md4|md5|sha1|sha-1|md5-sha1|ripemd160)$/", ...)
      - pattern-not: hashlib.$F(..., usedforsecurity=False, ...)

  - id: codewatch.python.insecure-cookie
    languages: [python]
    severity: WARNING
    message: >-
      This cookie can be sent over plain HTTP, where it can be intercepted. Set secure=True
      (and httponly=True unless JavaScript needs it).
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Cookie without the Secure flag
      cwe: ["CWE-614: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute"]
      owasp: ["A02:2025 - Security Misconfiguration"]
      references:
        - https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies#restrict_access_to_cookies
        - https://flask.palletsprojects.com/en/stable/api/#flask.Response.set_cookie
    patterns:
      # No secure= at all, or a literal False. A variable (secure=settings.SESSION_COOKIE_SECURE) is the
      # deployment's choice, not something the code got wrong (CTFd's session interface).
      - pattern-either:
          - patterns:
              - pattern: $RESP.set_cookie(...)
              - pattern-not: $RESP.set_cookie(..., secure=$SECURE, ...)
          - pattern: $RESP.set_cookie(..., secure=False, ...)
      - pattern-not: $RESP.delete_cookie(...)
      # Clearing a cookie (empty value, already expired) sends nothing worth intercepting.
      - pattern-not: $RESP.set_cookie($NAME, "", ...)
      - pattern-not: $RESP.set_cookie(..., expires=0, ...)
      - pattern-not: $RESP.set_cookie(..., max_age=0, ...)

  - id: codewatch.python.xml-external-entities
    languages: [python]
    severity: ERROR
    message: >-
      External entity resolution is switched on for this XML parser, so if it ever parses a document someone else
      wrote, that document can read local files or make network requests (XXE). Leave it off, or parse untrusted
      XML with defusedxml.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: XML external entities enabled
      cwe: ["CWE-611: Improper Restriction of XML External Entity Reference"]
      owasp: ["A02:2025 - Security Misconfiguration"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html
        - https://docs.python.org/3/library/xml.html#xml-vulnerabilities
    pattern-either:
      - pattern: $P.setFeature(xml.sax.handler.feature_external_ges, True)
      - pattern: $P.setFeature(xml.sax.handler.feature_external_pes, True)
      - pattern: lxml.etree.XMLParser(..., resolve_entities=True, ...)
      - pattern: lxml.etree.XMLParser(..., no_network=False, ...)

  - id: codewatch.python.web.xxe
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Request data is parsed as XML by a parser that resolves external entities (switched on, or lxml's default
      before 5.0), so a crafted document can read local files or make network requests (XXE). Turn entity
      resolution off (XMLParser(resolve_entities=False)), or parse with defusedxml.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data parsed with XML external entities enabled
      cwe: ["CWE-611: Improper Restriction of XML External Entity Reference"]
      owasp: ["A02:2025 - Security Misconfiguration"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html
        - https://docs.python.org/3/library/xml.html#xml-vulnerabilities
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *checked-inside
      - *known-safe
      - *lookup-result
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $P.setFeature(xml.sax.handler.feature_external_ges, True)
                  ...
              - pattern-inside: |
                  $P.setFeature(xml.sax.handler.feature_external_pes, True)
                  ...
              - pattern-inside: |
                  $P = lxml.etree.XMLParser(..., resolve_entities=True, ...)
                  ...
              - pattern-inside: |
                  $P = lxml.etree.XMLParser(..., no_network=False, ...)
                  ...
          - pattern-either:
              - pattern: xml.dom.minidom.parseString($DATA, $P, ...)
              - pattern: xml.dom.minidom.parse($DATA, $P, ...)
              - pattern: xml.dom.pulldom.parseString($DATA, $P, ...)
              - pattern: xml.sax.parseString($DATA, ...)
              - pattern: $P.parse($DATA, ...)
              - pattern: $P.feed($DATA)
              - pattern: lxml.etree.fromstring($DATA, $P, ...)
              - pattern: lxml.etree.fromstring($DATA, parser=$P, ...)
              - pattern: lxml.etree.XML($DATA, $P, ...)
              - pattern: lxml.etree.XML($DATA, parser=$P, ...)
              - pattern: lxml.etree.parse($DATA, $P, ...)
              - pattern: lxml.etree.parse($DATA, parser=$P, ...)
          - focus-metavariable: $DATA
      # lxml's default parser resolved external entities until 5.0, and which lxml is installed isn't visible here.
      - patterns:
          - pattern-either:
              - pattern: lxml.etree.fromstring($DATA)
              - pattern: lxml.etree.XML($DATA)
              - pattern: lxml.etree.parse($DATA)
          - focus-metavariable: $DATA

  - id: codewatch.python.template-autoescape-disabled
    languages: [python]
    severity: ERROR
    message: >-
      HTML escaping is switched off for every template this environment renders, so any request data a template
      prints becomes markup and script (XSS). Use autoescape=True or jinja2.select_autoescape(), and mark the few
      trusted fragments safe one by one.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Template auto-escaping disabled
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://jinja.palletsprojects.com/en/stable/api/#autoescaping
        - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
    # Only an explicit autoescape=False for HTML: a bare jinja2.Environment() is also used for SQL, config and code
    # generation, where escaping would be wrong (bandit B701 still lists those for review).
    pattern-either:
      - pattern: aiohttp_jinja2.setup(..., autoescape=False, ...)
      - pattern: $APP.jinja_env.autoescape = False
      - pattern: '$APP.jinja_options = {..., "autoescape": False, ...}'
      - patterns:
          - pattern: jinja2.Environment(..., autoescape=False, ...)
          - pattern-either:
              - pattern: jinja2.Environment(..., loader=$LOADER, ...)
          - metavariable-pattern:
              metavariable: $LOADER
              pattern-either:
                - pattern: jinja2.PackageLoader(...)
                - pattern: jinja2.FileSystemLoader(...)
          # Templates kept in a folder named for prompts, SQL or plain text aren't HTML (paperless-ngx: LLM prompts
          # from PackageLoader("paperless_ai", "prompts")).
          - metavariable-regex:
              metavariable: $LOADER
              regex: '^(?![^)]*(?i:prompt|sql|quer(y|ies)|txt|plain|markdown|yaml|codegen))'

  - id: codewatch.python.web.ssrf
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request decides which URL the server fetches, so a user can make it call internal
      services or cloud metadata endpoints (SSRF). Build the URL from a fixed scheme and host, or check the host
      against an allowlist.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data used as a URL the server fetches
      cwe: ["CWE-918: Server-Side Request Forgery (SSRF)"]
      owasp: ["A01:2025 - Broken Access Control"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *checked-inside
      - *checked-or-replaced
      - *known-safe
      - *lookup-result
      # Only the path or query is user data when the scheme and host are fixed in front of it.
      - patterns:
          - pattern-either:
              - pattern: '"$PREFIX" + $X'
              - pattern: '"$PREFIX" % $X'
              - pattern: '"$PREFIX".format(...)'
          - metavariable-regex: {metavariable: $PREFIX, regex: '^[''"]?https?://[^/''"{%]+/'}
      - patterns:
          - pattern: $URL
          - metavariable-pattern:
              metavariable: $URL
              patterns:
                - pattern: f"..."
                - pattern-regex: '^f[''"]https?://[^/{''"]+/'
      # The same, with the fixed start kept in a field by __init__: `self.api_url = "https://api.github.com/{}"`,
      # then `self.api_url.format(uri_path)` (taiga's GithubClient.get, reached once receivers of a project class
      # were connected).
      - patterns:
          - pattern-inside: |
              class $HOLDER(...):
                ...
                def __init__(...):
                  ...
                  self.$BASE = "$PREFIX"
                  ...
                ...
          - pattern-either:
              - pattern: self.$BASE.format(...)
              - pattern: self.$BASE + $REST
              - pattern: self.$BASE % $REST
          - metavariable-regex: {metavariable: $PREFIX, regex: '^https?://[^/{%]+/'}
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: requests.$METHOD($URL, ...)
              - pattern: httpx.$METHOD($URL, ...)
          - metavariable-regex: {metavariable: $METHOD, regex: ^(get|post|put|patch|delete|head|options|stream)$}
          - focus-metavariable: $URL
      # The URL by keyword (Scout GHSA-g53g-q539-93cv: requests.request(method=request.method, url=remote_url)).
      - patterns:
          - pattern-either:
              - pattern: requests.$METHOD(..., url=$URL, ...)
              - pattern: httpx.$METHOD(..., url=$URL, ...)
          - metavariable-regex: {metavariable: $METHOD, regex: ^(get|post|put|patch|delete|head|options|stream|request)$}
          - focus-metavariable: $URL
      - patterns:
          - pattern-either:
              - pattern: requests.request($M, $URL, ...)
              - pattern: httpx.request($M, $URL, ...)
              - pattern: urllib.request.urlopen($URL, ...)
              - pattern: urllib.request.Request($URL, ...)
              - pattern: urllib.request.urlretrieve($URL, ...)
          - focus-metavariable: $URL
      # The same calls on a client or session object: `requests.Session()`, `httpx.Client()` /
      # `httpx.AsyncClient()`, made in the function (`with httpx.Client() as client:`) or kept in a field by
      # __init__, including `getattr(self._client, method)(url)` (firefighter GHSA-fqvv's HttpClient.call).
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $CLIENT = $SESSION(...)
                          ...
                      - pattern-inside: |
                          with $SESSION(...) as $CLIENT:
                            ...
                      - pattern-inside: |
                          async with $SESSION(...) as $CLIENT:
                            ...
                  - pattern-either:
                      - patterns:
                          - pattern-either:
                              - pattern: $CLIENT.$METHOD($URL, ...)
                              - pattern: $CLIENT.$METHOD(..., url=$URL, ...)
                          - metavariable-regex: {metavariable: $METHOD, regex: ^(get|post|put|patch|delete|head|options|stream)$}
                      - pattern: $CLIENT.request($VERB, $URL, ...)
                      - pattern: $CLIENT.request(..., url=$URL, ...)
                      - pattern: getattr($CLIENT, $NAME)($URL, ...)
              - patterns:
                  - pattern-inside: |
                      class $HOLDER(...):
                        ...
                        def __init__(...):
                          ...
                          self.$FIELD = $SESSION(...)
                          ...
                        ...
                  - pattern-either:
                      - patterns:
                          - pattern-either:
                              - pattern: self.$FIELD.$METHOD($URL, ...)
                              - pattern: self.$FIELD.$METHOD(..., url=$URL, ...)
                          - metavariable-regex: {metavariable: $METHOD, regex: ^(get|post|put|patch|delete|head|options|stream)$}
                      - pattern: self.$FIELD.request($VERB, $URL, ...)
                      - pattern: self.$FIELD.request(..., url=$URL, ...)
                      - pattern: getattr(self.$FIELD, $NAME)($URL, ...)
          - metavariable-regex: {metavariable: $SESSION, regex: '^(requests\.(Session|session)|httpx\.(Client|AsyncClient))$'}
          - focus-metavariable: $URL

  - id: codewatch.python.web.regex-injection
    mode: taint
    languages: [python]
    severity: WARNING
    message: >-
      Data from the HTTP request is used as a regular expression, so a user can send a pattern that takes
      exponential time to match (ReDoS) or matches more than intended. Escape it with re.escape(), or match
      literally with `in`.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data used as a regular expression
      cwe: ["CWE-730: OWASP Top Ten 2004 Category A9 - Denial of Service", "CWE-1333: Inefficient Regular Expression Complexity"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://owasp.org/www-community/attacks/Regular_expression_Denial_of_Service_-_ReDoS
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *checked-inside
      - *known-safe
      - *lookup-result
      - pattern: re.escape(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: re.$FUNC($PATTERN, ...)
              - pattern: regex.$FUNC($PATTERN, ...)
          # The regex module's timeout bounds a slow pattern: a user's own pattern taken on purpose (recipes'
          # automations, regex.sub(rule[1], ..., timeout=REGEX_TIMEOUT)).
          - pattern-not: regex.$FUNC(..., timeout=$TIMEOUT, ...)
          # A compile that only checks the pattern, alone in a try: compiling doesn't backtrack, and its result is
          # dropped (paperless-ngx's validate_regex_pattern, before matching with a timeout elsewhere).
          - pattern-not-inside: |
              try:
                $LIB.compile($PATTERN, ...)
              except $ERROR:
                ...
          - pattern-not-inside: |
              try:
                $LIB.compile($PATTERN, ...)
              except $ERROR as $E:
                ...
          - metavariable-regex: {metavariable: $FUNC, regex: ^(compile|search|match|fullmatch|findall|finditer|sub|subn|split)$}
          - focus-metavariable: $PATTERN

  - id: codewatch.python.web.log-injection
    mode: taint
    languages: [python]
    severity: INFO
    message: >-
      Data from the HTTP request is written to the log as it is, so a value with line breaks can forge log
      entries in a plain-text log. Strip or escape CR and LF first (or log repr(value)).
    # For review: whether a forged line matters depends on the log format (JSON logs escape it) and who reads it.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: Request data written to the log unescaped
      cwe: ["CWE-117: Improper Output Neutralization for Logs"]
      owasp: ["A09:2025 - Security Logging and Alerting Failures"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *checked-inside
      - *known-safe
      - *lookup-result
      - pattern: repr(...)
      - pattern: json.dumps(...)
      - patterns:
          - pattern: $S.replace($NL, ...)
          - metavariable-regex: {metavariable: $NL, regex: '\\[rn]'}
    # The message itself, or a later argument that a %s in a literal format string inserts as it is (%r and %d
    # don't let a line break through).
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: logging.$LEVEL($MSG, ...)
              - patterns:
                  - pattern: $LOGGER.$LEVEL($MSG, ...)
                  - metavariable-regex: &logger-name {metavariable: $LOGGER, regex: '(?i)^(.*\.)?_?(log|logger|logging|\w+_log(ger)?)$'}
          - metavariable-regex: &log-level {metavariable: $LEVEL, regex: ^(debug|info|warning|warn|error|critical|exception|fatal)$}
          - focus-metavariable: $MSG
      - patterns:
          - pattern-either:
              - pattern: logging.$LEVEL("$FMT", ..., $ARG, ...)
              - patterns:
                  - pattern: $LOGGER.$LEVEL("$FMT", ..., $ARG, ...)
                  - metavariable-regex: *logger-name
          - metavariable-regex: *log-level
          - metavariable-regex: {metavariable: $FMT, regex: '%-?\d*s'}
          - focus-metavariable: $ARG

  - id: codewatch.python.web.open-redirect-path
    mode: taint
    languages: [python]
    severity: INFO
    message: >-
      The redirect target is built from the request's own path. That stays on this site unless the path can
      start with "//" (a request for "//evil.example/..." becomes a redirect to another host): check that the
      URL patterns can't match such a path, or collapse repeated slashes first.
    # For review: whether "//host" can reach this view depends on the URL configuration.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: Redirect built from the request path
      interprocedural: false
      cwe: ["CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"]
      owasp: ["A01:2025 - Broken Access Control"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
    pattern-sources:
      - *request-path
    pattern-sanitizers:
      - *validated-guard
      - *checked-inside
      - *checked-or-replaced
      - *known-safe
      - *lookup-result
      - patterns:
          - pattern: re.sub($PATTERN, "/", ...)
          - metavariable-regex: {metavariable: $PATTERN, regex: '^r?[''"]/(\{2,\}|/\+|\+)[''"]$'}
    pattern-sinks: *redirect-sinks

  - id: codewatch.python.web.unrestricted-upload
    mode: taint
    languages: [python]
    severity: WARNING
    message: >-
      An uploaded file is stored under the name the client sent, extension included, and nothing checks the
      type. An .html, .svg or script file served back from this site runs as part of it. Check the extension
      against an allowlist, or store the file under a generated name with an extension you choose.
    # For review: harmless if the folder is never served or executed; secure_filename() stops "../" only.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: Upload stored under the client's file name
      interprocedural: false
      cwe: ["CWE-434: Unrestricted Upload of File with Dangerous Type"]
      owasp: ["A06:2025 - Insecure Design"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html
        - https://flask.palletsprojects.com/en/stable/patterns/fileuploads/
    pattern-sources:
      - pattern-either:
          - pattern: request.files[$KEY].filename
          - pattern: request.files.get(...).filename
          - pattern: flask.request.files[$KEY].filename
          - pattern: flask.request.files.get(...).filename
          - pattern: request.FILES[$KEY].name
          - pattern: request.FILES.get(...).name
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $F = request.files[$KEY]
                  ...
              - pattern-inside: |
                  $F = request.files.get(...)
                  ...
              - pattern-inside: |
                  for $F in request.files.getlist(...):
                    ...
              - pattern-inside: |
                  for $F in request.files.values():
                    ...
          - pattern: $F.filename
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $F = request.FILES[$KEY]
                  ...
              - pattern-inside: |
                  $F = request.FILES.get(...)
                  ...
              - pattern-inside: |
                  for $F in request.FILES.getlist(...):
                    ...
          - pattern: $F.name
      # FastAPI / Starlette: def upload(file: UploadFile = File(...))
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  def $H(..., $F: UploadFile, ...):
                    ...
              - pattern-inside: |
                  async def $H(..., $F: UploadFile, ...):
                    ...
              - pattern-inside: |
                  def $H(..., $F: UploadFile = $DEFAULT, ...):
                    ...
              - pattern-inside: |
                  async def $H(..., $F: UploadFile = $DEFAULT, ...):
                    ...
          - pattern: $F.filename
    pattern-sanitizers:
      - *known-safe
      - *lookup-result
      # Inside, or after, a check that looks at the name's extension or type: if allowed_file(f.filename): ...
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  if $COND:
                    ...
              - pattern-inside: |
                  if $COND:
                    ...
                    return ...
                  ...
              - pattern-inside: |
                  if $COND:
                    ...
                    raise ...
                  ...
              - pattern-inside: |
                  if $COND:
                    ...
                    abort(...)
                  ...
          - metavariable-regex:
              metavariable: $COND
              regex: '(?i).*(allow|permit|valid|ext|suffix|mime|content_type|image)'
      # Only the stem kept, so the stored file gets an extension the code chose.
      - pattern: os.path.splitext(...)[0]
      - pattern: pathlib.Path(...).stem
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $FILE.save($PATH, ...)
              - pattern: $STORAGE.save($PATH, ...)
              - pattern: open($PATH, "=~/[wax]/", ...)
              - pattern: open($PATH, mode="=~/[wax]/", ...)
              - pattern: aiofiles.open($PATH, "=~/[wax]/", ...)
              - pattern: shutil.copyfileobj($SRC, open($PATH, ...), ...)
              - pattern: shutil.move($SRC, $PATH)
              - pattern: shutil.copy($SRC, $PATH)
              - pattern: pathlib.Path($PATH).write_bytes(...)
          - focus-metavariable: $PATH

  - id: codewatch.python.web.stack-trace-exposure
    mode: taint
    languages: [python]
    severity: WARNING
    message: >-
      A stack trace is sent back in the response. It shows file paths, code and sometimes data to whoever made
      the request. Log it on the server and return a generic error message instead.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Stack trace sent in the response
      interprocedural: false
      cwe: ["CWE-209: Generation of Error Message Containing Sensitive Information"]
      owasp: ["A10:2025 - Mishandling of Exceptional Conditions"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: traceback.format_exc(...)
              - pattern: traceback.format_exception(...)
              - pattern: traceback.format_tb(...)
              - pattern: traceback.format_stack(...)
              - pattern: traceback.extract_tb(...)
          - pattern-not-inside: |
              if <... $X.debug ...>:
                ...
          - pattern-not-inside: |
              if <... $X.DEBUG ...>:
                ...
          - pattern-not-inside: |
              if <... DEBUG ...>:
                ...
    pattern-sinks: &error-response-sinks
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  def $VIEW(...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  async def $VIEW(...):
                    ...
          - metavariable-regex: {metavariable: $ROUTE, regex: ^(route|get|post|put|patch|delete|api_route|errorhandler)$}
          - pattern: return $BODY
          - focus-metavariable: $BODY
      - pattern-either:
          - pattern: flask.jsonify(...)
          - pattern: jsonify(...)
          - pattern: flask.make_response(...)
          - pattern: make_response(...)
          - pattern: flask.Response(...)
          - pattern: flask.abort(...)
          - pattern: abort(...)
          - pattern: django.http.HttpResponse(...)
          - pattern: django.http.JsonResponse(...)
          - pattern: django.http.HttpResponseServerError(...)
          - pattern: django.http.HttpResponseBadRequest(...)
          - pattern: starlette.responses.$RESPONSE(...)
          - pattern: fastapi.responses.$RESPONSE(...)
          - pattern: fastapi.HTTPException(...)
          - pattern: starlette.exceptions.HTTPException(...)
          - pattern: rest_framework.response.Response(...)

  - id: codewatch.python.web.exception-message-in-response
    mode: taint
    languages: [python]
    severity: INFO
    message: >-
      The text of an unexpected exception is sent back in the response. Messages from databases, file and
      network errors can show queries, paths, hosts or data. Log the exception and return a generic message.
    # For review: catching Exception means the message comes from anywhere; a specific exception's message is
    # usually written for the user and isn't reported.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: Exception message sent in the response
      interprocedural: false
      cwe: ["CWE-209: Generation of Error Message Containing Sensitive Information"]
      owasp: ["A10:2025 - Mishandling of Exceptional Conditions"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  try:
                    ...
                  except Exception as $E:
                    ...
              - pattern-inside: |
                  try:
                    ...
                  except BaseException as $E:
                    ...
          - pattern: $E
          - pattern-not-inside: |
              if <... $X.debug ...>:
                ...
          - pattern-not-inside: |
              if <... $X.DEBUG ...>:
                ...
          - pattern-not-inside: |
              if <... DEBUG ...>:
                ...
    pattern-sanitizers:
      # The exception's class name says what failed without saying anything about the data.
      - pattern: type(...)
      - pattern: $E.__class__
    pattern-sinks: *error-response-sinks

  - id: codewatch.python.web.mass-assignment
    languages: [python]
    severity: WARNING
    message: >-
      Every field of the request body is passed to a model, so a client can also set fields the form never
      offers (is_admin, owner, price). Pass only the fields this view should change, or load the body through a
      serializer/schema that lists them.
    # For review: fine if the model has no field a client mustn't set.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: Whole request body assigned to a model
      cwe: ["CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes"]
      owasp: ["A08:2025 - Software or Data Integrity Failures"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Mass_Assignment_Cheat_Sheet.html
    patterns:
      # The body itself, or a variable holding it: not a dict built from chosen fields of it.
      - pattern-either:
          - patterns:
              - pattern-either: &py-model-writes
                  - patterns:
                      - pattern-either:
                          - pattern: $MODEL(..., **$DATA, ...)
                          - pattern: $MODEL.objects.$CREATE(..., **$DATA, ...)
                          - pattern: $MODEL.objects.$QUERY(...).update(..., **$DATA, ...)
                      - metavariable-regex: {metavariable: $MODEL, regex: '^[A-Z]\w*$'}
                  - pattern: $MODEL.query.$FILTER(...).update($DATA, ...)
                  - pattern: |
                      for $K, $V in $DATA.items():
                        ...
                        setattr($OBJ, $K, $V)
              - metavariable-regex: &whole-body
                  metavariable: $DATA
                  regex: '^(request\.(json|form|values|POST|data)|request\.(get_json|form\.to_dict|POST\.dict)\(.*\)|json\.loads\(request\.(body|data)\))$'
          - patterns:
              - pattern-either: *py-model-writes
              - pattern-inside: |
                  $DATA = $BODY
                  ...
              - metavariable-regex:
                  <<: *whole-body
                  metavariable: $BODY
      - focus-metavariable: $DATA

  - id: codewatch.python.web.template-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request is compiled as a template, so a user can write template code
      ({{ ''.__class__.__mro__ }}...) that runs on the server. Pass request data as a template variable,
      never as the template text; if users must write templates, use jinja2's SandboxedEnvironment.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data compiled as a server-side template
      cwe: ["CWE-1336: Improper Neutralization of Special Elements Used in a Template Engine"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://portswigger.net/web-security/server-side-template-injection
        - https://jinja.palletsprojects.com/en/stable/sandbox/
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *checked-inside
      - *known-safe
      - *lookup-result
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: jinja2.Template($TEMPLATE, ...)
              - pattern: jinja2.Environment(...).from_string($TEMPLATE, ...)
              - pattern: flask.render_template_string($TEMPLATE, ...)
              - pattern: render_template_string($TEMPLATE, ...)
              - pattern: mako.template.Template($TEMPLATE, ...)
              - pattern: django.template.Template($TEMPLATE, ...)
              - pattern: django.template.Engine(...).from_string($TEMPLATE)
              - pattern: django.template.engines[$NAME].from_string($TEMPLATE)
              - pattern: tornado.template.Template($TEMPLATE, ...)
              - patterns:
                  - pattern: $ENV.from_string($TEMPLATE, ...)
                  - pattern-not-inside: |
                      $ENV = jinja2.sandbox.SandboxedEnvironment(...)
                      ...
          - focus-metavariable: $TEMPLATE

  - id: codewatch.python.web.cors-any-origin-with-credentials
    languages: [python]
    severity: ERROR
    message: >-
      CORS is set up to accept any origin and to allow credentials, so the library echoes back whatever
      Origin the browser sends: any website can make logged-in requests to this API and read the answers.
      List the origins that may call it.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Any origin allowed together with credentials
      cwe: ["CWE-942: Permissive Cross-domain Security Policy with Untrusted Domains"]
      owasp: ["A02:2025 - Security Misconfiguration"]
      references:
        - https://portswigger.net/web-security/cors
        - https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html#cross-origin-resource-sharing
    pattern-either:
      # flask-cors: origins default to "*", which it reflects when credentials are on.
      - patterns:
          - pattern-either:
              - pattern: flask_cors.CORS(..., supports_credentials=True, ...)
              - pattern: flask_cors.cross_origin(..., supports_credentials=True, ...)
          - pattern-not: flask_cors.CORS(..., origins=$ORIGINS, ...)
          - pattern-not: flask_cors.CORS(..., resources=$RESOURCES, ...)
          - pattern-not: flask_cors.cross_origin(..., origins=$ORIGINS, ...)
      - pattern: flask_cors.CORS(..., supports_credentials=True, ..., origins="*", ...)
      - pattern: flask_cors.CORS(..., origins="*", ..., supports_credentials=True, ...)
      - pattern: flask_cors.cross_origin(..., supports_credentials=True, ..., origins="*", ...)
      - pattern: flask_cors.cross_origin(..., origins="*", ..., supports_credentials=True, ...)
      # Starlette / FastAPI: allow_origins=["*"] with credentials echoes the request's Origin.
      - patterns:
          - pattern: $APP.add_middleware($MIDDLEWARE, ..., allow_credentials=True, ...)
          - pattern-either:
              - pattern: $APP.add_middleware($MIDDLEWARE, ..., allow_origins=["*"], ...)
              - pattern: $APP.add_middleware($MIDDLEWARE, ..., allow_origin_regex="=~/^\.[*+]$/", ...)
      # django-cors-headers settings.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  CORS_ALLOW_CREDENTIALS = True
                  ...
              - pattern-inside: |
                  $ALL = True
                  ...
                  CORS_ALLOW_CREDENTIALS = True
          - pattern-either:
              - pattern: CORS_ALLOW_ALL_ORIGINS = True
              - pattern: CORS_ORIGIN_ALLOW_ALL = True
      # By hand: the request's Origin echoed on a response that also allows credentials.
      - patterns:
          - pattern-either:
              - pattern: |
                  $RESP.headers[$ACAO] = <... $REQ.headers.get($ORIGIN, ...) ...>
                  ...
                  $RESP.headers[$ACAC] = $TRUE
              - pattern: |
                  $RESP.headers[$ACAC] = $TRUE
                  ...
                  $RESP.headers[$ACAO] = <... $REQ.headers.get($ORIGIN, ...) ...>
              - pattern: |
                  $RESP[$ACAO] = <... $REQ.headers.get($ORIGIN, ...) ...>
                  ...
                  $RESP[$ACAC] = $TRUE
              - pattern: |
                  $RESP[$ACAC] = $TRUE
                  ...
                  $RESP[$ACAO] = <... $REQ.headers.get($ORIGIN, ...) ...>
          - metavariable-regex: {metavariable: $ACAO, regex: '(?i)^[''"]access-control-allow-origin[''"]$'}
          - metavariable-regex: {metavariable: $ACAC, regex: '(?i)^[''"]access-control-allow-credentials[''"]$'}
          - metavariable-regex: {metavariable: $ORIGIN, regex: '(?i)^[''"](http_)?origin[''"]$'}
          - metavariable-regex: {metavariable: $TRUE, regex: '(?i)^([''"]true[''"]|True)$'}

  - id: codewatch.python.timing-unsafe-signature-check
    languages: [python]
    severity: WARNING
    message: >-
      An HMAC or signature is compared with == or !=, which stops at the first differing character: by timing
      responses an attacker can guess a valid signature byte by byte. Compare with hmac.compare_digest().
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Signature compared in variable time
      cwe: ["CWE-208: Observable Timing Discrepancy"]
      owasp: ["A04:2025 - Cryptographic Failures"]
      references:
        - https://docs.python.org/3/library/hmac.html#hmac.compare_digest
    patterns:
      - pattern-either:
          - pattern: $A == $B
          - pattern: $A != $B
      - pattern-either:
          - pattern: <... hmac.new(...) ...> == $B
          - pattern: $A == <... hmac.new(...) ...>
          - pattern: <... hmac.new(...) ...> != $B
          - pattern: $A != <... hmac.new(...) ...>
          - patterns:
              - pattern-inside: |
                  $MAC = <... hmac.new(...) ...>
                  ...
              - pattern-either:
                  - pattern: $MAC == $B
                  - pattern: $A == $MAC
                  - pattern: $MAC != $B
                  - pattern: $A != $MAC
      # Comparing lengths or against a constant (an empty value) leaks nothing about the secret.
      - pattern-not: len(...) == $B
      - pattern-not: $A == len(...)
      - pattern-not: $A == "..."
      - pattern-not: $A == None

  - id: codewatch.python.web.route-without-login
    languages: [python]
    severity: WARNING
    message: >-
      This view accepts {POST/PUT/PATCH/DELETE} but has no login decorator, while other views in the same module
      do. Check that anonymous users may really call it; if not, add the same decorator here.
    # For review: some views are meant to be public; one missing decorator in a protected module often isn't.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: Changing view without the login check other views use
      cwe: ["CWE-306: Missing Authentication for Critical Function"]
      owasp: ["A07:2025 - Authentication Failures"]
      references:
        - https://flask-login.readthedocs.io/en/latest/#flask_login.login_required
    patterns:
      - pattern: |
          @$APP.$ROUTE($PATH, ..., methods=$METHODS, ...)
          def $F(...):
            ...
      - metavariable-regex: {metavariable: $ROUTE, regex: '^route$'}
      - metavariable-regex: {metavariable: $METHODS, regex: '(?i).*(post|put|patch|delete)'}
      # Sign-up as POST to the users collection is public by nature.
      - metavariable-regex: {metavariable: $PATH, regex: '^(?![''"]/(api/)?(v\d+/)?(users?|accounts?|members?)/?[''"]$)'}
      - metavariable-regex: {metavariable: $PATH, regex: '^(?!(?i:.*(login|logout|register|signup|sign_up|signin|forgot|reset|verify|confirm|activate|token|refresh|oauth|callback|webhook|public|health|status|contact|subscribe)))'}
      - pattern-not: |
          @login_required
          def $F(...):
            ...
      - pattern-not: |
          @$M.login_required
          def $F(...):
            ...
      - pattern-not: |
          @jwt_required(...)
          def $F(...):
            ...
      - pattern-not: |
          @$M.jwt_required(...)
          def $F(...):
            ...
      - pattern-not: |
          @fresh_jwt_required
          def $F(...):
            ...
      - pattern-not: |
          @roles_required(...)
          def $F(...):
            ...
      - pattern-not: |
          @roles_accepted(...)
          def $F(...):
            ...
      - pattern-not: |
          @$M.roles_required(...)
          def $F(...):
            ...
      - pattern-not: |
          @permission_required(...)
          def $F(...):
            ...
      - pattern-not: |
          @$M.permission_required(...)
          def $F(...):
            ...
      - pattern-not: |
          @admin_required
          def $F(...):
            ...
      - pattern-not: |
          @token_required
          def $F(...):
            ...
      - pattern-not: |
          @requires_auth
          def $F(...):
            ...
      - pattern-not: |
          @auth_required
          def $F(...):
            ...
      - pattern-not: |
          @$M.auth_required
          def $F(...):
            ...
      - pattern-not: |
          @auth_required(...)
          def $F(...):
            ...
      - pattern-not: |
          @$M.auth_required(...)
          def $F(...):
            ...
      - pattern-not: |
          @login_required(...)
          def $F(...):
            ...
      - pattern-not: |
          @$M.login_required(...)
          def $F(...):
            ...
      - pattern-not: |
          @$M.verify_token
          def $F(...):
            ...
      - pattern-not: |
          @$M.verify_password
          def $F(...):
            ...
      - pattern-not: |
          @$M.require(...)
          def $F(...):
            ...
      # Another view in this module has a login decorator.
      - pattern-either:
          - pattern-inside: |
              @$AUTH
              def $G(...):
                ...
              ...
          - pattern-inside: |
              @$AUTH(...)
              def $G(...):
                ...
              ...
          - pattern-inside: |
              @$APP.$ROUTE($PATH, ..., methods=$METHODS, ...)
              def $F(...):
                ...
              ...
              @$AUTH
              def $G(...):
                ...
          - pattern-inside: |
              @$APP.$ROUTE($PATH, ..., methods=$METHODS, ...)
              def $F(...):
                ...
              ...
              @$AUTH(...)
              def $G(...):
                ...
      - metavariable-regex: {metavariable: $AUTH, regex: '(?i)(.*\.)?(login_required|jwt_required|fresh_jwt_required|roles_required|roles_accepted|permission_required|admin_required|token_required|requires_auth|auth_required)$'}
      - focus-metavariable: $F

  - id: codewatch.python.cookie-protection-off
    languages: [python]
    severity: INFO
    message: >-
      Cookie protection is switched off here: without HttpOnly any injected script can read the cookie, without
      Secure it travels over plain HTTP, and SameSite=None sends it on cross-site requests. Keep the defaults
      (HttpOnly, Secure in production, SameSite=Lax) for session and CSRF cookies.
    # For review: Secure off is common in development settings; SameSite=None is needed for some embeds.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: Cookie protection switched off
      cwe: ["CWE-1004: Sensitive Cookie Without 'HttpOnly' Flag", "CWE-1275: Sensitive Cookie with Improper SameSite Attribute"]
      owasp: ["A02:2025 - Security Misconfiguration"]
      references:
        - https://docs.djangoproject.com/en/stable/ref/settings/#session-cookie-httponly
        - https://flask.palletsprojects.com/en/stable/config/#SESSION_COOKIE_HTTPONLY
    pattern-either:
      - pattern: $RESP.set_cookie(..., httponly=False, ...)
      - pattern: $RESP.set_cookie(..., samesite="None", ...)
      - pattern: $RESP.set_cookie(..., samesite=None, ...)
      - patterns:
          - pattern: $SETTING = False
          - metavariable-regex: {metavariable: $SETTING, regex: '^SESSION_COOKIE_HTTPONLY$'}
      - patterns:
          - pattern: $SETTING = "None"
          - metavariable-regex: {metavariable: $SETTING, regex: '^(SESSION_COOKIE_SAMESITE|CSRF_COOKIE_SAMESITE)$'}
      - patterns:
          - pattern: $CONFIG[$SETTING] = False
          - metavariable-regex: {metavariable: $SETTING, regex: '^[''"]SESSION_COOKIE_HTTPONLY[''"]$'}
