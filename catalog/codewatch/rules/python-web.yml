# codewatch built-in rules for Python web code (Flask, Django, FastAPI, Starlette).
# Taint rules report a vulnerability only when data from the HTTP request reaches a dangerous call, so plain use
# of an API is left to the hotspot rules. Shared pieces are YAML anchors.
rules:
  - id: codewatch.python.web.command-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request reaches a shell or process command, so a user can run their own commands.
      Pass arguments as a list without a shell, validate them against an allowlist, or quote with shlex.quote().
    metadata: &meta-command
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data used in an OS command
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
        - https://docs.python.org/3/library/subprocess.html#security-considerations
    pattern-sources: &web-sources
      - pattern: flask.request
      # A view's request, not a local such as `request = urllib.request.Request(url)`.
      - patterns:
          - pattern: request
          - pattern-not-inside: |
              request = $MAKE(...)
              ...
      - pattern: starlette.requests.Request
    pattern-propagators: &propagators
      - {pattern: '$TO.append($FROM)', from: $FROM, to: $TO}
      - {pattern: '$TO.extend($FROM)', from: $FROM, to: $TO}
      - {pattern: '$TO.insert($I, $FROM)', from: $FROM, to: $TO}
      - {pattern: '$TO.add($FROM)', from: $FROM, to: $TO}
      - {pattern: '$TO.update($FROM)', from: $FROM, to: $TO}
      - {pattern: '$TO.set($SECTION, $KEY, $FROM)', from: $FROM, to: $TO}
      - {pattern: '$TO.put($FROM)', from: $FROM, to: $TO}
      - {pattern: '$TO.write($FROM)', from: $FROM, to: $TO}
    # Shared: data counts as validated after an `if` that checks its content and returns or raises.
    pattern-sanitizers:
      - &validated-guard
        patterns:
          - pattern-either:
              - pattern-inside: |
                  if <... $X.startswith(...) ...>:
                    ...
                    return ...
                  ...
              - pattern-inside: |
                  if <... $X.startswith(...) ...>:
                    ...
                    raise ...
                  ...
              - pattern-inside: |
                  if <... $X.endswith(...) ...>:
                    ...
                    return ...
                  ...
              - pattern-inside: |
                  if <... $X.endswith(...) ...>:
                    ...
                    raise ...
                  ...
              - pattern-inside: |
                  if <... $X.isalnum() ...>:
                    ...
                    return ...
                  ...
              - pattern-inside: |
                  if <... $X.isalnum() ...>:
                    ...
                    raise ...
                  ...
              - pattern-inside: |
                  if <... $X.isdigit() ...>:
                    ...
                    return ...
                  ...
              - pattern-inside: |
                  if <... $X.isdigit() ...>:
                    ...
                    raise ...
                  ...
              - pattern-inside: |
                  if <... $X.isidentifier() ...>:
                    ...
                    return ...
                  ...
              - pattern-inside: |
                  if <... $X.isidentifier() ...>:
                    ...
                    raise ...
                  ...
              - pattern-inside: |
                  if <... re.match(..., $X, ...) ...>:
                    ...
                    return ...
                  ...
              - pattern-inside: |
                  if <... re.match(..., $X, ...) ...>:
                    ...
                    raise ...
                  ...
              - pattern-inside: |
                  if <... re.fullmatch(..., $X, ...) ...>:
                    ...
                    return ...
                  ...
              - pattern-inside: |
                  if <... re.fullmatch(..., $X, ...) ...>:
                    ...
                    raise ...
                  ...
              - pattern-inside: |
                  if <... $X in $ALLOWED ...>:
                    ...
                    return ...
                  ...
              - pattern-inside: |
                  if <... $X in $ALLOWED ...>:
                    ...
                    raise ...
                  ...
              - pattern-inside: |
                  if <... $X not in $ALLOWED ...>:
                    ...
                    return ...
                  ...
              - pattern-inside: |
                  if <... $X not in $ALLOWED ...>:
                    ...
                    raise ...
                  ...
              - pattern-inside: |
                  if <... url_has_allowed_host_and_scheme($X, ...) ...>:
                    ...
                    return ...
                  ...
              - pattern-inside: |
                  if <... url_has_allowed_host_and_scheme($X, ...) ...>:
                    ...
                    raise ...
                  ...
              - pattern-inside: |
                  $URL = urllib.parse.urlparse($X)
                  ...
                  if <... $URL.$PART ...>:
                    ...
                    return ...
                  ...
              - pattern-inside: |
                  $URL = urllib.parse.urlparse($X)
                  ...
                  if <... $URL.$PART ...>:
                    ...
                    raise ...
                  ...
              - pattern-inside: |
                  try:
                    ...
                    $URL = urllib.parse.urlparse($X)
                    ...
                    if <... $URL.$PART ...>:
                      ...
                      return ...
                    ...
                  except $EXC:
                    ...
                  ...
              - pattern-inside: |
                  try:
                    ...
                    $URL = urllib.parse.urlparse($X)
                    ...
                    if <... $URL.$PART ...>:
                      ...
                      return ...
                    ...
                  except:
                    ...
                  ...
              # A resolved path checked against its base directory: if not str(p).startswith(str(base)): return
              - pattern-inside: |
                  if <... str($X).startswith(...) ...>:
                    ...
                    return ...
                  ...
              - pattern-inside: |
                  if <... str($X).startswith(...) ...>:
                    ...
                    raise ...
                  ...
              - pattern-inside: |
                  if <... $X.is_relative_to(...) ...>:
                    ...
                    return ...
                  ...
              - pattern-inside: |
                  if <... $X.is_relative_to(...) ...>:
                    ...
                    raise ...
                  ...
              # A failed check that replaces the value: if urlsplit(next).netloc != "": next = url_for("index")
              - pattern-inside: |
                  if <... urllib.parse.urlsplit($X).$PART ...>:
                    ...
                    $X = $SAFE
                  ...
              - pattern-inside: |
                  if <... urllib.parse.urlparse($X).$PART ...>:
                    ...
                    $X = $SAFE
                  ...
              # A forbidden-character check that bails out: if "'" in name: return ...
              - pattern-inside: |
                  if <... "..." in $X ...>:
                    ...
                    return ...
                  ...
              - pattern-inside: |
                  if <... "..." in $X ...>:
                    ...
                    raise ...
                  ...
              # ...or used only inside the branch where an allowlist check passed.
              - pattern-inside: |
                  if <... url_has_allowed_host_and_scheme($X, ...) ...>:
                    ...
              - pattern-inside: |
                  if <... $X in $ALLOWED ...>:
                    ...
          - pattern: $X
      # Shared: functions named as validators (safe_next, validate_url, sanitize_path, clean_*) return checked
      # data, taken at face value since the analysis doesn't look inside them; and request.path in a route with
      # no variable parts, whose value routing has already fixed.
      - &known-safe
        pattern-either:
          - patterns:
              - pattern: $CHECK(...)
              - metavariable-regex: {metavariable: $CHECK, regex: '(?i)(.*\.)?((get_|make_|to_)?safe|valid|sanitiz|clean|is_allowed)\w{0,40}$'}
          # Numbers can't carry markup, paths or quotes; url_for() only builds links to this app's own routes.
          - pattern: int(...)
          - pattern: float(...)
          - pattern: bool(...)
          - pattern: len(...)
          - pattern: flask.url_for(...)
          - pattern: url_for(...)
          - patterns:
              - pattern: request.$PART.get(..., type=$NUMERIC, ...)
              - metavariable-regex: {metavariable: $NUMERIC, regex: ^(int|float|bool)$}
          - patterns:
              - pattern-either:
                  - pattern: flask.request.path
                  - pattern: request.path
              - pattern-inside: |
                  @$APP.route("$ROUTE", ...)
                  def $VIEW(...):
                    ...
              - metavariable-regex: {metavariable: $ROUTE, regex: '^[^<]*$'}
      - pattern: shlex.quote(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: subprocess.$FUNC($CMD, ...)
              - pattern: os.system($CMD)
              - pattern: os.popen($CMD, ...)
              - patterns:
                  - pattern: os.$EXEC($CMD, ...)
                  - metavariable-regex: {metavariable: $EXEC, regex: '^(exec[lv]p?e?|spawn[lv]p?e?)$'}
          - focus-metavariable: $CMD

  - id: codewatch.python.web.code-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request is evaluated as Python code. Never pass user input to eval/exec/compile;
      use ast.literal_eval for literals or an explicit mapping of allowed operations.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data evaluated as code
      cwe: ["CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://docs.python.org/3/library/functions.html#eval
        - https://owasp.org/www-community/attacks/Code_Injection
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *known-safe
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($CODE, ...)
              - pattern: exec($CODE, ...)
              - pattern: compile($CODE, ...)
          - focus-metavariable: $CODE

  - id: codewatch.python.web.sql-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request is built into an SQL statement. Use query parameters
      (cursor.execute(sql, params), the ORM, or sqlalchemy.text() with bound parameters) instead of string formatting.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data built into SQL
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Query_Parameterization_Cheat_Sheet.html
        - https://docs.djangoproject.com/en/stable/topics/db/sql/#passing-parameters-into-raw
        - https://peps.python.org/pep-0249/
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *known-safe
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CUR.execute($SQL, ...)
              - pattern: $CUR.executemany($SQL, ...)
              - pattern: $CUR.executescript($SQL)
              - pattern: $MODEL.objects.raw($SQL, ...)
              - pattern: $QS.extra(where=$SQL, ...)
              - pattern: sqlalchemy.text($SQL)
          - focus-metavariable: $SQL

  - id: codewatch.python.web.path-traversal
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request is used in a file path, so "../" can reach files outside the intended directory.
      Use werkzeug.utils.secure_filename / os.path.basename, or resolve the path and check it stays inside the base.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data used in a file path
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"]
      owasp: ["A01:2025 - Broken Access Control"]
      references:
        - https://owasp.org/www-community/attacks/Path_Traversal
        - https://werkzeug.palletsprojects.com/en/stable/utils/#werkzeug.utils.secure_filename
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *known-safe
      - pattern: os.path.basename(...)
      - pattern: pathlib.Path(...).name
      - pattern: pathlib.Path(...).stem
      - pattern: pathlib.PurePath(...).name
      - pattern: pathlib.PurePath(...).stem
      - pattern: werkzeug.utils.secure_filename(...)
      - pattern: secure_filename(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: open($PATH, ...)
              - pattern: io.open($PATH, ...)
              - pattern: codecs.open($PATH, ...)
              - pattern: os.open($PATH, ...)
              - pattern: pathlib.Path($PATH, ...)
              - pattern: os.remove($PATH)
              - pattern: os.unlink($PATH)
              - pattern: os.rename($PATH, ...)
              - pattern: os.listdir($PATH)
              - pattern: os.path.exists($PATH)
              - pattern: os.path.isfile($PATH)
              - pattern: os.path.isdir($PATH)
              - pattern: os.stat($PATH)
              # A pathlib.Path built from request data, used once it's built: (base / name).read_text()
              - patterns:
                  - pattern: $PATH.$USE(...)
                  - metavariable-regex:
                      metavariable: $USE
                      regex: ^(exists|is_file|is_dir|stat|open|read_text|read_bytes|write_text|write_bytes|unlink|rmdir|mkdir|touch|rename|replace|iterdir|glob|rglob|chmod)$
                  - metavariable-pattern:
                      metavariable: $PATH
                      pattern-either: &pathlib-value
                        - pattern: pathlib.Path(...)
                        - pattern: pathlib.PurePath(...)
                        - pattern: pathlib.Path(...) / $NAME
                        - pattern: (pathlib.Path(...) / $NAME).resolve(...)
                        - pattern: pathlib.Path(...).joinpath(...)
                        - pattern: $BASE / $NAME
                        - pattern: ($BASE / $NAME).resolve(...)
                        - pattern: $BASE.joinpath(...)
              - patterns:
                  - pattern: $PATH.$USE(...)
                  - metavariable-regex:
                      metavariable: $USE
                      regex: ^(exists|is_file|is_dir|stat|open|read_text|read_bytes|write_text|write_bytes|unlink|rmdir|mkdir|touch|rename|replace|iterdir|glob|rglob|chmod)$
                  - pattern-inside: |
                      $PATH = $INIT
                      ...
                  - metavariable-pattern:
                      metavariable: $INIT
                      pattern-either: *pathlib-value
              - pattern: shutil.$OP($PATH, ...)
              - pattern: flask.send_file($PATH, ...)
              - pattern: send_file($PATH, ...)
              - pattern: django.http.FileResponse(open($PATH, ...), ...)
          - focus-metavariable: $PATH

  - id: codewatch.python.web.xss
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request is written into an HTML response without escaping. Render it through an
      auto-escaping template, or escape it with html.escape()/markupsafe.escape() first.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data in an HTML response without escaping
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
        - https://flask.palletsprojects.com/en/stable/web-security/#cross-site-scripting-xss
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *known-safe
      - pattern: html.escape(...)
      - pattern: markupsafe.escape(...)
      - pattern: flask.escape(...)
      - pattern: django.utils.html.escape(...)
      - pattern: bleach.clean(...)
      - pattern: flask.jsonify(...)
      - pattern: jsonify(...)
      - pattern: json.dumps(...)
      # Jinja templates escape what they're given; redirect() escapes the URL in its body.
      - pattern: flask.render_template(...)
      - pattern: render_template(...)
      - pattern: flask.redirect(...)
      - pattern: redirect(...)
      - pattern: url_for(...)
      - pattern: flask.url_for(...)
      # Project helpers named like escape_html / html_escape are treated as escaping functions.
      - patterns:
          - pattern: $ESCAPE(...)
          - metavariable-regex: {metavariable: $ESCAPE, regex: '(?i).*escape\w{0,30}$'}
    pattern-sinks:
      # A (body, status, headers) tuple: only the body is rendered; header values can't inject markup.
      - patterns:
          - pattern-inside: |
              @$APP.route(...)
              def $VIEW(...):
                ...
          - pattern-either:
              - patterns:
                  - pattern: return $BODY
                  - pattern-not: return ($FIRST, $SECOND, ...)
              - pattern: return ($BODY, $SECOND, ...)
          # Flask serves a returned dict or list as JSON.
          - pattern-not: return {...}
          - pattern-not: return [...]
          - pattern-not: return ({...}, ...)
          - pattern-not: return ([...], ...)
          # Returning a response object built earlier: its body was checked where it was built (sinks below).
          - pattern-not-inside: |
              $BODY = make_response(...)
              ...
          - pattern-not-inside: |
              $BODY = flask.make_response(...)
              ...
          - pattern-not-inside: |
              $BODY = flask.Response(...)
              ...
          - focus-metavariable: $BODY
      - patterns:
          - pattern-either:
              - pattern: flask.make_response(($BODY, $SECOND, ...), ...)
              - pattern: make_response(($BODY, $SECOND, ...), ...)
          - focus-metavariable: $BODY
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: flask.make_response($BODY, ...)
                      - pattern: make_response($BODY, ...)
                  - pattern-not: flask.make_response(($FIRST, $SECOND, ...), ...)
                  - pattern-not: make_response(($FIRST, $SECOND, ...), ...)
              - pattern: flask.Response($BODY, ...)
              - pattern: flask.render_template_string($BODY, ...)
              - pattern: render_template_string($BODY, ...)
              - pattern: markupsafe.Markup($BODY)
              - pattern: django.http.HttpResponse($BODY, ...)
              - pattern: django.utils.safestring.mark_safe($BODY)
              - pattern: mark_safe($BODY)
          - focus-metavariable: $BODY

  - id: codewatch.python.web.xpath-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request is built into an XPath query. Pass it as an XPath variable
      (e.g. tree.xpath("//user[@name=$name]", name=value)) instead of formatting it into the query.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data built into XPath
      cwe: ["CWE-643: Improper Neutralization of Data within XPath Expressions ('XPath Injection')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://owasp.org/www-community/attacks/XPATH_Injection
        - https://lxml.de/xpathxslt.html#the-xpath-method
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *known-safe
      # Replacing the quote that delimits the value (' -> &apos;) stops it from closing the XPath string.
      - patterns:
          - pattern: $X.replace($QUOTE, ...)
          - metavariable-regex: {metavariable: $QUOTE, regex: '^["'']\\?["'']["'']$'}
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: lxml.etree.XPath($QUERY, ...)
              - pattern: lxml.etree.ETXPath($QUERY, ...)
              - pattern: $TREE.xpath($QUERY, ...)
              - pattern: elementpath.select($ROOT, $QUERY, ...)
              - pattern: $TREE.findall($QUERY, ...)
              - pattern: $TREE.find($QUERY, ...)
          - focus-metavariable: $QUERY

  - id: codewatch.python.web.ldap-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request is built into an LDAP search filter. Escape it with
      ldap3.utils.conv.escape_filter_chars() (or ldap.filter.escape_filter_chars) first.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data built into an LDAP filter
      cwe: ["CWE-90: Improper Neutralization of Special Elements used in an LDAP Query ('LDAP Injection')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/LDAP_Injection_Prevention_Cheat_Sheet.html
        - https://ldap3.readthedocs.io/en/latest/searches.html
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *known-safe
      - patterns:
          - pattern: $ESCAPE(...)
          - metavariable-regex: {metavariable: $ESCAPE, regex: '(?i).*escape'}
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CONN.search($BASE, $FILTER, ...)
              - pattern: $CONN.search(..., search_filter=$FILTER, ...)
              - pattern: $CONN.search_s($BASE, $SCOPE, $FILTER, ...)
              - pattern: $CONN.search_st($BASE, $SCOPE, $FILTER, ...)
              - pattern: $CONN.search_ext_s($BASE, $SCOPE, $FILTER, ...)
          # Only where an LDAP library is in use: Post.search(q, page) is an ORM method, not a directory query.
          - pattern-either:
              - pattern-inside: |
                  import ldap3
                  ...
              - pattern-inside: |
                  import ldap
                  ...
              - pattern-inside: |
                  from ldap3 import $NAME
                  ...
              - pattern-inside: |
                  from ldap import $NAME
                  ...
          - focus-metavariable: $FILTER

  - id: codewatch.python.web.open-redirect
    mode: taint
    languages: [python]
    severity: WARNING
    message: >-
      Data from the HTTP request decides where the user is redirected, so a link to this site can forward
      users to any other site. Redirect only to relative paths or an allowlist of hosts
      (Django: url_has_allowed_host_and_scheme).
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data used as a redirect target
      cwe: ["CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"]
      owasp: ["A01:2025 - Broken Access Control"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
        - https://docs.djangoproject.com/en/stable/ref/utils/#django.utils.http.url_has_allowed_host_and_scheme
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *known-safe
      # Back to the page the user came from: only the site that linked here chose it, so it can't send anyone
      # anywhere they weren't already.
      - pattern-either:
          - pattern: $REQ.referrer
          - pattern: $REQ.headers.get("Referer", ...)
          - pattern: $REQ.META.get("HTTP_REFERER", ...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: flask.redirect($URL, ...)
              - pattern: redirect($URL, ...)
              - pattern: django.http.HttpResponseRedirect($URL, ...)
              - pattern: django.http.HttpResponsePermanentRedirect($URL, ...)
              - pattern: starlette.responses.RedirectResponse($URL, ...)
          - focus-metavariable: $URL
      - patterns:
          - pattern-either:
              - pattern: $RESP.headers[$NAME] = $URL
              - pattern: $RESP[$NAME] = $URL
              - pattern: $HEADERS.add($NAME, $URL, ...)
              - pattern: $HEADERS.set($NAME, $URL, ...)
              - pattern: $HEADERS.setdefault($NAME, $URL)
          - metavariable-regex: {metavariable: $NAME, regex: '(?i)^[''"]location[''"]$'}
          - focus-metavariable: $URL
      - patterns:
          - pattern-either:
              - pattern: '$RESPONSE(..., headers={..., $NAME: $URL, ...}, ...)'
          - metavariable-regex: {metavariable: $NAME, regex: '(?i)^[''"]location[''"]$'}
          - focus-metavariable: $URL

  - id: codewatch.python.web.trust-boundary
    mode: taint
    languages: [python]
    severity: WARNING
    message: >-
      Unvalidated data from the HTTP request is stored in the server-side session, where later code will trust it.
      Validate it (type, range, allowlist) before storing it.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data stored in the session unvalidated
      cwe: ["CWE-501: Trust Boundary Violation"]
      owasp: ["A06:2025 - Insecure Design"]
      references:
        - https://cwe.mitre.org/data/definitions/501.html
        - https://flask.palletsprojects.com/en/stable/api/#sessions
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *known-safe
      # What a login or verification call returns is the checked identity, not the raw request value.
      - patterns:
          - pattern: $AUTH(...)
          - metavariable-regex: {metavariable: $AUTH, regex: '(?i)(.*\.)?(login|authenticate|verify_\w{1,30}|check_password)$'}
    pattern-sinks:
      - patterns:
          - pattern-either: &session-store
              - pattern: flask.session[$KEY] = $VALUE
              - pattern: session[$KEY] = $VALUE
              - pattern: $REQ.session[$KEY] = $VALUE
          - focus-metavariable: $KEY
      - patterns:
          - pattern-either: *session-store
          - focus-metavariable: $VALUE

  - id: codewatch.python.web.unsafe-deserialization
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request is deserialized with a loader that can run code (pickle, marshal, yaml.load
      without SafeLoader). Use JSON or yaml.safe_load for untrusted data.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data deserialized unsafely
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      owasp: ["A08:2025 - Software or Data Integrity Failures"]
      references:
        - https://docs.python.org/3/library/pickle.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *known-safe
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: pickle.loads($DATA, ...)
              - pattern: pickle.load($DATA, ...)
              - pattern: _pickle.loads($DATA, ...)
              - pattern: marshal.loads($DATA, ...)
              - pattern: shelve.open($DATA, ...)
              - pattern: jsonpickle.decode($DATA, ...)
              - pattern: dill.loads($DATA, ...)
              - patterns:
                  - pattern: yaml.load($DATA, ...)
                  - pattern-not: yaml.load($DATA, Loader=yaml.SafeLoader, ...)
                  - pattern-not: yaml.load($DATA, Loader=yaml.CSafeLoader, ...)
              - pattern: yaml.unsafe_load($DATA, ...)
          - focus-metavariable: $DATA

  - id: codewatch.python.web.weak-random-token
    mode: taint
    languages: [python]
    severity: WARNING
    message: >-
      A value from the non-cryptographic `random` module is used as a session or cookie value, so it can be
      predicted. Use the `secrets` module (secrets.token_urlsafe(), secrets.randbelow()).
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Predictable random value used as a token
      cwe: ["CWE-330: Use of Insufficiently Random Values"]
      owasp: ["A04:2025 - Cryptographic Failures"]
      references:
        - https://docs.python.org/3/library/random.html
        - https://docs.python.org/3/library/secrets.html
    pattern-sources:
      - patterns:
          - pattern: random.$FUNC(...)
          - metavariable-regex: {metavariable: $FUNC, regex: '^(?!SystemRandom$)\w{1,40}$'}
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *known-safe
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RESP.set_cookie($NAME, $VALUE, ...)
              - pattern: flask.session[$KEY] = $VALUE
              - pattern: session[$KEY] = $VALUE
              - pattern: $SESSION[$KEY] = $VALUE
          - focus-metavariable: $VALUE

  - id: codewatch.python.weak-hash
    languages: [python]
    severity: WARNING
    message: >-
      MD4, MD5 and SHA-1 are broken for security use. Use SHA-256 or better, or a password hash
      (hashlib.scrypt, argon2, Django's password hashers) for passwords. If this hash isn't used for security,
      pass usedforsecurity=False.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Weak hash algorithm
      security-purpose: required
      cwe: ["CWE-328: Use of Weak Hash"]
      owasp: ["A04:2025 - Cryptographic Failures"]
      references:
        - https://docs.python.org/3/library/hashlib.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          # Matches the value, so hashlib.new(ALGORITHM) with ALGORITHM = "sha1" counts too.
          - pattern: hashlib.new("=~/(?i)^(md4|md5|sha1|sha-1|md5-sha1|ripemd160)$/", ...)
      - pattern-not: hashlib.$F(..., usedforsecurity=False, ...)

  - id: codewatch.python.insecure-cookie
    languages: [python]
    severity: WARNING
    message: >-
      This cookie can be sent over plain HTTP, where it can be intercepted. Set secure=True
      (and httponly=True unless JavaScript needs it).
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Cookie without the Secure flag
      cwe: ["CWE-614: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute"]
      owasp: ["A02:2025 - Security Misconfiguration"]
      references:
        - https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies#restrict_access_to_cookies
        - https://flask.palletsprojects.com/en/stable/api/#flask.Response.set_cookie
    patterns:
      - pattern: $RESP.set_cookie(...)
      - pattern-not: $RESP.set_cookie(..., secure=True, ...)
      - pattern-not: $RESP.delete_cookie(...)
      # Clearing a cookie (empty value, already expired) sends nothing worth intercepting.
      - pattern-not: $RESP.set_cookie($NAME, "", ...)
      - pattern-not: $RESP.set_cookie(..., expires=0, ...)
      - pattern-not: $RESP.set_cookie(..., max_age=0, ...)

  - id: codewatch.python.xml-external-entities
    languages: [python]
    severity: ERROR
    message: >-
      External entity resolution is switched on for this XML parser, so if it ever parses a document someone else
      wrote, that document can read local files or make network requests (XXE). Leave it off, or parse untrusted
      XML with defusedxml.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: XML external entities enabled
      cwe: ["CWE-611: Improper Restriction of XML External Entity Reference"]
      owasp: ["A02:2025 - Security Misconfiguration"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html
        - https://docs.python.org/3/library/xml.html#xml-vulnerabilities
    pattern-either:
      - pattern: $P.setFeature(xml.sax.handler.feature_external_ges, True)
      - pattern: $P.setFeature(xml.sax.handler.feature_external_pes, True)
      - pattern: lxml.etree.XMLParser(..., resolve_entities=True, ...)
      - pattern: lxml.etree.XMLParser(..., no_network=False, ...)

  - id: codewatch.python.web.xxe
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Request data is parsed as XML by a parser that resolves external entities (switched on, or lxml's default
      before 5.0), so a crafted document can read local files or make network requests (XXE). Turn entity
      resolution off (XMLParser(resolve_entities=False)), or parse with defusedxml.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data parsed with XML external entities enabled
      cwe: ["CWE-611: Improper Restriction of XML External Entity Reference"]
      owasp: ["A02:2025 - Security Misconfiguration"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html
        - https://docs.python.org/3/library/xml.html#xml-vulnerabilities
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *known-safe
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $P.setFeature(xml.sax.handler.feature_external_ges, True)
                  ...
              - pattern-inside: |
                  $P.setFeature(xml.sax.handler.feature_external_pes, True)
                  ...
              - pattern-inside: |
                  $P = lxml.etree.XMLParser(..., resolve_entities=True, ...)
                  ...
              - pattern-inside: |
                  $P = lxml.etree.XMLParser(..., no_network=False, ...)
                  ...
          - pattern-either:
              - pattern: xml.dom.minidom.parseString($DATA, $P, ...)
              - pattern: xml.dom.minidom.parse($DATA, $P, ...)
              - pattern: xml.dom.pulldom.parseString($DATA, $P, ...)
              - pattern: xml.sax.parseString($DATA, ...)
              - pattern: $P.parse($DATA, ...)
              - pattern: $P.feed($DATA)
              - pattern: lxml.etree.fromstring($DATA, $P, ...)
              - pattern: lxml.etree.fromstring($DATA, parser=$P, ...)
              - pattern: lxml.etree.XML($DATA, $P, ...)
              - pattern: lxml.etree.XML($DATA, parser=$P, ...)
              - pattern: lxml.etree.parse($DATA, $P, ...)
              - pattern: lxml.etree.parse($DATA, parser=$P, ...)
          - focus-metavariable: $DATA
      # lxml's default parser resolved external entities until 5.0, and which lxml is installed isn't visible here.
      - patterns:
          - pattern-either:
              - pattern: lxml.etree.fromstring($DATA)
              - pattern: lxml.etree.XML($DATA)
              - pattern: lxml.etree.parse($DATA)
          - focus-metavariable: $DATA

  - id: codewatch.python.template-autoescape-disabled
    languages: [python]
    severity: ERROR
    message: >-
      HTML escaping is switched off for every template this environment renders, so any request data a template
      prints becomes markup and script (XSS). Use autoescape=True or jinja2.select_autoescape(), and mark the few
      trusted fragments safe one by one.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Template auto-escaping disabled
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://jinja.palletsprojects.com/en/stable/api/#autoescaping
        - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
    # Only an explicit autoescape=False for HTML: a bare jinja2.Environment() is also used for SQL, config and code
    # generation, where escaping would be wrong (bandit B701 still lists those for review).
    pattern-either:
      - pattern: aiohttp_jinja2.setup(..., autoescape=False, ...)
      - pattern: $APP.jinja_env.autoescape = False
      - pattern: '$APP.jinja_options = {..., "autoescape": False, ...}'
      - patterns:
          - pattern: jinja2.Environment(..., autoescape=False, ...)
          - pattern-either:
              - pattern: jinja2.Environment(..., loader=$LOADER, ...)
          - metavariable-pattern:
              metavariable: $LOADER
              pattern-either:
                - pattern: jinja2.PackageLoader(...)
                - pattern: jinja2.FileSystemLoader(...)

  - id: codewatch.python.web.ssrf
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request decides which URL the server fetches, so a user can make it call internal
      services or cloud metadata endpoints (SSRF). Build the URL from a fixed scheme and host, or check the host
      against an allowlist.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data used as a URL the server fetches
      cwe: ["CWE-918: Server-Side Request Forgery (SSRF)"]
      owasp: ["A01:2025 - Broken Access Control"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *known-safe
      # Only the path or query is user data when the scheme and host are fixed in front of it.
      - patterns:
          - pattern-either:
              - pattern: '"$PREFIX" + $X'
              - pattern: '"$PREFIX" % $X'
              - pattern: '"$PREFIX".format(...)'
          - metavariable-regex: {metavariable: $PREFIX, regex: '^[''"]?https?://[^/''"{%]+/'}
      - patterns:
          - pattern: $URL
          - metavariable-pattern:
              metavariable: $URL
              patterns:
                - pattern: f"..."
                - pattern-regex: '^f[''"]https?://[^/{''"]+/'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: requests.$METHOD($URL, ...)
              - pattern: httpx.$METHOD($URL, ...)
          - metavariable-regex: {metavariable: $METHOD, regex: ^(get|post|put|patch|delete|head|options|stream)$}
          - focus-metavariable: $URL
      - patterns:
          - pattern-either:
              - pattern: requests.request($M, $URL, ...)
              - pattern: httpx.request($M, $URL, ...)
              - pattern: urllib.request.urlopen($URL, ...)
              - pattern: urllib.request.Request($URL, ...)
              - pattern: urllib.request.urlretrieve($URL, ...)
          - focus-metavariable: $URL

  - id: codewatch.python.web.regex-injection
    mode: taint
    languages: [python]
    severity: WARNING
    message: >-
      Data from the HTTP request is used as a regular expression, so a user can send a pattern that takes
      exponential time to match (ReDoS) or matches more than intended. Escape it with re.escape(), or match
      literally with `in`.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data used as a regular expression
      cwe: ["CWE-730: OWASP Top Ten 2004 Category A9 - Denial of Service", "CWE-1333: Inefficient Regular Expression Complexity"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://owasp.org/www-community/attacks/Regular_expression_Denial_of_Service_-_ReDoS
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *known-safe
      - pattern: re.escape(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: re.$FUNC($PATTERN, ...)
              - pattern: regex.$FUNC($PATTERN, ...)
          - metavariable-regex: {metavariable: $FUNC, regex: ^(compile|search|match|fullmatch|findall|finditer|sub|subn|split)$}
          - focus-metavariable: $PATTERN

  - id: codewatch.python.web.log-injection
    mode: taint
    languages: [python]
    severity: INFO
    message: >-
      Data from the HTTP request is written to the log as it is, so a value with line breaks can forge log
      entries in a plain-text log. Strip or escape CR and LF first (or log repr(value)).
    # For review: whether a forged line matters depends on the log format (JSON logs escape it) and who reads it.
    metadata:
      category: security
      subcategory: [audit]
      type: security_hotspot
      title: Request data written to the log unescaped
      cwe: ["CWE-117: Improper Output Neutralization for Logs"]
      owasp: ["A09:2025 - Security Logging and Alerting Failures"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
    pattern-sources: *web-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - *validated-guard
      - *known-safe
      - pattern: repr(...)
      - pattern: json.dumps(...)
      - patterns:
          - pattern: $S.replace($NL, ...)
          - metavariable-regex: {metavariable: $NL, regex: '\\[rn]'}
    # The message itself, or a later argument that a %s in a literal format string inserts as it is (%r and %d
    # don't let a line break through).
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: logging.$LEVEL($MSG, ...)
              - patterns:
                  - pattern: $LOGGER.$LEVEL($MSG, ...)
                  - metavariable-regex: &logger-name {metavariable: $LOGGER, regex: '(?i)^(.*\.)?_?(log|logger|logging|\w+_log(ger)?)$'}
          - metavariable-regex: &log-level {metavariable: $LEVEL, regex: ^(debug|info|warning|warn|error|critical|exception|fatal)$}
          - focus-metavariable: $MSG
      - patterns:
          - pattern-either:
              - pattern: logging.$LEVEL("$FMT", ..., $ARG, ...)
              - patterns:
                  - pattern: $LOGGER.$LEVEL("$FMT", ..., $ARG, ...)
                  - metavariable-regex: *logger-name
          - metavariable-regex: *log-level
          - metavariable-regex: {metavariable: $FMT, regex: '%-?\d*s'}
          - focus-metavariable: $ARG
