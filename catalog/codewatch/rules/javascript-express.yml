# codewatch Express/Node injection rules: request data reaching a shell command, a file path or an outgoing URL
# through the module shapes javascript-taint.yml's command-injection, path-traversal and ssrf rules don't resolve:
# `node:` module specifiers, fs/promises and fs-extra, promisified exec, execa with a shell, and the HTTP clients
# called directly (superagent(url), needle(method, url), undici, ky). The sinks are disjoint from those rules', so
# a line is reported once. The sources and sanitizers are a copy of javascript-taint.yml's (YAML anchors don't
# cross files); tests/test_javascript_express.py checks the copy stays the same.
rules:
  - id: codewatch.js.express.command-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Data from the request reaches a shell command. Call execFile()/spawn() with an argument array and no
      shell, so the value can't add commands.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data in a shell command
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"]
      owasp: ["A05:2025 - Injection"]
      references:
        - https://nodejs.org/api/child_process.html#child_processexecfilefile-args-options-callback
    pattern-sources: &js-sources
      - &src-request-field
        patterns:
          - pattern-either:
              - pattern: $REQ.$FIELD
              - pattern: $REQ.$FIELD.$ANY
          - metavariable-regex: {metavariable: $REQ, regex: '^(req|request|ctx|ctx\.request|context\.req)$'}
          - metavariable-regex:
              metavariable: $FIELD
              regex: '^(body|query|params|cookies|headers|path|url|originalUrl|baseUrl|hostname|files|file)$'
      # NocoBase resource actions (Koa): ctx.action.params holds the request's filter, values and query.
      # Added for GHSA-p849-8hwh-84j9 (cve-pairs-javascript).
      - &src-resource-action-params
        pattern-either:
          - pattern: ctx.action.params
          - pattern: ctx.action?.params
          - pattern: ctx.action.params.$ANY
          - pattern: ctx.action?.params.$ANY
      # A name destructured with a default, `const { filter = {} } = req.body`: Semgrep's taint loses it there.
      # Added for GHSA-p849-8hwh-84j9 (cve-pairs-javascript).
      - &src-destructured-default
        patterns:
          - pattern-either:
              - pattern-inside: |
                  const {..., $X = $D, ...} = $RHS;
                  ...
              - pattern-inside: |
                  let {..., $X = $D, ...} = $RHS;
                  ...
          - pattern: $X
          - metavariable-pattern:
              metavariable: $RHS
              pattern-either:
                - pattern-either:
                    - pattern: ctx.action.params
                    - pattern: ctx.action?.params
                    - pattern: ctx.action.params ?? $E
                    - pattern: ctx.action?.params ?? $E
                    - pattern: ctx.action.params || $E
                    - pattern: ctx.action?.params || $E
                - patterns:
                    - pattern-either:
                        - pattern: $REQ.$FIELD
                        - pattern: $REQ.$FIELD ?? $E
                        - pattern: $REQ.$FIELD || $E
                    - metavariable-regex: {metavariable: $REQ, regex: '^(req|request|ctx|ctx\.request|context\.req)$'}
                    - metavariable-regex: {metavariable: $FIELD, regex: '^(body|query|params|cookies|headers|files|file)$'}
      # Exact: the call's value, not its argument. Otherwise `request.header('accept')` with `request` the incoming
      # request also matched the request library's request.$METHOD(url) sink around its own argument (immich).
      - &src-request-getter
        patterns:
          - pattern: $REQ.$GETTER(...)
          - metavariable-regex: {metavariable: $REQ, regex: '^(req|request|ctx|ctx\.request)$'}
          - metavariable-regex: {metavariable: $GETTER, regex: '^(get|header|param|cookies|json|text|formData)$'}
        exact: true
      - &src-search-params
        pattern: new URLSearchParams(...).get(...)
      - &src-url-search-params
        pattern: $URL.searchParams.get(...)
      # Handlers that destructure the request: ({ params, body }: Request, res) => ...
      - &src-destructured-request
        patterns:
          - pattern-either:
              - pattern-inside: '({..., $FIELD, ...}: Request, ...) => { ... }'
              - pattern-inside: 'function $F({..., $FIELD, ...}: Request, ...) { ... }'
              - pattern-inside: '$APP.$METHOD($PATH, ..., ({..., $FIELD, ...}, $RES, ...) => { ... })'
          - pattern: $FIELD
          - metavariable-regex: {metavariable: $FIELD, regex: '^(body|query|params|cookies|headers|files|file)$'}
      # NestJS controller parameters: @Body() dto, @Query('q') q, @Param('id') id, @Headers() headers. Not those a
      # pipe or a number/boolean/Date type converts (ParseIntPipe, `id: number` under ValidationPipe's transform).
      - &src-nest-param
        patterns:
          - pattern-inside: |
              $M(..., @$DEC(...) $PARAM, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(..., ParseIntPipe, ...) $PARAM, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(..., new ParseIntPipe(...), ...) $PARAM, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(..., ParseFloatPipe, ...) $PARAM, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(..., new ParseFloatPipe(...), ...) $PARAM, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(..., ParseBoolPipe, ...) $PARAM, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(..., new ParseBoolPipe(...), ...) $PARAM, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(..., ParseUUIDPipe, ...) $PARAM, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(..., new ParseUUIDPipe(...), ...) $PARAM, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(..., ParseEnumPipe, ...) $PARAM, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(..., new ParseEnumPipe(...), ...) $PARAM, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(...) $PARAM: number, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(...) $PARAM: boolean, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(...) $PARAM: Date, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(...) $PARAM: bigint, ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(...) $PARAM: number[], ...) { ... }
          - pattern-not-inside: |
              $M(..., @$DEC(...) $PARAM: boolean[], ...) { ... }
          - pattern: $PARAM
          - metavariable-regex: {metavariable: $DEC, regex: '^(Body|Query|Param|Headers)$'}
    pattern-sanitizers: &js-sanitizers
      - &san-numeric
        pattern-either:
          - pattern: parseInt(...)
          - pattern: parseFloat(...)
          - pattern: Number(...)
          - pattern: Number.parseInt(...)
          - pattern: Number.parseFloat(...)
          - pattern: Boolean(...)
          - pattern: Math.$F(...)
          - pattern: $X.length
          - pattern: typeof $X
      # Functions named as validators (isValid, validateId, sanitizeName, escapeHtml, outline's getValidatedHost)
      # return checked data.
      - &san-named
        patterns:
          - pattern: $CHECK(...)
          - metavariable-regex: {metavariable: $CHECK, regex: '(?i)(.*\.)?(get_?)?(is_?valid|validat|sanitiz|escape|clean|safe|whitelist|allowlist)\w{0,40}$'}
      # [allowed].includes(x) ? x : fallback only ever yields an allowed value.
      - &san-allowlist-ternary
        pattern: '$ALLOWED.includes($X) ? $X : $FALLBACK'
      # A cookie the server signed holds what the server stored there, like a session (wiki.js reads its login
      # flow back with Fastify's req.unsignCookie(raw)); req.signedCookies (Express) isn't a source for the same reason.
      - &san-signed
        pattern: $REQ.unsignCookie(...)
      # A check on the value that bails out: if (!next.startsWith("/") || next.startsWith("//")) return ...
      - &san-guard
        pattern-either:
          # A named check that said no ends the request: `if (!isValidRedirectUrl(url)) { ...; return; }` (actual).
          # Not in that branch itself, and only a check named for it (`if (!url) return` says nothing).
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      if (!$CHECK(..., $X, ...)) { ... return ...; }
                      ...
                  - pattern-inside: |
                      if (!$CHECK(..., $X, ...)) { ... return; }
                      ...
                  - pattern-inside: |
                      if (!$CHECK(..., $X, ...)) return ...;
                      ...
                  - pattern-inside: |
                      if (!$CHECK(..., $X, ...)) { ... throw $E; }
                      ...
                  - pattern-inside: |
                      if (!$CHECK(..., $X, ...)) throw $E;
                      ...
              - pattern-not-inside: |
                  if (!$CHECK(..., $X, ...)) { ... }
              - pattern-not-inside: |
                  if (!$CHECK(..., $X, ...)) $STMT;
              - metavariable-regex:
                  metavariable: $CHECK
                  regex: '(?i)^(.*\.)?(is|check|can)\w{0,30}(safe|valid|allowed|permitted|trusted|whitelist|allowlist)\w{0,30}$'
              - pattern: $X
          - patterns:
            - pattern-either:
                - pattern-inside: |
                    if (<... $X.startsWith(...) ...>) { ... return ...; }
                    ...
                - pattern-inside: |
                    if (<... $X.startsWith(...) ...>) return ...;
                    ...
                - pattern-inside: |
                    if (<... $X.startsWith(...) ...>) { ... throw $E; }
                    ...
                - pattern-inside: |
                    if (<... $X.startsWith(...) ...>) throw $E;
                    ...
                - pattern-inside: |
                    if (<... $X.endsWith(...) ...>) { ... return ...; }
                    ...
                - pattern-inside: |
                    if (<... $X.endsWith(...) ...>) return ...;
                    ...
                - pattern-inside: |
                    if (<... $X.endsWith(...) ...>) { ... throw $E; }
                    ...
                - pattern-inside: |
                    if (<... $X.endsWith(...) ...>) throw $E;
                    ...
                - pattern-inside: |
                    if (<... $X.includes(...) ...>) { ... return ...; }
                    ...
                - pattern-inside: |
                    if (<... $X.includes(...) ...>) return ...;
                    ...
                - pattern-inside: |
                    if (<... $X.includes(...) ...>) { ... throw $E; }
                    ...
                - pattern-inside: |
                    if (<... $X.includes(...) ...>) throw $E;
                    ...
                - pattern-inside: |
                    if (<... $ALLOWED.includes($X) ...>) { ... return ...; }
                    ...
                - pattern-inside: |
                    if (<... $ALLOWED.includes($X) ...>) return ...;
                    ...
                - pattern-inside: |
                    if (<... $ALLOWED.includes($X) ...>) { ... throw $E; }
                    ...
                - pattern-inside: |
                    if (<... $ALLOWED.includes($X) ...>) throw $E;
                    ...
                - pattern-inside: |
                    if (<... $ALLOWED.has($X) ...>) { ... return ...; }
                    ...
                - pattern-inside: |
                    if (<... $ALLOWED.has($X) ...>) return ...;
                    ...
                - pattern-inside: |
                    if (<... $ALLOWED.has($X) ...>) { ... throw $E; }
                    ...
                - pattern-inside: |
                    if (<... $ALLOWED.has($X) ...>) throw $E;
                    ...
                - pattern-inside: |
                    if (<... $RE.test($X) ...>) { ... return ...; }
                    ...
                - pattern-inside: |
                    if (<... $RE.test($X) ...>) return ...;
                    ...
                - pattern-inside: |
                    if (<... $RE.test($X) ...>) { ... throw $E; }
                    ...
                - pattern-inside: |
                    if (<... $RE.test($X) ...>) throw $E;
                    ...
                - pattern-inside: |
                    if (<... $X.match(...) ...>) { ... return ...; }
                    ...
                - pattern-inside: |
                    if (<... $X.match(...) ...>) return ...;
                    ...
                - pattern-inside: |
                    if (<... $X.match(...) ...>) { ... throw $E; }
                    ...
                - pattern-inside: |
                    if (<... $X.match(...) ...>) throw $E;
                    ...
            - pattern: $X
      # What a file contains is the server's data, whatever path was used to read it (path-traversal checks the path).
      - &san-file-content
        pattern-either:
          - pattern: fs.readFile(...)
          - pattern: fs.readFileSync(...)
          - pattern: fs.promises.readFile(...)
          - pattern: readFile(...)
          - pattern: readFileSync(...)
      # What a helper looks up with the request value (outline's loadPublicShare by share id) is stored data: the
      # variable assigned from a getX/fetchX/loadX/findX/lookupX call, not the call, so a sink among its arguments
      # still counts. Request-shaped names (getQuery, getRedirectUrl) aren't lookups; a project helper the
      # returner pass finds returning request data still counts (summaries.without_lookup_result).
      - &san-lookup-result
        patterns:
          - pattern-either:
              - pattern-inside: |
                  $RESULT = $LOOKUP(...);
                  ...
              - pattern-inside: |
                  $RESULT = await $LOOKUP(...);
                  ...
          - pattern: $RESULT
          - metavariable-regex:
              metavariable: $LOOKUP
              regex: '^_?(get|fetch|load|find|lookup)(?!(Json|Data|Params?|Args?|Query|Queries|Headers?|Cookies?|Body|Form|Fields?|Values?|Inputs?|Text|Str|String|Url|Uri|Path|File|Filename|Name|Key|Id|Var|Env|Config|Setting|Content|Request|Req|Payload|Redirect|Next|Return|Target|Dest|Destination|Location|Callback|Referr?er|Host|Origin)([A-Z]|$))[A-Z]\w*$'
    pattern-sinks:
      # node:child_process, however it's bound. Semgrep resolves require('child_process') and its imports to
      # child_process.exec, which javascript-taint.yml covers, but not the `node:` specifier.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $CP = require("node:child_process");
                  ...
              - pattern-inside: |
                  import * as $CP from "node:child_process";
                  ...
              - pattern-inside: |
                  import $CP from "node:child_process";
                  ...
          - pattern: $CP.$EXEC($CMD, ...)
          - metavariable-regex: {metavariable: $EXEC, regex: '^(exec|execSync)$'}
          - focus-metavariable: $CMD
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $CP = require("node:child_process");
                  ...
              - pattern-inside: |
                  import * as $CP from "node:child_process";
                  ...
              - pattern-inside: |
                  import $CP from "node:child_process";
                  ...
          - pattern-either:
              - pattern: '$CP.$SPAWN($CMD, ..., {..., shell: true, ...})'
              - pattern: '$CP.$SPAWN($PROG, [..., $CMD, ...], {..., shell: true, ...})'
              - pattern: '$CP.$SPAWN("=~/^(\/bin\/|\/usr\/bin\/)?(sh|bash|zsh|dash|cmd|cmd\.exe|powershell)$/", [..., $CMD, ...], ...)'
          - metavariable-regex: {metavariable: $SPAWN, regex: '^(spawn|spawnSync|execFile|execFileSync)$'}
          - focus-metavariable: $CMD
      - patterns:
          - pattern: require("node:child_process").$EXEC($CMD, ...)
          - metavariable-regex: {metavariable: $EXEC, regex: '^(exec|execSync)$'}
          - focus-metavariable: $CMD
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import { $EXEC } from "node:child_process";
                  ...
              - pattern-inside: |
                  const { $EXEC } = require("node:child_process");
                  ...
          - pattern: $EXEC($CMD, ...)
          - metavariable-regex: {metavariable: $EXEC, regex: '^(exec|execSync)$'}
          - focus-metavariable: $CMD
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import { $SPAWN } from "node:child_process";
                  ...
              - pattern-inside: |
                  const { $SPAWN } = require("node:child_process");
                  ...
          - pattern-either:
              - pattern: '$SPAWN($CMD, ..., {..., shell: true, ...})'
              - pattern: '$SPAWN($PROG, [..., $CMD, ...], {..., shell: true, ...})'
              - pattern: '$SPAWN("=~/^(\/bin\/|\/usr\/bin\/)?(sh|bash|zsh|dash|cmd|cmd\.exe|powershell)$/", [..., $CMD, ...], ...)'
          - metavariable-regex: {metavariable: $SPAWN, regex: '^(spawn|spawnSync|execFile|execFileSync)$'}
          - focus-metavariable: $CMD
      # const run = util.promisify(exec); await run(cmd)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $RUN = util.promisify($EXEC);
                  ...
              - pattern-inside: |
                  $RUN = promisify($EXEC);
                  ...
          - pattern: $RUN($CMD, ...)
          - metavariable-pattern:
              metavariable: $EXEC
              pattern-either:
                - pattern: exec
                - pattern: $CP.exec
                - pattern: require("$M").exec
          - focus-metavariable: $CMD
      # execa runs the program directly unless told to use a shell; execaCommand splits a whole command line.
      - patterns:
          - pattern-either:
              - pattern: '$EXECA($CMD, ..., {..., shell: true, ...})'
              - pattern: '$EXECA($PROG, [..., $CMD, ...], {..., shell: true, ...})'
              - pattern: '$EXECA("=~/^(\/bin\/|\/usr\/bin\/)?(sh|bash|zsh|dash|cmd|cmd\.exe|powershell)$/", [..., $CMD, ...], ...)'
          - metavariable-regex: {metavariable: $EXECA, regex: '^(execa|execaSync)$'}
          - focus-metavariable: $CMD
      - patterns:
          - pattern-either:
              - pattern: execaCommand($CMD, ...)
              - pattern: execaCommandSync($CMD, ...)
              - pattern: execa.commandSync($CMD, ...)
          - focus-metavariable: $CMD

  - id: codewatch.js.express.path-traversal
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Data from the request is used as a file path, so "../" can reach files outside the intended folder. Take
      path.basename() of it, or resolve it and check the result is inside the base folder (path.relative()).
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Request data used as a file path
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"]
      owasp: ["A01:2025 - Broken Access Control"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Nodejs_Security_Cheat_Sheet.html
        - https://expressjs.com/en/api.html#res.sendFile
    pattern-sources: *js-sources
    # javascript-taint.yml's path-traversal sanitizers.
    pattern-sanitizers:
      - *san-numeric
      - *san-named
      - *san-allowlist-ternary
      - *san-guard
      - *san-signed
      - *san-lookup-result
      - pattern: path.basename(...)
      # multer and express-fileupload take the file name through busboy, which drops any directory part.
      - pattern-either:
          - pattern: $REQ.file.originalname
          - pattern: $REQ.files.$FIELD.name
          - pattern: $REQ.files[$FIELD].originalname
          - pattern: $REQ.files[$FIELD].name
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      const $F = $REQ.files.$FIELD;
                      ...
                  - pattern-inside: |
                      let $F = $REQ.files.$FIELD;
                      ...
                  - pattern-inside: |
                      const $F = $REQ.files[$FIELD];
                      ...
              - pattern-either:
                  - pattern: $F.name
                  - pattern: $F.originalname
      # if (!resolved.startsWith(base)) return/throw ...
      - patterns:
          - pattern-inside: |
              if (<... !$X.startsWith(...) ...>) { ... }
              ...
          - pattern: $X
    pattern-sinks:
      # A file module bound to a name other than fs/fsPromises (javascript-taint.yml matches fs.readFile and the
      # like by that name): const fsp = require('fs/promises'), import fse from 'fs-extra', node:fs.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $FS = require("$MOD");
                  ...
              - pattern-inside: |
                  import * as $FS from "$MOD";
                  ...
              - pattern-inside: |
                  import $FS from "$MOD";
                  ...
          - pattern: $FS.$FN($PATH, ...)
          - metavariable-regex: {metavariable: $MOD, regex: '^(node:)?fs(/promises)?$|^(fs-extra|graceful-fs)$'}
          - metavariable-regex: {metavariable: $FS, regex: '^(?!(fs|fsPromises)$)[A-Za-z_$][\w$]*$'}
          # Semgrep also binds a destructured name to itself (const { readFile } = require('fs') as readFile.readFile).
          - metavariable-comparison: {comparison: str($FS) != str($FN)}
          - metavariable-regex: &fs-path-fns
              metavariable: $FN
              regex: '^(readFile|readFileSync|createReadStream|writeFile|writeFileSync|createWriteStream|appendFile|appendFileSync|unlink|unlinkSync|rm|rmSync|readdir|readdirSync|open|openSync|copyFile|copyFileSync|rename|renameSync|mkdir|mkdirSync|rmdir|rmdirSync|cp|cpSync|opendir|opendirSync|truncate|truncateSync|symlink|symlinkSync|remove|removeSync|outputFile|outputFileSync|outputJson|outputJsonSync|outputJSON|readJson|readJsonSync|readJSON|writeJson|writeJsonSync|writeJSON|copy|copySync|move|moveSync|emptyDir|emptyDirSync|ensureFile|ensureFileSync|ensureDir|ensureDirSync|mkdirp|mkdirs)$'
          - focus-metavariable: $PATH
      # Named fs/fsPromises: only the functions javascript-taint.yml's list leaves out.
      - patterns:
          - pattern-either:
              - pattern: fs.$FN($PATH, ...)
              - pattern: fs.promises.$FN($PATH, ...)
              - pattern: fsPromises.$FN($PATH, ...)
          - metavariable-regex: &fs-extra-fns
              metavariable: $FN
              regex: '^(mkdir|mkdirSync|rmdir|rmdirSync|cp|cpSync|opendir|opendirSync|truncate|truncateSync|symlink|symlinkSync|remove|removeSync|outputFile|outputFileSync|outputJson|outputJsonSync|outputJSON|readJson|readJsonSync|readJSON|writeJson|writeJsonSync|writeJSON|copy|copySync|move|moveSync|emptyDir|emptyDirSync|ensureFile|ensureFileSync|ensureDir|ensureDirSync|mkdirp|mkdirs)$'
          - focus-metavariable: $PATH
      # require('fs').createReadStream(p), inline.
      - patterns:
          - pattern: require("$MOD").$FN($PATH, ...)
          - metavariable-regex: {metavariable: $MOD, regex: '^(node:)?fs(/promises)?$|^(fs-extra|graceful-fs)$'}
          - metavariable-regex: *fs-path-fns
          - focus-metavariable: $PATH
      # import { readFile } from 'fs/promises'. Semgrep resolves names imported from plain 'fs' to fs.readFile.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import { $FN } from "$MOD";
                  ...
              - pattern-inside: |
                  const { $FN } = require("$MOD");
                  ...
          - pattern: $FN($PATH, ...)
          - metavariable-regex: {metavariable: $MOD, regex: '^node:fs(/promises)?$|^fs/promises$|^(fs-extra|graceful-fs)$'}
          - metavariable-regex: *fs-path-fns
          - focus-metavariable: $PATH
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import { $FN } from "fs";
                  ...
              - pattern-inside: |
                  const { $FN } = require("fs");
                  ...
          - pattern: $FN($PATH, ...)
          - metavariable-regex: *fs-extra-fns
          - focus-metavariable: $PATH
      # The destination of a move or copy: fs.rename(upload.path, path.join(dir, req.body.name)).
      - patterns:
          - pattern-either:
              - pattern: $FS.$FN($SRC, $PATH, ...)
              - pattern: $FN($SRC, $PATH, ...)
          - metavariable-regex: {metavariable: $FN, regex: '^(rename|renameSync|copyFile|copyFileSync|cp|cpSync|copy|copySync|move|moveSync|symlink|symlinkSync)$'}
          - metavariable-regex: {metavariable: $FS, regex: '^(fs|fsPromises|fsp|fse|fsExtra|fs\.promises)$'}
          - focus-metavariable: $PATH
      # res.sendFile(p, options) without a root, or with a callback: javascript-taint.yml covers the one-argument
      # call. With root, send rejects "..".
      - patterns:
          - pattern-either:
              - pattern: '$RES.sendFile($PATH, {...}, ...)'
              - pattern: '$RES.sendFile($PATH, function (...) { ... })'
              - pattern: '$RES.sendFile($PATH, (...) => $BODY)'
          - pattern-not: '$RES.sendFile($PATH, {..., root: $ROOT, ...}, ...)'
          - metavariable-regex: {metavariable: $RES, regex: '^(res|response|reply)$'}
          - focus-metavariable: $PATH

  - id: codewatch.js.express.ssrf
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Data from the request decides which URL the server fetches, so it can be pointed at internal services or
      cloud metadata endpoints. Fetch only from hosts on an exact allowlist, and resolve and block private addresses.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Server-side request to a URL from the request
      cwe: ["CWE-918: Server-Side Request Forgery (SSRF)"]
      owasp: ["A01:2025 - Broken Access Control"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
    pattern-sources: *js-sources
    # javascript-taint.yml's ssrf sanitizers.
    pattern-sanitizers:
      - *san-numeric
      - *san-named
      - *san-allowlist-ternary
      - *san-guard
      - *san-signed
      - *san-file-content
      - *san-lookup-result
      # Only the path or query is user data when the scheme and host are fixed in front of it: a literal
      # "https://host/", or a constant base (PAYPAL_API_URL, process.env.X, config.x) then "/" (proshop-v2:
      # `${PAYPAL_API_URL}/v2/checkout/orders/${id}`).
      - patterns:
          - pattern: $URL
          - metavariable-pattern:
              metavariable: $URL
              patterns:
                - pattern: '`...`'
                - pattern-regex: '^`(https?://[^/`$]+|\$\{\s*([A-Z][A-Z0-9_]*|process\.env\.\w+|(this\.)?(config|env|conf|settings)(\.\w+)+)\s*\})/'
      - patterns:
          - pattern: $PREFIX + $X
          - metavariable-regex: {metavariable: $PREFIX, regex: '^[''"]https?://[^/''"]+/'}
    pattern-sinks:
      # Clients called directly, which javascript-taint.yml only matches through a method (superagent.get(url),
      # needle.get(url)): superagent(url), needle('get', url), ky(url).
      - patterns:
          - pattern-either:
              - pattern: superagent($URL, ...)
              - pattern: superagent($METHOD, $URL, ...)
              - pattern: needle($METHOD, $URL, ...)
              - pattern: needle.request($METHOD, $URL, ...)
              - pattern: ky($URL, ...)
              - patterns:
                  - pattern-either:
                      - pattern: needle.$VERB($URL, ...)
                      - pattern: ky.$VERB($URL, ...)
                  - metavariable-regex: {metavariable: $VERB, regex: '^(post|put|patch|delete|head)$'}
              - patterns:
                  - pattern: ky.get($URL, ...)
          - pattern-not: superagent("$LITERAL", $URL, ...)
          - focus-metavariable: $URL
      # undici through its module object, or a name imported under another name: undici.request(url),
      # import { fetch as ufetch } from 'undici'. javascript-taint.yml's fetch(url) and request(url) cover the
      # plain names.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $U = require("undici");
                  ...
              - pattern-inside: |
                  import * as $U from "undici";
                  ...
              - pattern-inside: |
                  import $U from "undici";
                  ...
          - pattern: $U.$FN($URL, ...)
          - metavariable-regex: {metavariable: $FN, regex: '^(request|fetch|stream|pipeline|connect)$'}
          - focus-metavariable: $URL
      - patterns:
          - pattern: require("undici").$FN($URL, ...)
          - metavariable-regex: {metavariable: $FN, regex: '^(request|fetch|stream|pipeline|connect)$'}
          - focus-metavariable: $URL
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import { $IMP as $FN } from "undici";
                  ...
              - pattern-inside: |
                  const { $IMP: $FN } = require("undici");
                  ...
          - pattern: $FN($URL, ...)
          - metavariable-regex: {metavariable: $IMP, regex: '^(request|fetch|stream|pipeline|connect)$'}
          - metavariable-regex: {metavariable: $FN, regex: '^(?!(request|fetch)$)'}
          - focus-metavariable: $URL
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import { $FN } from "undici";
                  ...
              - pattern-inside: |
                  const { $FN } = require("undici");
                  ...
          - pattern: $FN($URL, ...)
          - metavariable-regex: {metavariable: $FN, regex: '^(stream|pipeline|connect)$'}
          - focus-metavariable: $URL
