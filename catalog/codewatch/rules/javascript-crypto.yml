# codewatch built-in rules for misused cryptography, TLS, tokens and request metadata in JavaScript/TypeScript:
# calls that are wrong whatever data reaches them, so they are reported as vulnerabilities.
rules:
  - id: codewatch.js.tls-verification-disabled
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Certificate verification is switched off, so anyone on the network path can impersonate the server. Keep it
      on; for a private CA pass its certificate (ca: fs.readFileSync(...)) instead.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: TLS certificate verification disabled
      cwe: ["CWE-295: Improper Certificate Validation"]
      owasp: ["A04:2025 - Cryptographic Failures"]
      references:
        - https://nodejs.org/api/tls.html#tlsconnectoptions-callback
    pattern-either:
      - pattern: '{..., rejectUnauthorized: false, ...}'
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = 0

  - id: codewatch.js.weak-cipher
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      This cipher doesn't protect the data: DES, 3DES, RC4 and Blowfish are broken, ECB leaks patterns, and
      createCipher() derives a weak key with no IV. Use createCipheriv("aes-256-gcm", key, randomIv).
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Weak cipher or ECB mode
      cwe: ["CWE-327: Use of a Broken or Risky Cryptographic Algorithm"]
      owasp: ["A04:2025 - Cryptographic Failures"]
      references:
        - https://nodejs.org/api/crypto.html#cryptocreatecipherivalgorithm-key-iv-options
    pattern-either:
      - pattern: crypto.createCipher(...)
      - pattern: crypto.createDecipher(...)
      - patterns:
          - pattern-either:
              - pattern: crypto.createCipheriv("$ALGO", ...)
              - pattern: crypto.createDecipheriv("$ALGO", ...)
          - metavariable-regex: {metavariable: $ALGO, regex: '(?i)^(des|des-.*|des3|rc2.*|rc4.*|bf.*|blowfish.*|cast.*|idea.*|seed.*|.*-ecb)$'}

  - id: codewatch.js.static-iv
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      The IV is a constant, so equal plaintexts encrypt equally (and GCM/CTR key streams repeat). Use
      crypto.randomBytes() for every message and store the IV with the ciphertext.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Constant IV
      cwe: ["CWE-329: Generation of Predictable IV with CBC Mode", "CWE-1204: Generation of Weak Initialization Vector (IV)"]
      owasp: ["A04:2025 - Cryptographic Failures"]
      references:
        - https://nodejs.org/api/crypto.html#cryptocreatecipherivalgorithm-key-iv-options
    pattern-either:
      - patterns:
          - pattern: crypto.createCipheriv($ALGO, $KEY, $IV, ...)
          - metavariable-pattern:
              metavariable: $IV
              pattern-either: &js-constant-bytes
                - pattern: '"..."'
                - pattern: Buffer.from("...", ...)
                - pattern: Buffer.alloc($N)
                - pattern: Buffer.alloc($N, ...)
                - pattern: new Uint8Array($N)
      - patterns:
          - pattern: crypto.createCipheriv($ALGO, $KEY, $IV, ...)
          - pattern-inside: |
              const $IV = $INIT
              ...
          - metavariable-pattern:
              metavariable: $INIT
              pattern-either: *js-constant-bytes

  - id: codewatch.js.jwt-insecure
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Tokens are signed or accepted with the "none" algorithm, or decoded without verifying the signature, so
      anyone can forge one. Sign and verify with a real algorithm and pass algorithms: [...] to verify().
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: JWT without signature verification
      cwe: ["CWE-347: Improper Verification of Cryptographic Signature"]
      owasp: ["A07:2025 - Authentication Failures"]
      references:
        - https://github.com/auth0/node-jsonwebtoken#jwtverifytoken-secretorpublickey-options-callback
    pattern-either:
      - pattern: 'jwt.sign($PAYLOAD, $KEY, {..., algorithm: "none", ...}, ...)'
      - pattern: 'jwt.verify($TOKEN, $KEY, {..., algorithms: [..., "none", ...], ...}, ...)'

  - id: codewatch.js.hardcoded-jwt-secret
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      The JWT signing secret is written in the code, so anyone with the source can mint valid tokens. Load it from
      configuration or a secret store, and rotate it if this was ever committed.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Hard-coded JWT secret
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2025 - Authentication Failures"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    pattern-either:
      - pattern: jwt.sign($PAYLOAD, "...", ...)
      - pattern: jwt.verify($TOKEN, "...", ...)

  - id: codewatch.js.weak-random-secret
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Math.random() is predictable, and here it makes a token, password or id that an attacker must not guess.
      Use crypto.randomBytes(), crypto.randomUUID() or crypto.getRandomValues().
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Math.random() used for a secret
      cwe: ["CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"]
      owasp: ["A04:2025 - Cryptographic Failures"]
      references:
        - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Math/random
    patterns:
      - pattern: Math.random()
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  function $FN(...) { ... }
              - metavariable-regex: {metavariable: $FN, regex: &secret-name '(?i).*(token|secret|passw|nonce|salt|otp|csrf|session_?id|api_?key|auth|cred|uuid).*'}
          - patterns:
              - pattern-inside: |
                  const $FN = (...) => { ... }
              - metavariable-regex: {metavariable: $FN, regex: *secret-name}
          - patterns:
              - pattern-inside: |
                  $FN(...) { ... }
              - metavariable-regex: {metavariable: $FN, regex: *secret-name}
          - patterns:
              - pattern-inside: const $VAR = <... Math.random() ...>
              - metavariable-regex: {metavariable: $VAR, regex: *secret-name}
          - patterns:
              - pattern-inside: $OBJ.$VAR = <... Math.random() ...>
              - metavariable-regex: {metavariable: $VAR, regex: *secret-name}

  - id: codewatch.js.rate-limit-spoofable-key
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      The rate limit is keyed on X-Forwarded-For, which the client sets, so changing the header resets the limit.
      Key on req.ip with Express's "trust proxy" set to your actual proxy count.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: Rate limit keyed on a client-controlled header
      cwe: ["CWE-348: Use of Less Trusted Source", "CWE-307: Improper Restriction of Excessive Authentication Attempts"]
      owasp: ["A07:2025 - Authentication Failures"]
      references:
        - https://express-rate-limit.mintlify.app/reference/configuration#keygenerator
        - https://expressjs.com/en/guide/behind-proxies.html
    patterns:
      - pattern-inside: $LIMIT({...})
      - metavariable-regex: {metavariable: $LIMIT, regex: '(?i)^(.*\.)?(rate_?limit|ratelimiter|slow_?down|limiter)\w{0,20}$'}
      - pattern-either:
          - pattern: $HEADERS["=~/(?i)^x-forwarded-for$/"]
          - pattern: $REQ.get("=~/(?i)^x-forwarded-for$/")
          - pattern: $REQ.header("=~/(?i)^x-forwarded-for$/")

  - id: codewatch.js.xml-external-entities
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      External entities are expanded for this XML, so a crafted document can read local files or make network
      requests (XXE). Leave noent off.
    metadata:
      category: security
      subcategory: [vuln]
      type: vulnerability
      title: XML parsed with external entities enabled
      cwe: ["CWE-611: Improper Restriction of XML External Entity Reference"]
      owasp: ["A02:2025 - Security Misconfiguration"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html
    pattern-either:
      - pattern: '$LIB.parseXml($XML, {..., noent: true, ...})'
      - pattern: '$LIB.parseXmlString($XML, {..., noent: true, ...})'
