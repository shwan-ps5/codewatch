[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codewatch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6",
    "ruff",
    "radon",
    "bandit",
    "lizard",
    "pip-audit",
    "complexipy",
    "basedpyright",
    "detect-secrets",
    "markdown-it-py",
    "PyYAML",
    "defusedxml",
]

[project.scripts]
codewatch = "core.client:main"
codewatch-scan = "core.client:scan_main"
codewatch-mcp = "core.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-django", "coverage"]
mcp = ["mcp>=1.30,<2"]

[tool.setuptools.packages.find]
include = ["core*", "codewatch*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "codewatch.settings"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["core/migrations"]

[tool.ruff.lint]
# The same families codewatch's scanner adds (core/analyzers/python_tools.py), so local lint matches scans.
extend-select = [
    "B", "SIM", "C4", "PERF", "RET", "ARG", "ERA", "FIX", "PLE", "PLW", "PLR", "PIE", "RUF", "DTZ", "BLE",
    "TRY", "ASYNC", "DJ", "LOG", "G", "INT", "EXE", "T10",
]
# Django model Meta/choices attributes are idiomatic class-level lists; the rest mirror the scanner's ignores.
extend-ignore = ["RUF012", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLR0914", "PLR0917", "TRY003"]

[tool.ruff.lint.per-file-ignores]
# Mirrors the scanner: test helpers and fixtures take arguments they don't use.
"tests/**" = ["ARG"]
